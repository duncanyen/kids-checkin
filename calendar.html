<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script src="js/theme-bootstrap.js"></script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./Nexus.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nexus">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#10b981">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus - 行事曆</title>
    <link rel="icon" href="Nexus.png" type="image/jpeg">
    <link rel="stylesheet" href="css/calendar.css">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #ecfdf5;
            --danger: #ef4444;
            --weekend-color: #ef4444;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --bg-color: #f8fafc;
            --today-bg: #fffbeb;
            --public-event: #3b82f6;
            --private-event: #8b5cf6;
            --border-color: #e5e7eb;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 12px 0; /* 移除左右 padding 以達到滿版 */
            color: var(--text-main); 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        
        /* 為了讓頂部導覽列不貼邊，稍微加一點 padding */
        .top-nav-wrapper {
            padding: 0 12px;
            width: 100%;
        }
    </style>
    <link rel="stylesheet" href="css/nexus-theme.css">
    <script type="module" src="js/ui-icons.js"></script>
    <link rel="stylesheet" href="css/app-navigation.css">
    <script type="module" src="js/app-navigation.js"></script>
</head>
<body data-app-page="calendar">
    <div class="top-nav-wrapper">
        <div class="top-nav">
            <button class="btn-back" id="btnBack" data-main-menu-back>返回主選單</button>
            <div class="nav-actions">
                <button class="btn-icon-nav" id="btnToggleView" title="切換視圖">🔄</button>
                <button class="btn-icon-nav" id="btnSettings" title="視圖設定">⚙️</button>
            </div>
        </div>
    </div>

    <!-- 支援左右滑動切換的容器 (現在已設定為滿版) -->
    <div class="view-container" id="calendarSwipeContainer">
        <div class="calendar-header">
            <span id="calendarTitle">載入中...</span>
        </div>

        <!-- 月視圖區塊 -->
        <div id="monthViewContainer">
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- 週視圖區塊 -->
        <div id="weekViewContainer">
            <div class="calendar-grid" id="weekGrid"></div>
        </div>

        <!-- 日視圖區塊 -->
        <div id="dayViewContainer">
            <div class="day-timeline-container" id="dayTimeline">
                <!-- 時間線動態生成 -->
            </div>
        </div>
    </div>

    <!-- 視圖設定 Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content" style="max-height: 50vh;">
            <h3 class="modal-title">日曆視圖設定</h3>
            <div class="modal-body">
                <p style="font-size: 14px; color: var(--text-sub); margin-bottom: 15px;">請勾選希望啟用的視圖模式：</p>
                <label class="checkbox-label"><input type="checkbox" id="settingViewMonth" checked> 顯示 月視圖</label>
                <label class="checkbox-label"><input type="checkbox" id="settingViewWeek" checked> 顯示 週視圖</label>
                <label class="checkbox-label"><input type="checkbox" id="settingViewDay" checked> 顯示 日視圖</label>
            </div>
            <div class="modal-btns">
                <button class="btn-save" id="btnSaveSettings">確定</button>
            </div>
        </div>
    </div>

    <!-- 共用 Modal (BottomSheet) -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h3 class="modal-title" id="modalDateTitle">2026-09-16</h3>
            
            <div class="modal-body">
                <!-- 視圖 1：當日待辦清單 -->
                <div id="listView">
                    <div class="day-event-list" id="dayEventsContainer"></div>
                    <button class="btn-add-new" id="btnShowAddForm">➕ 新增待辦事項</button>
                </div>

                <!-- 視圖 2：新增/編輯表單 -->
                <div id="formView" style="display: none;">
                    <div class="form-group">
                        <label>行程標題</label>
                        <input type="text" id="evTitle" placeholder="例如: 班親會、繳電話費">
                    </div>
                    
                    <div class="row-group" style="margin-bottom: 14px;">
                        <div class="form-group">
                            <label>分類圖示</label>
                            <select id="evCategory">
                                <option value="school">🏫 學校</option>
                                <option value="company">💼 公司</option>
                                <option value="restaurant">🍽️ 餐廳</option>
                                <option value="birthday">🎂 生日</option>
                                <option value="personal">👤 個人</option>
                                <option value="other">📌 其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>權限</label>
                            <select id="evVisibility">
                                <option value="public">🌐 全體</option>
                                <option value="private">🔒 僅自己</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="evIsAllDay" checked> 這是全天活動
                        </label>
                    </div>

                    <div class="row-group" id="timeInputsGroup" style="display: none; margin-bottom: 14px;">
                        <div class="form-group">
                            <label>開始時間</label>
                            <input type="time" id="evStartTime" value="09:00">
                        </div>
                        <div class="form-group">
                            <label>結束時間</label>
                            <input type="time" id="evEndTime" value="10:00">
                        </div>
                    </div>

                    <div class="row-group" style="margin-bottom: 14px;">
                        <div class="form-group" style="flex: 0.6;">
                            <label>提前提醒</label>
                            <input type="number" id="evReminderVal" value="" min="1" disabled placeholder="無">
                        </div>
                        <div class="form-group">
                            <label>單位</label>
                            <select id="evReminderUnit">
                                <option value="none">不提醒</option>
                                <option value="minutes">分鐘</option>
                                <option value="hours">小時</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>備註說明 (選填)</label>
                        <textarea id="evDesc" rows="2" placeholder="詳細內容..."></textarea>
                    </div>
                </div>
            </div>

            <!-- 按鈕區塊 -->
            <div class="modal-btns">
                <button class="btn-cancel" id="btnCloseModal">關閉</button>
                <button class="btn-cancel" id="btnCancelForm" style="display:none;">取消編輯</button>
                <button class="btn-save" id="btnSaveEvent" style="display:none;">儲存</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/calendar.js"></script>
</body>
</html>
