<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./Nexus.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nexus">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#10b981">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="css/farm-village.css">
    <link rel="stylesheet" href="css/farm-atmosphere.css">
    <link rel="stylesheet" href="css/farm-mail.css">
    <link rel="stylesheet" href="css/farm-guard-dogs.css">
    <title>Nexus 咕咕村落 - Phaser 版</title>
    <!-- 引入 Phaser 3 遊戲引擎 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="css/farm-loading.css">
   
    <link rel="stylesheet" href="css/farm-layout.css">
</head>
<body>
    <div class="farm-loading" data-farm-loading>
        <section class="farm-loading-card" aria-labelledby="farmLoadingTitle">
            <p class="farm-loading-kicker">NEXUS · 我們的農莊</p>
            <h1 id="farmLoadingTitle">咕咕村落</h1>
            <div class="farm-loading-path">
                <div class="farm-loading-walker-lane" aria-hidden="true"><div class="farm-loading-walker">
                    <canvas width="72" height="72" hidden></canvas>
                    <svg data-loading-hen-fallback viewBox="0 0 72 72" fill="none"><path d="M26 56l-2 9m17-9 3 9m-24 0h10m9 0h10" stroke="#ad7639" stroke-width="3" stroke-linecap="round"/><path d="M18 35 8 26l1 20c2 17 34 21 45 4 8-12 6-25-4-25-9 0-12 8-12 8-5-5-14-5-20 2Z" fill="#fff2d4" stroke="#725034" stroke-width="2"/><path d="M43 25c-3-9 2-13 6-8 0-9 8-8 8 0 8-5 10 4 4 8" fill="#c45540" stroke="#725034" stroke-width="2"/><path d="m59 33 9 4-9 3" fill="#d9a144" stroke="#725034" stroke-width="2"/><circle cx="53" cy="31" r="2.5" fill="#493526"/><path d="M24 38c12-5 21 9 10 14-7 3-15-4-10-14Z" fill="#f5dca9" stroke="#b98d55" stroke-width="1.5"/></svg>
                </div></div>
                <div class="farm-loading-track" role="progressbar" aria-label="農莊載入進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="farm-loading-fill"></div></div>
                <div class="farm-loading-endpoints" aria-hidden="true"><span>0%</span><span>100%</span></div>
            </div>
            <p class="farm-loading-percent" data-loading-percent>0%</p>
            <p class="farm-loading-status" data-loading-status role="status" aria-live="polite">準備進入農莊</p>
            <button class="farm-loading-retry" data-loading-retry type="button" hidden>重新載入</button>
            <a class="farm-loading-back" href="games.html">返回遊戲區</a>
        </section>
    </div>
    <div class="top-nav">
        <button class="btn-back" onclick="window.location.href='games.html'">❮ 返回遊戲區</button>
        <div>
            <strong id="playerName">載入中...</strong> 的農莊
        </div>
    </div>

    <div id="farm-atmosphere" class="farm-atmosphere" data-active="false" hidden>
        <span data-climate-label role="status" aria-live="polite">🌿 村落氣候</span>
        <span data-climate-clock>進入農莊後顯示當地氣候</span>
    </div>

    <!-- 遊戲會被渲染在這個 div 裡面 -->
    <div id="game-container"></div>

     <script type="module" src="./js/farm/entry.js"></script>
</body>
</html>
