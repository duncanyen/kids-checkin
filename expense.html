<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="modulepreload" href="js/navigation-config.js">
    <script src="js/theme-bootstrap.js"></script>
    <script>
    { const ledgerToday = new Date();
    document.documentElement.style.setProperty('--ledger-week-count', Math.ceil((new Date(ledgerToday.getFullYear(), ledgerToday.getMonth(), 1).getDay() + new Date(ledgerToday.getFullYear(), ledgerToday.getMonth() + 1, 0).getDate()) / 7)); }
    // Reserve navigation space and hide the return link before the first paint.
    // This reads layout context only; page permissions and data still initialize normally.
    try { if (new URLSearchParams(location.search).get('nav') === '1' && JSON.parse(sessionStorage.getItem('familyCheckInUser') || localStorage.getItem('familyCheckInUser') || 'null')?.accountId) document.documentElement.dataset.navigationEntry = 'nav'; } catch {}
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./Nexus.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nexus">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#10b981">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus - 記帳本</title>
    <link rel="icon" href="homebase_icon.jpg" type="image/jpeg">
    
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- Charts load on demand after the ledger data, without blocking the shell. -->
    <link rel="stylesheet" href="css/expense.css">
    <link rel="stylesheet" href="css/nexus-theme.css">
    <script type="module" src="js/ui-icons.js"></script>
    <link rel="stylesheet" href="css/app-navigation.css">
    <script type="module" src="js/app-navigation.js"></script>
</head>
<body data-app-page="finance">

    <div class="top-nav">
        <button class="btn-back" data-main-menu-back onclick="window.location.href='index.html'">返回主選單</button>
        <div class="page-title"><span data-ui-icon="finance"></span>記帳本</div>
        <button aria-label="帳本設定" data-ui-icon="settings" class="btn-settings" onclick="openModal('settingsModal')" style="background:transparent; border:none; font-size:calc(20px * var(--n-font-scale, 1)); cursor:pointer;"></button>
    </div>

    <section class="ledger-mode-picker" aria-label="選擇帳本">
        <button type="button" id="ledgerMode-group" class="scope-btn active" data-ledger-mode aria-pressed="true" disabled onclick="switchLedgerMode('group')">群組記帳</button>
        <button type="button" id="ledgerMode-personal" class="scope-btn" data-ledger-mode aria-pressed="false" disabled onclick="switchLedgerMode('personal')">個人記帳</button>
    </section>
    <p id="ledgerStatus" class="ledger-status" role="status">正在讀取帳本設定…</p>

    <!-- 頂部 Tab 切換 -->
    <div class="view-tabs">
        <button id="tabCalendar" class="view-tab-btn" onclick="switchMainView('calendar')">月曆模式</button>
        <button id="tabList" class="view-tab-btn active" onclick="switchMainView('list')">清單模式</button>
        <button id="tabReview" class="view-tab-btn" onclick="switchMainView('review')">回顧</button>
    </div>

    <!-- ============================================== -->
    <!-- [視圖 1] 月曆與圓餅圖 (月曆模式) -->
    <!-- ============================================== -->
    <div id="calendarView" class="main-container" style="display:none;">
        <!-- 月曆區塊 -->
        <div class="calendar-card">
            <div class="month-selector">
                <button class="month-btn" onclick="changeMonth(-1)">❮</button>
                <div class="current-month" id="calendarMonthTitle">載入中...</div>
                <button class="month-btn" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="calendar-grid" id="calendarGrid" data-loading>
                <div class="weekday">日</div><div class="weekday">一</div><div class="weekday">二</div>
                <div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday">六</div>
            </div>
        </div>

        <!-- 圖表分析區塊 -->
        <div class="chart-card">
            <!-- 群組與個人切換區 -->
            <div class="scope-tabs">
                <button id="btnScopeGroup" class="scope-btn active" onclick="switchScope('group')"><span id="chartGroupLabel">群組全部</span></button>
                <button id="btnScopePersonal" class="scope-btn" onclick="switchScope('personal')">依記帳人篩選</button>
            </div>
            <!-- 個人大頭照列表 -->
            <div id="avatarContainer" class="avatar-container"></div>

            <div class="stats-overview">
                <div class="stat-box active-expense" id="statBoxExpense" onclick="switchChartType('expense')">
                    <div class="stat-label">當月總支出</div>
                    <div class="stat-amount expense" id="monthTotalExpense">讀取中...</div>
                </div>
                <div class="stat-box" id="statBoxIncome" onclick="switchChartType('income')">
                    <div class="stat-label">當月總收入</div>
                    <div class="stat-amount income" id="monthTotalIncome">讀取中...</div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="expensePieChart"></canvas>
            </div>
        </div>
    </div>

    <section id="listView" class="main-container ledger-list-view" aria-label="收支清單">
        <div class="ledger-list-card">
            <div class="ledger-period">
                <button type="button" class="month-btn" aria-label="上個月" onclick="changeMonth(-1)">❮</button>
                <label class="ledger-month-picker">
                    <span id="listPeriodText">載入中…</span>
                    <input id="listPeriod" type="month" min="1900-01" max="9999-12" aria-label="選擇年月" onchange="selectListMonth()">
                </label>
                <button type="button" class="month-btn" aria-label="下個月" onclick="changeMonth(1)">❯</button>
            </div>
            <p class="ledger-scope-note">所屬群組的當月紀錄 · 點選明細查看當日紀錄</p>
            <div class="type-toggle" aria-label="清單收支類型">
                <button id="listExpenseTab" class="type-btn active expense" onclick="switchListType('expense')" aria-pressed="true">支出</button>
                <button id="listIncomeTab" class="type-btn require-income" onclick="switchListType('income')" aria-pressed="false">收入</button>
            </div>
            <div class="ledger-total" aria-live="polite">
                <span id="listTotalLabel">當月總支出</span>
                <strong id="listTotal" class="expense">讀取中...</strong>
                <span id="listCount"></span>
            </div>
            <div id="ledgerList" aria-live="polite"></div>
            <nav class="ledger-pagination" aria-label="記帳清單分頁">
                <button id="listPrevious" type="button" onclick="changeListPage(-1)">上一頁</button>
                <span id="listPageStatus" aria-live="polite"></span>
                <button id="listNext" type="button" onclick="changeListPage(1)">下一頁</button>
            </nav>
            <button type="button" id="retryListMonth" class="ledger-retry" hidden onclick="retryListMonth()">重新載入</button>
        </div>
        <div class="ledger-add-actions">
            <button type="button" id="addListIncome" class="ledger-fab income require-income" aria-label="新增收入" onclick="openListEntry('income')"><span aria-hidden="true">+</span></button>
            <button type="button" id="addListExpense" class="ledger-fab expense" aria-label="新增支出" onclick="openListEntry('expense')"><span aria-hidden="true">+</span></button>
        </div>
    </section>

    <!-- ============================================== -->
    <!-- [視圖 2] 回顧分析頁面 (回顧模式) -->
    <!-- ============================================== -->
    <div id="reviewView" class="main-container" style="display:none;">
        
        <!-- 1. 本月收支區塊 -->
        <div class="review-card">
            <div class="review-card-title">📌 本月收支狀況</div>
            <div class="summary-grid">
                <div class="summary-item full-width require-income">
                    <div class="summary-label">本月結餘 (收入 - 支出)</div>
                    <div class="summary-val bal" id="revThisMonthBalance">NT$ 0</div>
                </div>
                <div class="summary-item require-income">
                    <div class="summary-label">總收入</div>
                    <div class="summary-val inc" id="revThisMonthIncome">NT$ 0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">總支出</div>
                    <div class="summary-val exp" id="revThisMonthExpense">NT$ 0</div>
                </div>
            </div>
        </div>

        <!-- 2. 最新6個月分析 (長條圖) -->
        <div class="review-card">
            <div class="review-card-title">📈 近半年支出趨勢</div>
            <div class="bar-chart-container">
                <canvas id="sixMonthBarChart"></canvas>
            </div>
            <div id="chartAnalysisText" class="chart-analysis">分析載入中...</div>
        </div>

        <!-- 3. 累計區塊 (年度篩選) -->
        <div class="review-card">
            <div class="review-card-title">
                <span>🏦 累計財務總覽</span>
                <select id="reviewYearFilter" class="year-select" onchange="renderReviewYearData()"></select>
            </div>
            <div class="summary-grid">
                <div class="summary-item full-width">
                    <div class="summary-label" id="revYearTitle">年度累計</div>
                    <div class="summary-val exp" id="revYearExpense">支: $0</div>
                    <div class="summary-val inc require-income" id="revYearIncome">收: $0</div>
                    <div class="summary-label require-income" style="margin-top:8px;">結餘: <span id="revYearBalance" style="color:var(--primary-color);font-size:calc(14px * var(--n-font-scale, 1));">$0</span></div>
                </div>
            </div>
        </div>

        <!-- 4. 月度清單列表 -->
        <div class="review-card">
            <div class="review-card-title">🗓️ 歷史月度清單</div>
            <div class="month-list-container" id="monthlyHistoryList">
                <div style="text-align:center; color:#999; font-size:calc(14px * var(--n-font-scale, 1));">資料載入中...</div>
            </div>
        </div>

    </div>

    <!-- ============================================== -->
    <!-- 記帳與明細 Modal -->
    <!-- ============================================== -->
    <div class="modal" id="expenseModal" role="dialog" aria-modal="true" aria-labelledby="modalDateTitle">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-date" id="modalDateTitle">選擇日期</div>
                <button class="btn-close" onclick="closeModal('expenseModal')">✕</button>
            </div>
            <div class="input-group">
                <label class="cat-form-label" for="expenseDate">記帳日期</label>
                <input type="date" id="expenseDate" class="note-input" onchange="changeEntryDate()">
            </div>
            <!-- 收支切換 -->
            <div class="type-toggle">
                <button id="btnTypeExpense" class="type-btn active expense" onclick="switchModalType('expense')">支出</button>
                <button id="btnTypeIncome" class="type-btn" onclick="switchModalType('income')">收入</button>
            </div>
            <!-- 分類選擇 (已移除新增按鈕) -->
            <div class="category-grid" id="categoryGrid"></div>
            <!-- 金額與備註 -->
            <div class="input-group">
                <div class="amount-input-wrapper expense" id="amountWrapper">
                    $ <input type="number" id="expenseAmount" aria-label="金額" min="0.01" step="0.01" placeholder="0" inputmode="decimal">
                </div>
            </div>
            <div class="input-group">
                <label for="expenseNote" class="cat-form-label">名稱（選填）</label>
                <input type="text" id="expenseNote" class="note-input" maxlength="100" placeholder="可先留空，之後再補上">
            </div>
            <p id="entryStatus" class="ledger-entry-status" role="status"></p>
            <button class="btn-save expense" id="btnSaveExpense">儲存紀錄</button>
            
            <div class="day-list-title">當日明細</div>
            <div id="dayExpenseList"></div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- 設定 (類別管理) Modal -->
    <!-- ============================================== -->
    <div class="modal" id="settingsModal" style="z-index: 3000;">
        <div class="modal-content" style="max-height: 80vh;">
            <div class="modal-header">
                <div class="modal-date"><span data-ui-icon="settings" aria-hidden="true"></span> 帳本設定</div>
                <button class="btn-close" onclick="closeModal('settingsModal')">✕</button>
            </div>
            <div class="settings-content">
                <div class="ledger-preferences">
                    <label for="homepageLedgerSource">Nexus 首頁本月累計支出</label>
                    <select id="homepageLedgerSource"><option value="group">群組記帳</option><option value="personal">個人記帳</option></select>
                    <label for="defaultLedgerMode">進入記帳本的預設模式</label>
                    <select id="defaultLedgerMode"><option value="group">群組記帳</option><option value="personal">個人記帳</option></select>
                    <button type="button" id="saveLedgerPreferences" class="btn-save">儲存帳本設定</button>
                    <p id="preferencesStatus" role="status"></p>
                </div>
                <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                    <span id="categoryScopeLabel" style="font-weight:bold;">群組帳自訂類別</span>
                    <button class="btn-add-cat" onclick="openModal('customCatModal')" style="background: var(--primary-color); color: white; border: none; padding: 5px 10px; border-radius: 8px; cursor:pointer;">+ 新增類別</button>
                </div>
                <div id="manageCategoryList" style="display:flex; flex-direction:column; gap:10px;"></div>
            </div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- 新增/修改自訂類別 Modal -->
    <!-- ============================================== -->
    <div class="modal" id="customCatModal" style="z-index: 3001;">
        <div class="modal-content" style="max-width: 400px; margin: 0 auto; border-radius: 20px;">
            <div class="modal-header">
                <div class="modal-date" id="catModalTitle">新增自訂類別</div>
                <button class="btn-close" onclick="closeModal('customCatModal')">✕</button>
            </div>
            <div class="type-toggle" id="catTypeToggle">
                <button id="btnCatTypeExpense" class="type-btn active expense" onclick="switchCatModalType('expense')">支出</button>
                <button id="btnCatTypeIncome" class="type-btn" onclick="switchCatModalType('income')">收入</button>
            </div>
            <input type="hidden" id="editCatId">
            <div class="input-group">
                <label class="cat-form-label">類別名稱 (必填)</label>
                <input type="text" id="newCatName" class="note-input" placeholder="例如：寵物、咖啡...">
            </div>
            <div class="input-group">
                <label class="cat-form-label" id="categoryIconLabel">分類圖示</label>
                <input type="hidden" id="newCatIcon" value="package">
                <div id="newCatIconPicker" class="category-icon-picker" role="radiogroup" aria-labelledby="categoryIconLabel"></div>
                <span id="newCatIconPreview" class="category-icon-preview" aria-label="目前圖示"></span>
            </div>
            <div class="input-group" style="text-align: center; margin: 15px 0;">
                <span style="font-size:calc(13px * var(--n-font-scale, 1)); color:#888;">--- 或 ---</span>
            </div>
            <div class="input-group">
                <label class="cat-form-label">上傳代表照片 (選填)</label>
                <input type="file" id="newCatImage" accept="image/*" class="note-input" style="padding: 5px;">
                <div style="font-size:calc(11px * var(--n-font-scale, 1)); color:#999; margin-top:4px;">系統會自動壓縮，不佔用空間</div>
            </div>
            <button class="btn-save expense" id="btnSaveCustomCat">儲存類別</button>
        </div>
    </div>

    <script type="module" src="js/expense.js?v=personal-ledger1"></script>
</body>
</html>
