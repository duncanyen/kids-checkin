<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus - 串聯生活的每一個節點</title>
    <link rel="icon" href="Nexus.png" type="image/jpeg">
    <link rel="apple-touch-icon" href="Nexus.png">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #ecfdf5;
            --accent: #f59e0b;
            --danger: #ef4444;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --menu-width: 280px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; margin: 0; padding: 15px; color: var(--text-main); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        
        /* 登入畫面 */
        #loginSection { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; text-align: center; animation: fadeIn 0.4s ease-out; }
        .login-logo-wrapper { width: 90px; height: 90px; background: white; border-radius: 28px; box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center; font-size: 45px; margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.04); }
        .login-title { color: var(--text-main); font-size: 28px; font-weight: 800; margin-bottom: 6px; }
        .login-subtitle { color: var(--text-sub); font-size: 15px; margin-bottom: 40px; }
        .custom-logo { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
        
        .user-selection { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 400px; width: 100%; }
        .user-card { cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); text-align: center; background: white; padding: 24px 12px; border-radius: 20px; box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,0.04); }
        .user-card:active { transform: scale(0.96); background: #f9fafb; }
        .avatar-img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); margin-bottom: 12px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }
        .user-name-title { font-size: 16px; font-weight: 700; color: var(--text-main); }

        /* 密碼彈窗 */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 5000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px 24px; border-radius: 24px; width: 90%; max-width: 340px; box-shadow: var(--shadow-lg); position: relative; }
        .modal-content.text-center { text-align: center; }
        .pin-input { font-size: 26px; letter-spacing: 12px; text-align: center; width: 100%; padding: 14px; margin: 20px 0; border: 2px solid #e5e7eb; border-radius: 14px; outline: none; background: #f9fafb; }
        .modal-btns { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
        .modal-btns button { flex: 1; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .modal-btns button:active { transform: scale(0.95); }

        /* 主選單 Dashboard */
        #dashboardView { display: none; max-width: 480px; margin: 0 auto; animation: fadeIn 0.3s ease-out; }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
        .app-brand { font-size: 24px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 28px; height: 28px; object-fit: cover; border-radius: 6px; }
        .hamburger-btn { font-size: 26px; cursor: pointer; color: var(--text-main); padding: 4px; transition: 0.2s; }
        .hamburger-btn:active { opacity: 0.5; }
        
        .current-user-badge { background: white; padding: 6px 14px 6px 6px; border-radius: 30px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid rgba(0,0,0,0.04); }
        .mini-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .user-badge-name { font-size: 15px; font-weight: 800; color: var(--text-main); }

        /* === 側邊選單 Sidebar === */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 3000; opacity: 0; visibility: hidden; transition: 0.3s ease; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar { position: fixed; top: 0; left: -100%; width: var(--menu-width); height: 100%; background: white; z-index: 3100; box-shadow: 2px 0 15px rgba(0,0,0,0.1); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar.active { left: 0; }
        
        /* 側邊選單 - 個人檔案區 */
        .sidebar-profile { background: linear-gradient(135deg, #059669 0%, #10b981 100%); padding: 40px 20px 20px; text-align: center; position: relative; color: white; }
        .sidebar-avatar-wrapper { position: relative; display: inline-block; margin-bottom: 12px; }
        .sidebar-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid white; box-shadow: var(--shadow-sm); }
        .sidebar-edit-btn { position: absolute; bottom: 0; right: 0; background: white; color: var(--primary-dark); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: var(--shadow-sm); cursor: pointer; border: none; }
        .sidebar-edit-btn:active { transform: scale(0.9); }
        .sidebar-username { font-size: 20px; font-weight: 800; }
        .sidebar-role { font-size: 13px; opacity: 0.9; margin-top: 4px; }

        /* 側邊選單 - 區塊與列表 */
        .sidebar-section { padding: 16px 0; border-bottom: 1px solid #f1f5f9; }
        .sidebar-title { font-size: 12px; font-weight: 700; color: var(--text-sub); padding: 0 20px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar-item { display: flex; align-items: center; padding: 12px 20px; color: var(--text-main); text-decoration: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .sidebar-item:hover, .sidebar-item:active { background: var(--primary-light); color: var(--primary-dark); }
        .sidebar-icon { font-size: 20px; margin-right: 12px; width: 24px; text-align: center; }

        /* 側邊選單 - 成員群組 */
        .sidebar-members { display: flex; gap: 10px; padding: 10px 20px; overflow-x: auto; scrollbar-width: none; }
        .sidebar-members::-webkit-scrollbar { display: none; }
        .member-avatar-container { text-align: center; flex-shrink: 0; }
        .member-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #e5e7eb; margin-bottom: 4px; }
        .member-name { font-size: 11px; color: var(--text-sub); width: 44px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* === 聯絡我們 表單設計 === */
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 15px; font-family: inherit; transition: 0.2s; background: #f9fafb; }
        .form-control:focus { outline: none; border-color: var(--primary); background: white; }
        textarea.form-control { resize: vertical; min-height: 100px; }

        /* === 今日行程與卡片樣式 === */
        .agenda-card { background: white; border-radius: 20px; padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,0.03); cursor: pointer; transition: all 0.25s ease; }
        .agenda-card:active { transform: scale(0.98); background: #fcfcfc; }
        .agenda-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #e5e7eb; padding-bottom: 8px; margin-bottom: 8px; }
        .agenda-date { font-size: 15px; font-weight: 800; color: var(--primary-dark); }
        .agenda-count { font-size: 12px; font-weight: 700; color: var(--text-sub); background: #f1f5f9; padding: 2px 8px; border-radius: 12px; }
        .agenda-list { display: flex; flex-direction: column; gap: 8px; max-height: 110px; overflow-y: auto; padding-right: 4px; }
        .agenda-list::-webkit-scrollbar { width: 4px; }
        .agenda-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .agenda-item { display: flex; align-items: center; gap: 8px; }
        .agenda-time { font-size: 12px; font-weight: 700; color: var(--text-sub); min-width: 75px; text-align: left; letter-spacing: -0.5px; }
        .agenda-divider { width: 2px; height: 12px; background: #e5e7eb; border-radius: 1px; }
        .agenda-title { flex: 1; font-weight: 700; font-size: 14px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .agenda-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1px solid #e5e7eb; flex-shrink: 0; }
        .agenda-empty { text-align: center; font-size: 14px; font-weight: 600; color: var(--text-sub); padding: 12px 0; }

        /* === Photo Dump 主頁輪播 === */
        .photo-carousel-section { margin-bottom: 16px; }
        .photo-carousel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
        .photo-carousel-title { font-size: 16px; font-weight: 800; color: var(--text-main); }
        .photo-carousel-more { font-size: 13px; color: var(--primary); font-weight: 700; cursor: pointer; }
        .carousel-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; padding-bottom: 8px; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }
        .carousel-item { flex: 0 0 85%; scroll-snap-align: center; background: white; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,0.04); }
        .carousel-img { width: 100%; height: 220px; object-fit: cover; cursor: pointer; display: block; }
        .carousel-info { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
        .carousel-author { display: flex; align-items: center; gap: 8px; }
        .carousel-author-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #eee; }
        .carousel-author-name { font-size: 14px; font-weight: 700; color: var(--text-main); line-height: 1.2; }
        .carousel-date { font-size: 11px; color: var(--text-sub); }
        .like-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #cbd5e1; display: flex; align-items: center; gap: 6px; padding: 0; transition: transform 0.2s; }
        .like-btn:active { transform: scale(0.8); }
        .like-btn.liked { color: var(--danger); }
        .like-count { font-size: 14px; font-weight: 700; color: var(--text-main); }

        /* 動態九宮格 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .dash-card { background: white; border-radius: 20px; padding: 22px 16px; text-align: left; box-shadow: var(--shadow-sm); cursor: pointer; transition: all 0.25s ease; position: relative; border: 1px solid rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; height: 120px; }
        .dash-card:active { transform: scale(0.96); background: #fcfcfc; }
        .dash-icon { font-size: 32px; width: 50px; height: 50px; background: #f3f4f6; display: flex; align-items: center; justify-content: center; border-radius: 14px; }
        .dash-title { font-size: 16px; font-weight: 700; color: var(--text-main); }

        .card-hero { grid-column: span 2; background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: white; height: auto; padding: 24px; flex-direction: row; align-items: center; justify-content: space-between; }
        .card-hero .dash-icon { background: rgba(255,255,255,0.2); width: 64px; height: 64px; border-radius: 18px; }
        .card-admin { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border-color: #bfdbfe; grid-column: span 2; height: auto; flex-direction: row; align-items: center; padding: 18px 22px; }
        .card-admin .dash-icon { background: rgba(37, 99, 235, 0.15); }
        .card-admin .dash-title { color: #1d4ed8; font-size: 17px; }

        .notification-badge { display: none; position: absolute; top: 12px; right: 12px; background-color: var(--danger); color: white; font-size: 12px; font-weight: 800; height: 22px; min-width: 22px; line-height: 22px; border-radius: 11px; padding: 0 6px; text-align: center; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4); }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(4px); justify-content: center; align-items: center; font-size: 16px; font-weight: 700; color: var(--primary); z-index: 6000; flex-direction: column; gap: 12px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingView"><span>處理中，請稍候...</span></div>

    <!-- 隱藏的檔案上傳元件 -->
    <input type="file" id="avatarUploadInput" accept="image/*" style="display:none;">

    <!-- 密碼彈窗 -->
    <div class="modal" id="pinModal">
        <div class="modal-content text-center">
            <h3 id="modalUserTitle" style="margin-top:0; font-size:20px;">請輸入密碼</h3>
            <input type="password" id="pinInput" class="pin-input" maxlength="4" pattern="[0-9]*" inputmode="numeric" onkeypress="handlePinKeyPress(event)">
            <div class="modal-btns">
                <button onclick="closePinModal()" style="background:#f3f4f6; color:var(--text-main);">取消</button>
                <button onclick="verifyPin()" style="background:var(--primary); color:white;">確認</button>
            </div>
        </div>
    </div>

    <!-- 聯絡我們彈窗 -->
    <div class="modal" id="contactModal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-size:20px; border-bottom:1px solid #eee; padding-bottom:12px; margin-bottom:16px;">聯絡 Nexus</h3>
            <div class="form-group">
                <label class="form-label">諮詢類型</label>
                <select id="contactType" class="form-control">
                    <option value="建議">💡 建議</option>
                    <option value="要求">🎯 要求新增功能</option>
                    <option value="異常問題">⚠️ 異常問題回報</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">電子郵件地址 (必填)</label>
                <input type="email" id="contactEmail" class="form-control" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">內容 (必填)</label>
                <textarea id="contactContent" class="form-control" placeholder="請詳細描述您的問題或建議..." required></textarea>
            </div>
            <div class="modal-btns">
                <button onclick="closeContactModal()" style="background:#f3f4f6; color:var(--text-main);">取消</button>
                <button onclick="submitContact()" style="background:var(--primary); color:white;">提交送出</button>
            </div>
        </div>
    </div>

    <!-- 登入畫面 -->
    <div id="loginSection">
        <div class="login-logo-wrapper">
            <img src="Nexus.png" alt="Nexus Logo" class="custom-logo">
        </div>
        <div class="login-title">Nexus</div>
        <div class="login-subtitle">連結彼此的日常 讓心更靠近</div>
        <div class="user-selection" id="userSelectionContainer"></div>
    </div>

    <!-- 主選單 Dashboard -->
    <div id="dashboardView">
        <div class="app-header">
            <div class="app-brand">
                <div class="hamburger-btn" onclick="toggleSidebar()">☰</div>
                <img src="Nexus.png" alt="Logo" class="brand-logo"> Nexus
            </div>
            <div class="current-user-badge" onclick="window.location.href='settings.html'" title="個人設定">
                <img id="dashUserAvatar" class="mini-avatar" src="" alt="">
                <span id="dashUserName" class="user-badge-name"></span>
            </div>
        </div>

        <!-- 1. 今日行程卡片容器 (常駐顯示) -->
        <div id="todayAgendaContainer"></div>
        
        <!-- 3. Photo Dump 照片輪播區 (獨立移出主頁下方) -->
        <div id="photoCarouselSection" class="photo-carousel-section" style="display: none;">
            <div class="photo-carousel-header">
                <div class="photo-carousel-title">最新回憶 📸</div>
                <div class="photo-carousel-more" onclick="window.location.href='gallery.html'">
                    查看相簿 <span id="galleryBadgeText" style="color:var(--danger); display:none;"></span>
                </div>
            </div>
            <div class="carousel-container" id="photoCarouselContainer">
                <!-- 動態載入照片 -->
            </div>
        </div>

        <!-- 功能導覽九宮格 -->
        <div class="dashboard-grid" id="dynamicDashboardGrid"></div>
    </div>

    <!-- 側邊選單 Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-profile">
            <div class="sidebar-avatar-wrapper">
                <img id="sideAvatar" class="sidebar-avatar" src="">
                <!-- 點擊觸發選擇照片 -->
                <button class="sidebar-edit-btn" onclick="triggerAvatarUpload()">✎</button>
            </div>
            <div class="sidebar-username" id="sideUserName"></div>
            <div class="sidebar-role" id="sideUserRole"></div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-title">功能導覽</div>
            <div id="sideMenuFeatureList">
                <!-- 動態載入使用者權限選單 -->
            </div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-title">群組成員</div>
            <div class="sidebar-members" id="sideMembersList">
                <!-- 動態載入群組成員 -->
            </div>
        </div>

        <div class="sidebar-section" style="border-bottom: none;">
            <div class="sidebar-title">關於 Nexus</div>
            <div class="sidebar-item" onclick="openContactModal()">
                <span class="sidebar-icon">📝</span>聯絡我們
            </div>
            <div class="sidebar-item" onclick="rateApp()">
                <span class="sidebar-icon">⭐</span>給予評價支持我們
            </div>
            <div class="sidebar-item" onclick="shareApp()">
                <span class="sidebar-icon">📤</span>推薦 Nexus
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, query, where, doc, serverTimestamp, onSnapshot, getDoc, updateDoc, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCj3XrBxi1c3RokMzCIhEB3hjJB-BPuO9Y",
            authDomain: "homebasedb.firebaseapp.com",
            projectId: "homebasedb",
            storageBucket: "homebasedb.firebasestorage.app",
            messagingSenderId: "476832900272",
            appId: "1:476832900272:web:443bacb7cbc3113e9f8775"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let unreadUnsubscribe = null;
        let galleryUnsubscribe = null;
        let calendarUnsubscribe = null;
        window.selectedUserObj = null;
        window.userAvatarMap = {};
        window.allSystemUsers = [];

        window.onload = async function() {
            const savedUserStr = sessionStorage.getItem('familyCheckInUser');
            if (savedUserStr) {
                document.getElementById('loadingView').style.display = 'flex';
                try {
                    const savedUser = JSON.parse(savedUserStr);
                    const q = query(collection(db, "users"), where("name", "==", savedUser.name));
                    const snap = await getDocs(q);
                    
                    if (snap.empty) {
                        alert("此帳號已失效或被刪除，請重新登入。");
                        sessionStorage.removeItem('familyCheckInUser');
                        document.getElementById('loadingView').style.display = 'none';
                        window.fetchUsersAndRenderLogin();
                    } else {
                        const latestUser = snap.docs[0].data();
                        latestUser.docId = snap.docs[0].id;
                        sessionStorage.setItem('familyCheckInUser', JSON.stringify(latestUser));
                        document.getElementById('loadingView').style.display = 'none';
                        window.showDashboard();
                    }
                } catch (e) {
                    document.getElementById('loadingView').style.display = 'none';
                    window.showDashboard();
                }
            } else {
                window.fetchUsersAndRenderLogin();
            }
        };

        async function recordLog(operatorName, actionType, detailsText) {
            try {
                const now = new Date();
                const datetimeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                await addDoc(collection(db, "logs"), { datetime: datetimeStr, operator: operatorName, actionType, details: detailsText, timestamp: serverTimestamp() });
            } catch (e) {}
        }

        window.fetchUsersAndRenderLogin = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                let users = [];
                if (querySnapshot.empty) {
                    const defaultUsers = [
                        {name: "俊俊", pin: "1234", avatar: "https://ui-avatars.com/api/?name=俊&background=10b981&color=fff", role: "kid"},
                        {name: "程寶", pin: "1234", avatar: "https://ui-avatars.com/api/?name=程&background=10b981&color=fff", role: "kid"},
                        {name: "媽咪", pin: "1234", avatar: "https://ui-avatars.com/api/?name=媽&background=10b981&color=fff", role: "admin"},
                        {name: "爸爸", pin: "1234", avatar: "https://ui-avatars.com/api/?name=爸&background=10b981&color=fff", role: "admin"}
                    ];
                    for (const u of defaultUsers) { 
                        const docRef = await addDoc(collection(db, "users"), u); 
                        u.docId = docRef.id;
                        users.push(u); 
                    }
                } else {
                    querySnapshot.forEach(docSnap => {
                        let u = docSnap.data();
                        u.docId = docSnap.id;
                        users.push(u);
                    });
                }
                window.allSystemUsers = users;
                window.buildUserCards(users);
            } catch (e) { console.error("載入使用者失敗:", e); }
        };

        window.showDashboard = async function() {

        // --- 側邊選單與相片上傳功能 ---

        // 監聽圖片選擇並使用 Canvas 縮放
        document.getElementById('avatarUploadInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loadingView').style.display = 'flex';
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const img = new Image();
                img.onload = async function() {
                    // 設定最大寬高進行壓縮
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 300; 
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 轉為 Base64 格式 (品質0.8)
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    
                    try {
                        const user = JSON.parse(sessionStorage.getItem('familyCheckInUser'));
                        let docRefId = user.docId;
                        if (!docRefId) {
                            const q = query(collection(db, "users"), where("name", "==", user.name));
                            const snap = await getDocs(q);
                            if (!snap.empty) docRefId = snap.docs[0].id;
                        }
                        
                        if (docRefId) {
                            await updateDoc(doc(db, "users", docRefId), { avatar: dataUrl });
                            user.avatar = dataUrl;
                            sessionStorage.setItem('familyCheckInUser', JSON.stringify(user));
                            
                            document.getElementById('dashUserAvatar').src = user.avatar;
                            document.getElementById('sideAvatar').src = user.avatar;
                            alert("頭像更新成功！");
                        }
                    } catch (err) {
                        console.error("更新頭像失敗:", err);
                        alert("更新失敗，請檢查網路連線。");
                    }
                    document.getElementById('loadingView').style.display = 'none';
                    // 清除 input 數值以便下次能選取同一張圖
                    document.getElementById('avatarUploadInput').value = '';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        async function renderDynamicModules(user) {
            const grid = document.getElementById('dynamicDashboardGrid'); 
            const sideList = document.getElementById('sideMenuFeatureList');
            grid.innerHTML = '';
            sideList.innerHTML = '';
            
            const defaultAllowed = ['chat', 'calendar', 'finance', 'photodump', 'gamezone']; 
            const allowedMenus = user.menus || defaultAllowed;

            let modules = {};
            let order = [];

            try {
                const userConfigDoc = await getDoc(doc(db, "userSettings", user.name));
                if (userConfigDoc.exists()) {
                    const data = userConfigDoc.data();
                    if (data.modules) modules = data.modules;
                    if (data.order && Array.isArray(data.order)) {
                        order = data.order.filter(k => allowedMenus.includes(k));
                    }
                }
                allowedMenus.forEach(k => { if (!order.includes(k)) order.push(k); });
            } catch (e) {
                order = [...allowedMenus];
            }

            // 3. 原本的 photodump 卡片已從 grid 移除 (回傳空字串)
            const cardTemplates = {
                chat: () => modules.chat !== false ? `<div class="dash-card card-hero" onclick="window.location.href='chat.html'"><div class="notification-badge" id="chatBadge" style="display:none; top: 16px; right: 16px;">0</div><div><div style="font-size: 20px; font-weight: 800; margin-bottom: 4px;">聊天室</div><div style="font-size: 13px; opacity: 0.9;">隨時隨地與家人保持聯絡</div></div><div class="dash-icon">💬</div></div>` : '',
                checkin: () => modules.checkin !== false ? `<div class="dash-card" onclick="window.location.href='checkin.html'"><div><div class="dash-icon">📍</div></div><div class="dash-title">到家打卡</div></div>` : '',
                calendar: () => modules.calendar !== false ? `
                    <div class="dash-card" onclick="window.location.href='calendar.html'">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; width:100%;">
                            <div class="dash-icon">📅</div>
                            <div id="calendarAlertsArea" style="display:flex; gap:4px; font-size:18px;"></div>
                        </div>
                        <div class="dash-title">行事曆</div>
                    </div>` : '',
                photodump: () => '', // 不顯示在九宮格
                gamezone: () => modules.gamezone !== false ? `<div class="dash-card" onclick="window.location.href='games.html'"><div><div class="dash-icon">🎮</div></div><div class="dash-title">遊戲區</div></div>` : '',
                wishlist: () => modules.wishlist !== false ? `<div class="dash-card" onclick="window.location.href='wishwall.html'"><div><div class="dash-icon">✨</div></div><div class="dash-title">許願牆</div></div>` : '',
                finance: () => modules.finance !== false ? `<div class="dash-card" onclick="window.location.href='expense.html'"><div><div class="dash-icon">💰</div></div><div class="dash-title">記帳本</div></div>` : ''
            };

            const sideMenuTemplates = {
                chat: `<div class="sidebar-item" onclick="window.location.href='chat.html'"><span class="sidebar-icon">💬</span>聊天室</div>`,
                checkin: `<div class="sidebar-item" onclick="window.location.href='checkin.html'"><span class="sidebar-icon">📍</span>到家打卡</div>`,
                calendar: `<div class="sidebar-item" onclick="window.location.href='calendar.html'"><span class="sidebar-icon">📅</span>行事曆</div>`,
                photodump: `<div class="sidebar-item" onclick="window.location.href='gallery.html'"><span class="sidebar-icon">📸</span>Photo Dump <span id="sideGalleryBadge" style="margin-left:auto; background:var(--danger); color:white; font-size:11px; padding:2px 8px; border-radius:10px; display:none;"></span></div>`,
                gamezone: `<div class="sidebar-item" onclick="window.location.href='games.html'"><span class="sidebar-icon">🎮</span>遊戲區</div>`,
                wishlist: `<div class="sidebar-item" onclick="window.location.href='wishwall.html'"><span class="sidebar-icon">✨</span>許願牆</div>`,
                finance: `<div class="sidebar-item" onclick="window.location.href='expense.html'"><span class="sidebar-icon">💰</span>記帳本</div>`
            };

            order.forEach(modKey => { 
                if (cardTemplates[modKey] && allowedMenus.includes(modKey)) {
                    grid.innerHTML += cardTemplates[modKey](); 
                    if (sideMenuTemplates[modKey]) {
                        sideList.innerHTML += sideMenuTemplates[modKey];
                    }
                }
            });

            if (user.role === 'admin' || user.role === 'parent') {
                grid.innerHTML += `<div class="dash-card card-admin" onclick="window.location.href='admin.html'"><div class="dash-icon">🛡️</div><div style="flex: 1; margin-left: 12px;"><div class="dash-title">管理者後台</div><div style="font-size: 12px; color: var(--text-sub);">系統管理與權限設定</div></div></div>`;
                sideList.innerHTML += `<div class="sidebar-item" onclick="window.location.href='admin.html'" style="color:#1d4ed8;"><span class="sidebar-icon">🛡️</span>管理者後台</div>`;

        window.checkUnreadMessages = function(user) {
            try {
                const q = query(collection(db, "rooms"), where("participants", "array-contains", user.name));
                unreadUnsubscribe = onSnapshot(q, (querySnapshot) => {
                    let totalUnreadMessages = 0;
                    querySnapshot.forEach(docSnap => {
                        const room = docSnap.data();
                        if (room.unreadCount && room.unreadCount[user.name]) {
                            totalUnreadMessages += room.unreadCount[user.name];
                        } else {
                            let lastMsgTime = room.lastMessageTime?.toDate?.()?.getTime() || 0;
                            let myReadTime = room.readTimestamps?.[user.name] || 0;
                            const hasLastMessage = room.lastMessage && room.lastMessage.trim() !== '';
                            const isLastMsgMine = hasLastMessage && room.lastMessage.startsWith(`${user.name}:`);
                            if (hasLastMessage && lastMsgTime > myReadTime && !isLastMsgMine) totalUnreadMessages++;
                        }
                    });
                    const badge = document.getElementById('chatBadge');
                    if (badge) {
                        if (totalUnreadMessages > 0) { badge.style.display = 'block'; badge.innerText = totalUnreadMessages > 99 ? '99+' : totalUnreadMessages; } 
                        else { badge.style.display = 'none'; }
                    }
                });
            } catch (e) {}
        };

        window.checkGalleryUnreads = function(user) {
            try {
                galleryUnsubscribe = onSnapshot(collection(db, "photos"), (snapshot) => {
                    const lastReadTime = parseInt(localStorage.getItem('homebase_photodump_last_read') || '0', 10);
                    let unreadCount = 0;

                    snapshot.forEach(docSnap => {
                        const photo = docSnap.data();
                        const photoTime = photo.timestamp?.toDate?.()?.getTime() || 0;
                        if (photoTime > lastReadTime && photo.uploader !== user.name) unreadCount++;
                    });

                    // 綁定側邊欄與標題的 Badge
                    const badgeText = document.getElementById('galleryBadgeText');
                    const sideBadge = document.getElementById('sideGalleryBadge');
                    
                    if (unreadCount > 0) {
                        if (badgeText) { badgeText.style.display = 'inline'; badgeText.innerText = `(+${unreadCount})`; }
                        if (sideBadge) { sideBadge.style.display = 'inline-block'; sideBadge.innerText = `+${unreadCount}`; }
                    } else {
                        if (badgeText) badgeText.style.display = 'none';
                        if (sideBadge) sideBadge.style.display = 'none';
                    }
                });
            } catch (e) {}
        };

        // 1. 行事曆無論有無行程，上方皆會顯示
        window.checkCalendarAlerts = async function(user) {
            if (Object.keys(window.userAvatarMap).length === 0) {
                try {
                    const usersSnap = await getDocs(collection(db, "users"));
                    usersSnap.forEach(d => { window.userAvatarMap[d.data().name] = d.data().avatar; });
                } catch(e) {}
            }

            const categoryIcons = { school: '🏫', company: '💼', restaurant: '🍽️', birthday: '🎂', personal: '👤', other: '📌' };
            try {
                calendarUnsubscribe = onSnapshot(collection(db, "events"), (snapshot) => {
                    const now = new Date();
                    const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
                    let activeIcons = [];
                    let todayEventsList = [];

                    snapshot.forEach(docSnap => {
                        const evt = docSnap.data();
                        if ((evt.visibility === 'public' || evt.operator === user.name) && evt.date === todayStr) {
                            todayEventsList.push(evt);

                            let start = new Date(now);
                            let end = new Date(now);
                            if (evt.isAllDay !== false) { 
                                start.setHours(0,0,0,0);
                                end.setHours(23,59,59,999);
                            } else {
                                if(evt.startTime) { const [sh, sm] = evt.startTime.split(':'); start.setHours(sh, sm, 0, 0); }
                                if(evt.endTime) { const [eh, em] = evt.endTime.split(':'); end.setHours(eh, em, 0, 0); }
                            }

                            let triggerTime = new Date(start);
                            if (evt.reminderUnit === 'minutes') triggerTime.setMinutes(triggerTime.getMinutes() - (evt.reminderValue || 0));
                            else if (evt.reminderUnit === 'hours') triggerTime.setHours(triggerTime.getHours() - (evt.reminderValue || 0));

                            if (now >= triggerTime && now <= end) activeIcons.push(categoryIcons[evt.category] || '📌');
                        }
                    });

                    const alertsArea = document.getElementById('calendarAlertsArea');
                    if (alertsArea) {
                        alertsArea.innerHTML = activeIcons.map(icon => `<span>${icon}</span>`).join('');
                    }

                    const agendaContainer = document.getElementById('todayAgendaContainer');
                    const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
                    const dateTitle = `${now.getMonth()+1}月${now.getDate()}日 (${weekDays[now.getDay()]})`;
                    
                    let listHtml = '';
                    if (todayEventsList.length > 0) {
                        todayEventsList.sort((a, b) => {
                            if (a.isAllDay && !b.isAllDay) return -1;
                            if (!a.isAllDay && b.isAllDay) return 1;
                            if (a.startTime && b.startTime) return a.startTime.localeCompare(b.startTime);
                            return 0;
                        });

                        listHtml = todayEventsList.map(evt => {
                            let timeStr = (evt.isAllDay !== false) ? '全天' : `${evt.startTime} - ${evt.endTime}`;
                            const avatar = window.userAvatarMap[evt.operator] || `https://ui-avatars.com/api/?name=${evt.operator}&background=e5e7eb`;
                            return `
                                <div class="agenda-item">
                                    <div class="agenda-time">${timeStr}</div>
                                    <div class="agenda-divider"></div>
                                    <div class="agenda-title">${evt.title}</div>
                                    <img class="agenda-avatar" src="${avatar}" alt="${evt.operator}">
                                </div>
                            `;
                        }).join('');
                    } else {
                        // 當今日無行程時的顯示畫面
                        listHtml = `<div class="agenda-empty">今日無行程安排 ☕</div>`;
                    }

                    agendaContainer.innerHTML = `
                        <div class="agenda-card" onclick="localStorage.setItem('calendar_target_date', '${todayStr}'); window.location.href='calendar.html';">
                            <div class="agenda-header">
                                <div class="agenda-date">${dateTitle}</div>
                                <div class="agenda-count">${todayEventsList.length > 0 ? `今天有 ${todayEventsList.length} 個行程` : '自由日'}</div>
                            </div>
                            <div class="agenda-list">
                                ${listHtml}
                            </div>
                        </div>
                    `;
                });
                
                setInterval(() => {
                    if (calendarUnsubscribe) {
                        calendarUnsubscribe();
                        window.checkCalendarAlerts(user);
                    }
                }, 60000);

            } catch (e) { console.error("檢查行事曆提醒失敗", e); }
        };

        // 3. 載入並渲染 Photo Dump 照片輪播
        window.fetchAndRenderPhotoCarousel = function(user) {
            // 抓取最新的 5 張照片
            const q = query(collection(db, "photos"), orderBy("timestamp", "desc"), limit(5));
            onSnapshot(q, (snapshot) => {
                const section = document.getElementById('photoCarouselSection');
                const container = document.getElementById('photoCarouselContainer');
                
                if (snapshot.empty) {
                    section.style.display = 'none';
                    return;
                }

                section.style.display = 'block';
                let html = '';
                
                snapshot.forEach(docSnap => {
                    const photo = docSnap.data();
                    const photoId = docSnap.id;
                    const dateObj = photo.timestamp ? photo.timestamp.toDate() : new Date();
                    const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`;
                    const uploaderAvatar = window.userAvatarMap[photo.uploader] || `https://ui-avatars.com/api/?name=${photo.uploader}&background=e5e7eb`;
                    
                    const likes = photo.likes || [];
                    const isLiked = likes.includes(user.name);
                    const likeCount = likes.length;

                    html += `
                        <div class="carousel-item">
                            <!-- 點擊照片本體進入 gallery.html -->
                            <img class="carousel-img" src="${photo.url}" onclick="window.location.href='gallery.html'">
                            <div class="carousel-info">
                                <div class="carousel-author">
                                    <img class="carousel-author-img" src="${uploaderAvatar}">
                                    <div>
                                        <div class="carousel-author-name">${photo.uploader}</div>
                                        <div class="carousel-date">${dateStr}</div>
                                    </div>
                                </div>
                                <div class="carousel-actions">
                                    <!-- 點讚按鈕 -->
                                    <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="togglePhotoLike('${photoId}')">
                                        ${isLiked ? '❤️' : '♡'} <span class="like-count" style="color: ${isLiked ? 'var(--danger)' : 'var(--text-sub)'}">${likeCount > 0 ? likeCount : '讚'}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        };

        // 相片輪播區按讚功能
        window.togglePhotoLike = async function(photoId) {
            const user = JSON.parse(sessionStorage.getItem('familyCheckInUser'));
            try {
                const photoRef = doc(db, "photos", photoId);
                const photoSnap = await getDoc(photoRef);
                if (photoSnap.exists()) {
                    let likes = photoSnap.data().likes || [];
                    if (likes.includes(user.name)) {
                        likes = likes.filter(n => n !== user.name); // 取消讚
                    } else {
                        likes.push(user.name); // 新增讚
                    }
                    await updateDoc(photoRef, { likes: likes });
                }
            } catch(e) {
                console.error("按讚失敗", e);
            }
        };

    </script>
