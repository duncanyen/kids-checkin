<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeBase - 遊戲區</title>
    <link rel="icon" href="homebase_icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="homebase_icon.jpg">
    <meta name="apple-mobile-web-app-title" content="HomeBase">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- 引入獨立的 CSS 樣式表 -->
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="top-nav">
        <button class="btn-back" id="btnBack">❮ 返回主選單</button>
        <div class="current-user-badge" id="btnLogout">
            <img id="gameUserAvatar" class="mini-avatar" src="" alt="">
            <span id="gameUserName">載入中...</span>
        </div>
    </div>

    <h2 class="system-title" id="gameZoneTitle">🎮 遊戲區</h2>

    <!-- 家長專屬模式切換選單 -->
    <div class="mode-switch-container" id="modeSwitchContainer">
        <button class="btn-switch active" id="btnModeAdmin">🛡️️ 權限管理</button>
        <button class="btn-switch" id="btnModePlay">🎮 親自遊玩</button>
    </div>

    <!-- 遊戲選擇大廳 -->
    <div class="game-lobby" id="gameLobby">
        <div class="game-card-item" onclick="selectGame('rps')">
            <div class="game-card-icon">✊</div>
            <div class="game-card-info">
                <div class="game-card-title">剪刀石頭布對決</div>
                <div class="game-card-desc">經典 PK 挑戰，無限制暢玩！比拼最高積分與連勝紀錄。</div>
            </div>
        </div>
        <div class="game-card-item" onclick="selectGame('g2048')">
            <div class="game-card-icon">🔢</div>
            <div class="game-card-info">
                <div class="game-card-title">2048 數字方塊</div>
                <div class="game-card-desc">動腦益智滑動合併，挑戰群組及全體最高排行榜！</div>
            </div>
        </div>
    </div>

    <!-- 剪刀石頭布遊戲容器 -->
    <div class="sub-game-container" id="kidGameContainer">
        <div class="game-header-actions">
            <button class="btn-return-lobby" onclick="returnToLobby()">❮ 遊戲選擇</button>
            <button class="btn-leaderboard" onclick="openLeaderboard('rps')">🏆 排行榜</button>
        </div>
        <div class="score-board">
            <div class="score-item">
                <div class="score-label">總積分</div>
                <div class="score-value" id="gameTotalScore">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">目前連勝</div>
                <div class="score-value" id="gameStreak" style="color: #e91e63;">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">最高連勝</div>
                <div class="score-value" id="gameMaxStreak" style="color: #f59e0b;">0</div>
            </div>
        </div>

        <div class="game-arena">
            <h3>電腦出牌</h3>
            <div class="card-slot" id="compCard">❓</div>
            <div class="vs-text">VS</div>
            <h3>請選擇你的牌</h3>
            <div class="player-cards">
                <div class="p-card" data-choice="0">✊</div>
                <div class="p-card" data-choice="1">✋</div>
                <div class="p-card" data-choice="2">✌️️</div>
            </div>
            <div class="game-result" id="gameResultText">準備好了嗎？</div>
        </div>
    </div>

    <!-- 2048 遊戲容器 -->
    <div class="sub-game-container" id="g2048Container">
        <div class="game-header-actions" style="max-width: 340px; margin: 0 auto 15px auto;">
            <button class="btn-return-lobby" onclick="returnToLobby()">❮ 遊戲選擇</button>
            <div style="display:flex; gap:8px;">
                <button class="btn-leaderboard" onclick="openLeaderboard('g2048')">🏆 排行</button>
                <button class="btn-restart-2048" onclick="init2048Game()">重來</button>
            </div>
        </div>
        <div class="g2048-header" style="max-width: 340px; margin: 0 auto 10px auto;">
            <div style="font-weight: 800; font-size: 20px; color: #776e65;">2048</div>
            <div class="g2048-scores">
                <div class="g2048-box"><div class="lbl">分數</div><div class="val" id="g2048Score">0</div></div>
                <div class="g2048-box"><div class="lbl">最高分</div><div class="val" id="g2048BestScore">0</div></div>
            </div>
        </div>
        <div class="g2048-board" id="g2048Board"></div>
        <div id="g2048Status" style="font-weight: bold; margin-top: 15px; color: var(--cancel-color); height: 25px;"></div>
    </div>

    <!-- 家長視角：管理面板 -->
    <div id="parentAdminContainer" style="display: none;">
        <div class="admin-panel">
            <div class="admin-title">🛡️ 遊戲進入權限管理</div>
            
            <div class="section-label">1. 選擇群組成員</div>
            <div class="member-chips-container" id="memberChipsList">
                <div class="lb-loading" style="padding:10px;">載入成員中...</div>
            </div>

            <div id="memberPermissionSection" style="display: none;">
                <div class="member-games-container">
                    <div class="selected-member-header">
                        <span id="selectedMemberTitle">成員名稱</span>
                        <span style="font-size:12px; font-weight:normal; color:var(--text-sub);">即時同步生效</span>
                    </div>

                    <div class="game-perm-row">
                        <div class="game-perm-info">
                            <span class="game-perm-icon">✊</span>
                            <span>剪刀石頭布對決</span>
                        </div>
                        <div class="perm-action-group">
                            <button class="btn-perm" id="btnRpsAllow" onclick="setMemberPermission('rps', true)">允許進入</button>
                            <button class="btn-perm" id="btnRpsBan" onclick="setMemberPermission('rps', false)">禁止進入</button>
                        </div>
                    </div>

                    <div class="game-perm-row">
                        <div class="game-perm-info">
                            <span class="game-perm-icon">🔢</span>
                            <span>2048 數字方塊</span>
                        </div>
                        <div class="perm-action-group">
                            <button class="btn-perm" id="btn2048Allow" onclick="setMemberPermission('g2048', true)">允許進入</button>
                            <button class="btn-perm" id="btn2048Ban" onclick="setMemberPermission('g2048', false)">禁止進入</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 排行榜 Modal -->
    <div class="modal-overlay" id="leaderboardModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="lbTitle">🏆 排行榜</h3>
                <button class="btn-close" onclick="closeLeaderboard()">×</button>
            </div>
            <div class="lb-tabs">
                <button class="lb-tab active" id="tabGroup" onclick="loadLeaderboard('group')">群組內排名</button>
                <button class="lb-tab" id="tabGlobal" onclick="loadLeaderboard('global')">全體排名(Top 100)</button>
            </div>
            <ul class="lb-list" id="lbList">
                <div class="lb-loading">載入中...</div>
            </ul>
        </div>
    </div>

    <!-- 引入獨立的 JS 邏輯腳本 -->
    <script type="module" src="game.js"></script>
</body>
</html>
