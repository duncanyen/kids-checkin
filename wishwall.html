<main>
<section id="forestView" class="view"><div class="forest-layout"><div class="scene-wrap"><div id="forestGame" role="img" aria-label="我的森林，三個可種植的位置"></div><div class="scene-caption"><span class="live-dot"></span><span id="sceneMessage">每一株植物，都記得你的努力。</span></div></div><div class="forest-side"><div class="section-heading"><div><p class="eyebrow">A LITTLE EVERY DAY</p><h2>今天，也長大了一點。</h2></div></div><p class="body-copy">不必一次做得很多。讀幾頁書、完成一場考試，讓努力慢慢開花。</p><div class="quick-actions"><button id="openExam"><span class="action-number">01</span><strong>紀錄考試</strong><span>留下每一次進步 →</span></button><button id="openReading"><span class="action-number">02</span><strong>閱讀紀錄</strong><span>讓故事成為養分 →</span></button><button id="openPlants"><span class="action-number">03</span><strong>我的植物</strong><span>看看誰準備開花 →</span></button></div><div class="plot-access" aria-label="種植位置"><button data-plot="0">位置一</button><button data-plot="1">位置二</button><button data-plot="2">位置三</button></div><button id="seedShop" class="outline wide">逛逛種子小舖</button><p class="gentle-note">慢慢來也沒關係，植物不會因為你離線而枯萎。</p></div></div></section>

<section id="rewardsView" class="view" hidden><div class="section-heading"><div><p class="eyebrow">DREAM A LITTLE BIGGER</p><h2>夢想獎勵</h2></div><button id="rewardRequests" class="outline">我的申請</button></div><p id="reservedNote" class="body-copy"></p><div id="rewardList" class="reward-grid"></div></section>
<section id="parentView" class="view" hidden><div class="section-heading"><div><p class="eyebrow">SUPPORT THEIR GROWTH</p><h2>家長管理</h2></div></div><div class="parent-tabs"><button data-parent="records" aria-pressed="true">紀錄與審核</button><button data-parent="overview">成長概覽</button><button data-parent="settings">獎勵規則</button><button data-parent="rewards">夢想獎勵</button><button data-parent="requests">兌換申請</button><button data-parent="transactions">積分明細</button><button data-parent="migration">資料銜接</button></div><div id="parentContent"></div></section>
