<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeBase - 個人設定與版面自訂</title>
    <link rel="icon" href="homebase_icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="homebase_icon.jpg">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #ecfdf5;
            --danger: #ef4444;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: var(--text-main); }
        
        .settings-container { max-width: 500px; margin: 0 auto; animation: fadeIn 0.3s ease-out; }
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .btn-back { background: white; border: 1px solid #e5e7eb; padding: 8px 16px; border-radius: 20px; font-weight: 600; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); }
        
        .section-card { background: white; padding: 24px; border-radius: 22px; box-shadow: var(--shadow-sm); margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.03); }
        .section-title { font-size: 18px; font-weight: 800; margin-top: 0; margin-bottom: 16px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-sub); }
        .form-group input[type="text"], .form-group input[type="password"] { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 15px; outline: none; background: #f9fafb; font-family: inherit; }
        .form-group input:focus { border-color: var(--primary); background: white; }
        
        /* 排序清單 */
        .module-sort-list { display: flex; flex-direction: column; gap: 10px; }
        .module-sort-item { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 12px 16px; border-radius: 14px; border: 1px solid #e2e8f0; font-weight: 700; }
        .module-sort-item div { display: flex; align-items: center; gap: 10px; }
        .module-sort-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
        .order-btns { display: flex; gap: 6px; }
        .order-btn { background: #e2e8f0; border: none; width: 32px; height: 32px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-main); }
        .order-btn:active { background: #cbd5e1; }

        .btn-save { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-logout { width: 100%; background: #fee2e2; color: var(--danger); border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }

        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(4px); justify-content: center; align-items: center; font-size: 16px; font-weight: 700; color: var(--primary); z-index: 4000; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingView"><span>處理中，請稍候...</span></div>

    <div class="settings-container">
        <div class="top-nav">
            <button class="btn-back" onclick="window.location.href='index.html'">❮ 返回主選單</button>
            <span style="font-weight: 800; font-size: 18px;">⚙️ 個人設定</span>
        </div>

        <!-- 基本資料與密碼設定 -->
        <div class="section-card">
            <h3 class="section-title">👤 基本資料與安全</h3>
            <div class="form-group">
                <label>使用者名稱</label>
                <input type="text" id="settingsName" disabled style="background:#eee; color:#888;">
            </div>
            
            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 20px 0;">
            <p style="font-size: 13px; color: var(--text-sub); margin-top: 0; margin-bottom: 14px; font-weight: bold;">修改登入密碼 (需為 4 位數字)</p>

            <div class="form-group">
                <label>請輸入【舊密碼】驗證身分</label>
                <input type="password" id="oldPin" placeholder="請輸入您目前的密碼">
            </div>
            <div class="form-group">
                <label>請輸入【新密碼】</label>
                <input type="password" id="newPin" maxlength="4" pattern="\d*" inputmode="numeric" placeholder="請輸入 4 位數新密碼">
            </div>
            <button class="btn-save" onclick="saveUserProfile()">更新密碼</button>
        </div>

        <!-- 版面模組與順序自訂區塊 -->
        <div class="section-card">
            <h3 class="section-title">🎨 主選單卡片排序</h3>
            <p style="font-size: 13px; color: var(--text-sub); margin-top: 0; margin-bottom: 14px;">您可以勾選要顯示的功能，並調整卡片出現的順序。</p>
            <div class="module-sort-list" id="moduleSortListContainer"></div>
            <br>
            <button class="btn-save" onclick="savePersonalLayout()">儲存版面設定</button>
        </div>

        <!-- 登出按鈕 -->
        <button class="btn-logout" onclick="logoutSystem()">🚪 登出系統</button>
        <div style="height: 40px;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, serverTimestamp, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCj3XrBxi1c3RokMzCIhEB3hjJB-BPuO9Y",
            authDomain: "homebasedb.firebaseapp.com",
            projectId: "homebasedb",
            storageBucket: "homebasedb.firebasestorage.app",
            messagingSenderId: "476832900272",
            appId: "1:476832900272:web:443bacb7cbc3113e9f8775"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;
        
        // ★ 移除了 settings 卡片
        const moduleMeta = {
            chat: { name: "💬 家庭聊天室", defaultOn: true },
            checkin: { name: "📍 到家打卡專區", defaultOn: true },
            calendar: { name: "📅 家庭行事曆", defaultOn: true },
            gallery: { name: "📸 Photo Dump", defaultOn: true },
            games: { name: "🎮 遊戲區", defaultOn: true },
            wishwall: { name: "✨ 許願牆", defaultOn: true },
            expense: { name: "💰 記帳本", defaultOn: true }
        };

        let currentOrder = ['chat', 'checkin', 'calendar', 'gallery', 'games', 'wishwall', 'expense'];
        let currentModules = { chat: true, checkin: true, calendar: true, gallery: true, games: true, wishwall: true, expense: true };

        window.onload = async function() {
            const userStr = sessionStorage.getItem('familyCheckInUser');
            if (!userStr) { alert('請先登入！'); window.location.href = 'index.html'; return; }
            currentUser = JSON.parse(userStr);
            document.getElementById('settingsName').value = currentUser.name;

            await loadPersonalConfig();
            renderSortList();
        };

        async function recordLog(actionType, detailsText) {
            try {
                const now = new Date();
                const datetimeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                await addDoc(collection(db, "logs"), { datetime: datetimeStr, operator: currentUser.name, actionType, details: detailsText, timestamp: serverTimestamp() });
            } catch (e) {}
        }

        async function loadPersonalConfig() {
            try {
                const docRef = doc(db, "userSettings", currentUser.name);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.order && Array.isArray(data.order)) {
                        // 過濾掉可能遺留的 settings
                        currentOrder = data.order.filter(k => k !== 'settings');
                        Object.keys(moduleMeta).forEach(k => { if (!currentOrder.includes(k)) currentOrder.push(k); });
                    }
                    if (data.modules) currentModules = { ...currentModules, ...data.modules };
                }
            } catch (e) {}
        }

        function renderSortList() {
            const container = document.getElementById('moduleSortListContainer'); container.innerHTML = '';
            currentOrder.forEach((modKey, index) => {
                if (!moduleMeta[modKey]) return;
                const isChecked = currentModules[modKey] !== false;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'module-sort-item';
                itemDiv.innerHTML = `
                    <div><input type="checkbox" id="chk_${modKey}" ${isChecked ? 'checked' : ''}>
                    <label for="chk_${modKey}" style="cursor:pointer;">${moduleMeta[modKey].name}</label></div>
                    <div class="order-btns">
                        <button class="order-btn" onclick="moveItem(${index}, -1)">⬆</button>
                        <button class="order-btn" onclick="moveItem(${index}, 1)">⬇</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        window.moveItem = function(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= currentOrder.length) return;
            const temp = currentOrder[index]; currentOrder[index] = currentOrder[newIndex]; currentOrder[newIndex] = temp;
            currentOrder.forEach(modKey => { const chk = document.getElementById(`chk_${modKey}`); if (chk) currentModules[modKey] = chk.checked; });
            renderSortList();
        };

        window.savePersonalLayout = async function() {
            document.getElementById('loadingView').style.display = 'flex';
            try {
                currentOrder.forEach(modKey => { const chk = document.getElementById(`chk_${modKey}`); if (chk) currentModules[modKey] = chk.checked; });
                await setDoc(doc(db, "userSettings", currentUser.name), { order: currentOrder, modules: currentModules, updatedAt: serverTimestamp() }, { merge: true });
                await recordLog('版面自訂', '修改了個人功能卡片的顯示與排序');
                alert('個人版面設定儲存成功！');
            } catch (e) { alert('儲存失敗，請檢查網路。'); } 
            finally { document.getElementById('loadingView').style.display = 'none'; }
        };

        // ★ 變更密碼邏輯 (包含舊密碼驗證與 4 碼數字規則)
        window.saveUserProfile = async function() {
            const oldPin = document.getElementById('oldPin').value.trim();
            const newPin = document.getElementById('newPin').value.trim();

            if (!oldPin) { alert('請輸入舊密碼以驗證身分！'); return; }
            if (oldPin !== currentUser.pin) { alert('舊密碼輸入錯誤，請重新輸入。'); return; }

            if (!newPin) { alert('請輸入新密碼！'); return; }
            // 驗證新密碼是否剛好為 4 碼數字正則表達式
            if (!/^\d{4}$/.test(newPin)) {
                alert('新密碼必須剛好為「4位數數字」！請重新設定。');
                return;
            }

            document.getElementById('loadingView').style.display = 'flex';
            try {
                // 將新密碼寫回 users 資料庫
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("name", "==", currentUser.name));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    const userDoc = querySnapshot.docs[0];
                    await updateDoc(userDoc.ref, { pin: newPin });
                    
                    // 更新本地 Session
                    currentUser.pin = newPin;
                    sessionStorage.setItem('familyCheckInUser', JSON.stringify(currentUser));
                    
                    await recordLog('個人設定', '成功變更了登入密碼');
                    alert('密碼修改成功！下次登入請使用新密碼。');
                    
                    document.getElementById('oldPin').value = '';
                    document.getElementById('newPin').value = '';
                } else {
                    alert('找不到使用者資料，更新失敗。');
                }
            } catch (e) {
                console.error("更新失敗", e);
                alert('系統更新失敗，請檢查網路。');
            } finally {
                document.getElementById('loadingView').style.display = 'none';
            }
        };

        // ★ 登出系統
        window.logoutSystem = function() {
            if(confirm("確定要登出系統嗎？")) {
                sessionStorage.removeItem('familyCheckInUser');
                localStorage.removeItem('familyCheckInUser');
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
