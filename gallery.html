<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus - Photo Dump</title>
    <link rel="icon" href="Nexus.png" type="image/jpeg">
    <link rel="apple-touch-icon" href="Nexus.png">
    <meta name="apple-mobile-web-app-title" content="Nexus">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
    <div class="top-nav">
        <button class="btn-back" onclick="window.location.href='index.html'">❮ 返回主選單</button>
        <div class="page-title">
            📸 Photo Dump 
            <span id="unreadBadge" class="unread-badge-global">0</span>
        </div>
        <div style="width: 80px;"></div>
    </div>

    <div class="sort-bar">
        <span>排序方式：</span>
        <select id="sortSelect" class="sort-select" onchange="changeSortMethod(this.value)">
            <option value="latest">🕒 時間最晚 (最新)</option>
            <option value="likes">❤️ 按讚數最多</option>
            <option value="comments">💬 留言數最多</option>
        </select>
    </div>

    <div class="fab-container">
        <div class="fab-menu" id="fabMenu">
            <button class="fab-menu-btn" onclick="triggerFileInput()">📷 上傳照片 (最多5張)</button>
            <button class="fab-menu-btn" onclick="openDrawingBoard()">🎨 開啟塗鴉牆</button>
        </div>
        <button class="btn-upload-fab" id="btnToggleFab" title="新增內容">➕</button>
        <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
    </div>

    <div class="feed-container" id="feedContainer">
        <div style="text-align:center; padding:50px; color:var(--text-sub); font-weight:600;">載入照片中...</div>
    </div>

    <!-- 上傳/發佈 Modal -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h3 class="modal-title">發佈新照片 / 塗鴉</h3>
            <div id="uploadPreviewContainer" class="preview-upload-container"></div>
            <textarea id="uploadCaption" class="upload-caption-input" rows="3" placeholder="寫些什麼來記錄這一刻吧..."></textarea>
            <div class="modal-btns">
                <button class="btn-cancel" id="btnCancelUpload">取消</button>
                <button class="btn-confirm" id="btnConfirmUpload">發佈</button>
            </div>
        </div>
    </div>

    <!-- 塗鴉牆 Modal -->
    <div class="drawing-board-modal" id="drawingBoardModal">
        <div class="draw-header">
            <button class="draw-btn-text" onclick="closeDrawingBoard()">取消</button>
            <div style="display: flex; gap: 15px;">
                <button class="draw-btn-text" onclick="undoDraw()" title="還原上一步">↩ 還原</button>
                <button class="draw-btn-text" style="color: var(--danger);" onclick="clearDraw()" title="清除全部">🗑️ 清除</button>
            </div>
            <button class="draw-btn-primary" onclick="saveDraw()">完成</button>
        </div>
        <div class="draw-canvas-container" id="canvasContainer">
            <canvas id="drawCanvas"></canvas>
            <div id="stickerLayer"></div>
        </div>
        <div class="draw-toolbar">
            <div class="toolbar-row">
                <div style="display:flex; gap:12px;">
                    <button class="tool-btn active" id="toolPen" onclick="setTool('pen')">✏️ 畫筆</button>
                    <button class="tool-btn" id="toolEraser" onclick="setTool('eraser')">🧼 橡皮擦</button>
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="color-btn active" style="background: #000000;" onclick="setColor('#000000', this)"></div>
                    <div class="color-btn" style="background: #ef4444;" onclick="setColor('#ef4444', this)"></div>
                    <div class="color-btn" style="background: #3b82f6;" onclick="setColor('#3b82f6', this)"></div>
                    <div class="color-btn" style="background: #10b981;" onclick="setColor('#10b981', this)"></div>
                    <div class="color-btn" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
                </div>
            </div>
            <div class="toolbar-row" style="margin-top: 5px;">
                <div style="display:flex; gap:10px; border-right: 1px solid #e5e7eb; padding-right: 15px;">
                    <div class="size-btn" onclick="setSize(3, this)"><div class="size-dot" style="width: 4px; height: 4px;"></div></div>
                    <div class="size-btn active" onclick="setSize(8, this)"><div class="size-dot" style="width: 10px; height: 10px;"></div></div>
                    <div class="size-btn" onclick="setSize(16, this)"><div class="size-dot" style="width: 20px; height: 20px;"></div></div>
                </div>
                <div class="sticker-palette">
                    <button class="sticker-btn" onclick="addSticker('😊')">😊</button>
                    <button class="sticker-btn" onclick="addSticker('😂')">😂</button>
                    <button class="sticker-btn" onclick="addSticker('😍')">😍</button>
                    <button class="sticker-btn" onclick="addSticker('😎')">😎</button>
                    <button class="sticker-btn" onclick="addSticker('🥺')">🥺</button>
                    <button class="sticker-btn" onclick="addSticker('😭')">😭</button>
                    <button class="sticker-btn" onclick="addSticker('😡')">😡</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 照片放大檢視器 -->
    <div id="photoViewerModal" class="photo-viewer">
        <span class="close-viewer" onclick="closePhotoViewer()">&times;</span>
        <div class="viewer-nav">
            <button class="viewer-nav-btn" onclick="window.prevPhoto(event)">❮</button>
            <button class="viewer-nav-btn" onclick="window.nextPhoto(event)">❯</button>
        </div>
        <div class="viewer-content-wrapper" id="viewerWrapper">
            <img class="viewer-content" id="viewerImage">
        </div>
        <div class="viewer-footer" id="viewerCounter">1 / 1</div>
    </div>

    <!-- 引入外部 JS，注意 type 必須是 module -->
    <script type="module" src="js/gallery.js"></script>
</body>
</html>
