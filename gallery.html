<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeBase - Photo Dump</title>
    <link rel="icon" href="homebase_icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="homebase_icon.jpg">
    <meta name="apple-mobile-web-app-title" content="HomeBase">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #ecfdf5;
            --danger: #ef4444;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --bg-color: #f8fafc;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); }
        
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; max-width: 500px; margin-left: auto; margin-right: auto; }
        .btn-back { background: white; border: 1px solid #e5e7eb; padding: 8px 16px; border-radius: 20px; font-weight: 600; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); }
        .page-title { color: var(--text-main); font-size: 18px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 6px; }

        /* 未讀小徽章提示 */
        .unread-badge-global { background: var(--danger); color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: 700; display: none; }

        /* 排序控制列 */
        .sort-bar { max-width: 500px; margin: 0 auto 20px auto; display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--text-sub); }
        .sort-select { padding: 6px 12px; border-radius: 12px; border: 1px solid #e5e7eb; background: white; font-weight: 700; color: var(--text-main); outline: none; cursor: pointer; box-shadow: var(--shadow-sm); }

        /* FAB 按鈕與選單 */
        .fab-container { position: fixed; bottom: 25px; right: 25px; z-index: 100; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .fab-menu { display: none; flex-direction: column; gap: 8px; margin-bottom: 10px; animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fab-menu-btn { background: white; border: 1px solid #e5e7eb; color: var(--text-main); padding: 12px 20px; border-radius: 24px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .fab-menu-btn:active { background: #f1f5f9; }
        
        .btn-upload-fab { background-color: var(--primary); color: white; width: 60px; height: 60px; border-radius: 50%; font-size: 28px; border: none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.2s; }
        .btn-upload-fab:active { transform: scale(0.9); }

        /* 相簿動態牆容器 */
        .feed-container { max-width: 500px; margin: 0 auto 80px auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* 每一篇照片卡片 */
        .photo-card { background: white; border-radius: 22px; box-shadow: var(--shadow-sm); overflow: hidden; border: 1px solid rgba(0,0,0,0.03); }
        .card-header { padding: 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f8fafc; }
        .uploader-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-light); }
        .uploader-info { flex: 1; }
        .uploader-name { font-weight: 800; font-size: 15px; color: var(--text-main); }
        .upload-time { font-size: 11px; color: var(--text-sub); margin-top: 2px; font-weight: 600; }
        .btn-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; padding: 6px; }

        .card-image { width: 100%; max-height: 450px; object-fit: cover; display: block; cursor: pointer; background: #f1f5f9; }
        .card-caption { padding: 14px 18px; font-size: 15px; line-height: 1.5; color: var(--text-main); font-weight: 500; }

        .interaction-bar { padding: 0 18px 12px 18px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #f1f5f9; }
        .btn-like { background: none; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 4px 0; color: var(--text-sub); font-weight: 700; }
        .btn-like.liked { color: #e11d48; }
        .likes-count { font-size: 13px; font-weight: 700; color: var(--text-sub); }

        .comments-section { background: #f8fafc; padding: 14px 18px; }
        .comments-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: 250px; overflow-y: auto; }
        .comment-item { font-size: 14px; line-height: 1.4; background: white; padding: 10px 14px; border-radius: 14px; border: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        .comment-content { flex: 1; word-break: break-all; }
        .comment-sender { font-weight: 800; color: var(--primary-dark); margin-right: 6px; }
        .comment-time { font-size: 10px; color: var(--text-sub); margin-left: 6px; font-weight: 600; }
        .btn-del-comment { background: none; border: none; color: var(--danger); font-size: 12px; cursor: pointer; padding: 0 0 0 8px; flex-shrink: 0; }

        .comment-input-area { display: flex; gap: 8px; }
        .comment-input { flex: 1; padding: 10px 16px; border: 1px solid #e5e7eb; border-radius: 20px; outline: none; font-size: 14px; background: white; font-family: inherit; }
        .comment-input:focus { border-color: var(--primary); }
        .btn-comment { background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 800; cursor: pointer; font-size: 14px; box-shadow: 0 2px 6px rgba(16,185,129,0.2); }
        
        /* 上傳 Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 3000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 24px; border-radius: 24px; width: 90%; max-width: 400px; box-shadow: var(--shadow-lg); }
        .modal-title { font-size: 18px; font-weight: 800; color: var(--text-main); margin-top: 0; margin-bottom: 16px; text-align: center; }
        .preview-upload-img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 12px; background: #f1f5f9; margin-bottom: 16px; border: 1px solid #e5e7eb; }
        .upload-caption-input { width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 14px; box-sizing: border-box; margin-bottom: 20px; resize: none; background: #f8fafc; font-family: inherit; outline: none; }
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-cancel { background: #f1f5f9; color: var(--text-main); border: none; padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .btn-confirm { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(16,185,129,0.2); }

        /* 照片全螢幕預覽 */
        .photo-viewer { display: none; position: fixed; z-index: 4000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); flex-direction: column; justify-content: center; align-items: center; touch-action: none; overflow: hidden; }
        .viewer-content-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease-out; }
        .viewer-content { max-width: 95%; max-height: 85vh; object-fit: contain; border-radius: 8px; user-select: none; transition: transform 0.2s ease; transform-origin: center center; }
        .close-viewer { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 24px; font-weight: bold; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.2); backdrop-filter: blur(4px); z-index: 4005; }
        .viewer-nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; transform: translateY(-50%); pointer-events: none; z-index: 4002; }
        .viewer-nav-btn { pointer-events: auto; background: rgba(255,255,255,0.2); border: none; color: white; font-size: 24px; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px); }
        .viewer-footer { position: absolute; bottom: 25px; color: rgba(255,255,255,0.8); font-size: 14px; font-weight: 600; z-index: 4002; }

        /* ================= 塗鴉牆 (Drawing Board) 樣式 ================= */
        .drawing-board-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8fafc; z-index: 5000; flex-direction: column; }
        
        .draw-header { padding: 15px 20px; background: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; box-shadow: var(--shadow-sm); z-index: 10; }
        .draw-btn-text { background: none; border: none; font-size: 16px; font-weight: 700; color: var(--text-main); cursor: pointer; }
        .draw-btn-primary { background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 20px; font-size: 15px; font-weight: 800; cursor: pointer; }
        
        .draw-canvas-container { flex: 1; position: relative; background: white; overflow: hidden; touch-action: none; }
        #drawCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }
        #stickerLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        
        /* 可拖曳貼圖 */
        .sticker-item { position: absolute; font-size: 45px; pointer-events: auto; cursor: move; user-select: none; display: flex; align-items: center; justify-content: center; }
        .sticker-del { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; border: 2px solid white; box-shadow: var(--shadow-sm); }
        
        /* 工具列 */
        .draw-toolbar { background: white; padding: 15px 20px 25px 20px; border-top: 1px solid #e5e7eb; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.03); z-index: 10; }
        .toolbar-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        
        .color-btn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #e5e7eb; cursor: pointer; transition: transform 0.1s; }
        .color-btn.active { border-color: var(--text-main); transform: scale(1.15); box-shadow: 0 0 0 2px white inset; }
        
        .size-btn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #f1f5f9; cursor: pointer; border: 2px solid transparent; }
        .size-btn.active { border-color: var(--primary); background: var(--primary-light); }
        .size-dot { background: var(--text-main); border-radius: 50%; }

        .tool-btn { background: #f1f5f9; border: 2px solid transparent; padding: 8px 14px; border-radius: 16px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-sub); }
        .tool-btn.active { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary); }

        .sticker-palette { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 5px; flex: 1; }
        .sticker-btn { font-size: 26px; cursor: pointer; background: none; border: none; transition: transform 0.1s; }
        .sticker-btn:active { transform: scale(1.2); }
    </style>
</head>
<body>
    <div class="top-nav">
        <button class="btn-back" onclick="window.location.href='index.html'">❮ 返回主選單</button>
        <div class="page-title">
            📸 Photo Dump 
            <span id="unreadBadge" class="unread-badge-global">0</span>
        </div>
        <div style="width: 80px;"></div>
    </div>

    <!-- 排序控制列 -->
    <div class="sort-bar">
        <span>排序方式：</span>
        <select id="sortSelect" class="sort-select" onchange="changeSortMethod(this.value)">
            <option value="latest">🕒 時間最晚 (最新)</option>
            <option value="likes">❤️ 按讚數最多</option>
            <option value="comments">💬 留言數最多</option>
        </select>
    </div>

    <!-- FAB 主按鈕與選單 -->
    <div class="fab-container">
        <div class="fab-menu" id="fabMenu">
            <button class="fab-menu-btn" onclick="triggerFileInput()">📷 上傳照片或拍照</button>
            <button class="fab-menu-btn" onclick="openDrawingBoard()">🎨 開啟塗鴉牆</button>
        </div>
        <button class="btn-upload-fab" id="btnToggleFab" title="新增內容">➕</button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>

    <div class="feed-container" id="feedContainer">
        <div style="text-align:center; padding:50px; color:var(--text-sub); font-weight:600;">載入照片中...</div>
    </div>

    <!-- 上傳/發佈 Modal -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h3 class="modal-title">發佈新照片 / 塗鴉</h3>
            <img id="uploadPreviewImg" class="preview-upload-img" src="" alt="預覽圖片">
            <textarea id="uploadCaption" class="upload-caption-input" rows="3" placeholder="寫些什麼來記錄這一刻吧..."></textarea>
            <div class="modal-btns">
                <button class="btn-cancel" id="btnCancelUpload">取消</button>
                <button class="btn-confirm" id="btnConfirmUpload">發佈</button>
            </div>
        </div>
    </div>

    <!-- 塗鴉牆 Modal -->
    <div class="drawing-board-modal" id="drawingBoardModal">
        <div class="draw-header">
            <button class="draw-btn-text" onclick="closeDrawingBoard()">取消</button>
            <div style="display: flex; gap: 15px;">
                <button class="draw-btn-text" onclick="undoDraw()" title="還原上一步">↩ 還原</button>
                <button class="draw-btn-text" style="color: var(--danger);" onclick="clearDraw()" title="清除全部">🗑️ 清除</button>
            </div>
            <button class="draw-btn-primary" onclick="saveDraw()">完成</button>
        </div>
        
        <div class="draw-canvas-container" id="canvasContainer">
            <canvas id="drawCanvas"></canvas>
            <!-- 貼圖層 -->
            <div id="stickerLayer"></div>
        </div>
        
        <div class="draw-toolbar">
            <!-- 顏色與工具 -->
            <div class="toolbar-row">
                <div style="display:flex; gap:12px;">
                    <button class="tool-btn active" id="toolPen" onclick="setTool('pen')">✏️ 畫筆</button>
                    <button class="tool-btn" id="toolEraser" onclick="setTool('eraser')">🧼 橡皮擦</button>
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="color-btn active" style="background: #000000;" onclick="setColor('#000000', this)"></div>
                    <div class="color-btn" style="background: #ef4444;" onclick="setColor('#ef4444', this)"></div>
                    <div class="color-btn" style="background: #3b82f6;" onclick="setColor('#3b82f6', this)"></div>
                    <div class="color-btn" style="background: #10b981;" onclick="setColor('#10b981', this)"></div>
                    <div class="color-btn" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
                </div>
            </div>
            
            <!-- 筆刷粗細與貼圖 -->
            <div class="toolbar-row" style="margin-top: 5px;">
                <div style="display:flex; gap:10px; border-right: 1px solid #e5e7eb; padding-right: 15px;">
                    <div class="size-btn" onclick="setSize(3, this)"><div class="size-dot" style="width: 4px; height: 4px;"></div></div>
                    <div class="size-btn active" onclick="setSize(8, this)"><div class="size-dot" style="width: 10px; height: 10px;"></div></div>
                    <div class="size-btn" onclick="setSize(16, this)"><div class="size-dot" style="width: 20px; height: 20px;"></div></div>
                </div>
                <!-- 貼圖列 -->
                <div class="sticker-palette">
                    <button class="sticker-btn" onclick="addSticker('😊')">😊</button>
                    <button class="sticker-btn" onclick="addSticker('❤️')">❤️</button>
                    <button class="sticker-btn" onclick="addSticker('⭐')">⭐</button>
                    <button class="sticker-btn" onclick="addSticker('🎉')">🎉</button>
                    <button class="sticker-btn" onclick="addSticker('🎂')">🎂</button>
                    <button class="sticker-btn" onclick="addSticker('🔥')">🔥</button>
                    <button class="sticker-btn" onclick="addSticker('👍')">👍</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 照片放大檢視器 -->
    <div id="photoViewerModal" class="photo-viewer">
        <span class="close-viewer" onclick="closePhotoViewer()">&times;</span>
        <div class="viewer-nav">
            <button class="viewer-nav-btn" onclick="window.prevPhoto(event)">❮</button>
            <button class="viewer-nav-btn" onclick="window.nextPhoto(event)">❯</button>
        </div>
        <div class="viewer-content-wrapper" id="viewerWrapper">
            <img class="viewer-content" id="viewerImage">
        </div>
        <div class="viewer-footer" id="viewerCounter">1 / 1</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import {
            getFirestore, collection, addDoc, query, orderBy, onSnapshot,
            serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove, deleteDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCj3XrBxi1c3RokMzCIhEB3hjJB-BPuO9Y",
            authDomain: "homebasedb.firebaseapp.com",
            projectId: "homebasedb",
            storageBucket: "homebasedb.firebasestorage.app",
            messagingSenderId: "476832900272",
            appId: "1:476832900272:web:443bacb7cbc3113e9f8775"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const savedUserStr = sessionStorage.getItem('familyCheckInUser') || localStorage.getItem('familyCheckInUser');
        let currentUser = savedUserStr ? JSON.parse(savedUserStr) : null;
        if (!currentUser) { alert('請先登入！'); window.location.href = 'index.html'; }

        let pendingUploadBase64 = null;
        let allPhotosData = [];
        let currentSort = 'latest';
        let currentViewerIndex = 0; 
        let isZoomed = false;       

        const feedContainer = document.getElementById('feedContainer');
        const unreadBadge = document.getElementById('unreadBadge');

        async function recordLog(actionType, detailsText) {
            try {
                const now = new Date();
                const datetimeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                await addDoc(collection(db, "logs"), { datetime: datetimeStr, operator: currentUser.name, actionType, details: detailsText, timestamp: serverTimestamp() });
            } catch (e) {}
        }

        window.onload = async function() {
            await recordLog('功能瀏覽', '進入「Photo Dump」相簿專區');
            localStorage.setItem('homebase_photodump_last_read', Date.now().toString());
        };

        function listenToGallery() {
            const q = query(collection(db, "photos"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                allPhotosData = [];
                if (snapshot.empty) {
                    feedContainer.innerHTML = '<div style="text-align:center; padding:50px; color:var(--text-sub); font-weight:600;">相簿空空的，趕快點擊右下角發佈第一張照片吧！</div>';
                    updateUnreadBadge([]);
                    return;
                }
                snapshot.forEach((docSnap) => {
                    allPhotosData.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderFeed();
                updateUnreadBadge(allPhotosData);
            }, (error) => {
                console.error("載入相簿失敗：", error);
                feedContainer.innerHTML = '<div style="text-align:center; padding:30px; color:red;">載入失敗，請檢查網路連線。</div>';
            });
        }

        function updateUnreadBadge(photos) {
            const lastReadTime = parseInt(localStorage.getItem('homebase_photodump_last_read') || '0', 10);
            let unreadCount = 0;
            photos.forEach(photo => {
                const photoTime = photo.timestamp?.toDate?.()?.getTime() || 0;
                if (photoTime > lastReadTime && photo.uploader !== currentUser.name) {
                    unreadCount++;
                }
            });
            if (unreadCount > 0) {
                unreadBadge.style.display = 'inline-block';
                unreadBadge.innerText = `+${unreadCount}`;
            } else {
                unreadBadge.style.display = 'none';
            }
        }

        window.changeSortMethod = function(method) {
            currentSort = method;
            renderFeed();
        };

        function renderFeed() {
            feedContainer.innerHTML = '';
            let sortedList = [...allPhotosData];

            if (currentSort === 'likes') {
                sortedList.sort((a, b) => {
                    const countA = (a.likes && Array.isArray(a.likes)) ? a.likes.length : 0;
                    const countB = (b.likes && Array.isArray(b.likes)) ? b.likes.length : 0;
                    return countB - countA;
                });
            } else if (currentSort === 'comments') {
                sortedList.sort((a, b) => {
                    const countA = (a.comments && Array.isArray(a.comments)) ? a.comments.length : 0;
                    const countB = (b.comments && Array.isArray(b.comments)) ? b.comments.length : 0;
                    return countB - countA;
                });
            } else {
                sortedList.sort((a, b) => {
                    const timeA = a.timestamp?.toDate?.()?.getTime() || 0;
                    const timeB = b.timestamp?.toDate?.()?.getTime() || 0;
                    return timeB - timeA;
                });
            }

            sortedList.forEach((photo, index) => renderPhotoCard(photo.id, photo, index));
        }

        function renderPhotoCard(photoId, data, index) {
            let timeStr = "剛才";
            if (data.timestamp && data.timestamp.toDate) {
                const d = data.timestamp.toDate();
                timeStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            }

            const isMine = (data.uploader === currentUser.name || currentUser.role === 'admin' || currentUser.role === 'parent');
            const delBtnHtml = isMine ? `<button class="btn-delete" onclick="window.deletePhoto('${photoId}')" title="刪除貼文">🗑️</button>` : '';

            const likesArray = (data.likes && Array.isArray(data.likes)) ? data.likes : [];
            const hasLiked = likesArray.includes(currentUser.name);
            const likesCount = likesArray.length;

            let commentsHtml = '';
            if (data.comments && data.comments.length > 0) {
                data.comments.forEach((c, cIndex) => {
                    const cTime = new Date(c.timestamp);
                    const cTimeStr = `${String(cTime.getMonth()+1).padStart(2,'0')}/${String(cTime.getDate()).padStart(2,'0')} ${String(cTime.getHours()).padStart(2,'0')}:${String(cTime.getMinutes()).padStart(2,'0')}`;
                    const canDeleteComment = (c.sender === currentUser.name || currentUser.role === 'admin' || currentUser.role === 'parent');
                    const delCommentBtn = canDeleteComment ? `<button class="btn-del-comment" onclick="window.deleteComment('${photoId}', ${cIndex})" title="刪除留言">刪除</button>` : '';

                    commentsHtml += `
                        <div class="comment-item">
                            <div class="comment-content">
                                <span class="comment-sender">${c.sender}</span>
                                <span>${c.text}</span>
                                <span class="comment-time">${cTimeStr}</span>
                            </div>
                            ${delCommentBtn}
                        </div>
                    `;
                });
            } else {
                commentsHtml = '<div style="color:var(--text-sub); font-size:13px; text-align:center; font-weight:600;">成為第一個留言的人吧！</div>';
            }

            const uploaderAvatar = data.uploaderAvatar || `https://ui-avatars.com/api/?name=${data.uploader}&background=10b981&color=fff`;

            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <div class="card-header">
                    <img src="${uploaderAvatar}" class="uploader-avatar">
                    <div class="uploader-info">
                        <div class="uploader-name">${data.uploader}</div>
                        <div class="upload-time">${timeStr}</div>
                    </div>
                    ${delBtnHtml}
                </div>
                <img src="${data.imageUrl}" class="card-image" onclick="window.openPhotoViewer(${index})">
                ${data.caption ? `<div class="card-caption">${data.caption}</div>` : ''}
                
                <div class="interaction-bar">
                    <button class="btn-like ${hasLiked ? 'liked' : ''}" onclick="window.toggleLike('${photoId}', ${hasLiked})">
                        ${hasLiked ? '❤️' : '🤍'} <span class="likes-count">${likesCount > 0 ? likesCount : '按讚'}</span>
                    </button>
                </div>

                <div class="comments-section">
                    <div class="comments-list">
                        ${commentsHtml}
                    </div>
                    <div class="comment-input-area">
                        <input type="text" id="input-${photoId}" class="comment-input" placeholder="留個言吧..." autocomplete="off">
                        <button class="btn-comment" onclick="window.submitComment('${photoId}')">留言</button>
                    </div>
                </div>
            `;
            feedContainer.appendChild(card);

            document.getElementById(`input-${photoId}`).addEventListener('keypress', (e) => {
                if (e.key === 'Enter') window.submitComment(photoId);
            });
        }

        window.toggleLike = async function(photoId, hasLiked) {
            try {
                const photoRef = doc(db, "photos", photoId);
                if (hasLiked) {
                    await updateDoc(photoRef, { likes: arrayRemove(currentUser.name) });
                } else {
                    await updateDoc(photoRef, { likes: arrayUnion(currentUser.name) });
                }
            } catch (e) {
                console.error("按讚操作失敗：", e);
                alert("操作失敗，請檢查網路。");
            }
        };

        window.submitComment = async function(photoId) {
            const inputField = document.getElementById(`input-${photoId}`);
            const text = inputField.value.trim();
            if (!text) return;
            inputField.value = '';
            try {
                const photoRef = doc(db, "photos", photoId);
                await updateDoc(photoRef, {
                    comments: arrayUnion({ sender: currentUser.name, text: text, timestamp: Date.now() })
                });
                await recordLog('相簿互動', '在相簿照片中發表了一則留言');
            } catch (e) {
                alert("留言失敗，請檢查網路！");
                inputField.value = text;
            }
        };

        window.deleteComment = async function(photoId, commentIndex) {
            if (!confirm("確定要刪除這則留言嗎？")) return;
            try {
                const photoRef = doc(db, "photos", photoId);
                const targetPhoto = allPhotosData.find(p => p.id === photoId);
                if (targetPhoto && targetPhoto.comments) {
                    let updatedComments = [...targetPhoto.comments];
                    updatedComments.splice(commentIndex, 1);
                    await updateDoc(photoRef, { comments: updatedComments });
                }
            } catch (e) {
                alert("刪除留言失敗，請稍後再試。");
            }
        };

        window.deletePhoto = async function(photoId) {
            if (confirm("確定要刪除這張內容嗎？(留言與按讚也會一併刪除喔)")) {
                try {
                    await deleteDoc(doc(db, "photos", photoId));
                    await recordLog('相簿管理', '刪除了一張相簿內容');
                } catch (e) {
                    alert("刪除失敗，請再試一次。");
                }
            }
        };

        // ================= 檔案與塗鴉牆入口 =================
        const btnToggleFab = document.getElementById('btnToggleFab');
        const fabMenu = document.getElementById('fabMenu');
        
        btnToggleFab.addEventListener('click', () => {
            if (fabMenu.style.display === 'flex') {
                fabMenu.style.display = 'none';
                btnToggleFab.style.transform = 'rotate(0deg)';
            } else {
                fabMenu.style.display = 'flex';
                btnToggleFab.style.transform = 'rotate(45deg)';
            }
        });

        // 點擊其他地方關閉 FAB 選單
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.fab-container')) {
                fabMenu.style.display = 'none';
                btnToggleFab.style.transform = 'rotate(0deg)';
            }
        });

        window.triggerFileInput = function() {
            fabMenu.style.display = 'none';
            btnToggleFab.style.transform = 'rotate(0deg)';
            document.getElementById('fileInput').click();
        };

        // 處理一般圖片上傳
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const maxSize = 1000;
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } }
                    else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                    
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    pendingUploadBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('uploadPreviewImg').src = pendingUploadBase64;
                    document.getElementById('uploadCaption').value = '';
                    document.getElementById('uploadModal').style.display = 'flex';
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('btnCancelUpload').addEventListener('click', () => {
            document.getElementById('uploadModal').style.display = 'none';
            document.getElementById('fileInput').value = '';
            pendingUploadBase64 = null;
        });

        document.getElementById('btnConfirmUpload').addEventListener('click', async () => {
            if (!pendingUploadBase64) return;
            const caption = document.getElementById('uploadCaption').value.trim();
            const btnConfirm = document.getElementById('btnConfirmUpload');

            btnConfirm.disabled = true;
            btnConfirm.innerText = '處理並發佈中...';

            try {
                await addDoc(collection(db, "photos"), {
                    imageUrl: pendingUploadBase64,
                    caption: caption,
                    uploader: currentUser.name,
                    uploaderAvatar: currentUser.avatar || null,
                    timestamp: serverTimestamp(),
                    comments: [],
                    likes: []
                });

                await recordLog('相簿管理', '上傳了一張新照片/塗鴉至 Photo Dump');
                document.getElementById('uploadModal').style.display = 'none';
                document.getElementById('fileInput').value = '';
                pendingUploadBase64 = null;
                localStorage.setItem('homebase_photodump_last_read', Date.now().toString());
            } catch (e) {
                console.error("發佈失敗：", e);
                alert("照片過大或網路不穩，發佈失敗！");
            } finally {
                btnConfirm.disabled = false;
                btnConfirm.innerText = '發佈';
            }
        });


        // ================= 全新：塗鴉牆 (Drawing Board) 邏輯 =================
        const drawModal = document.getElementById('drawingBoardModal');
        const drawCanvas = document.getElementById('drawCanvas');
        const ctx = drawCanvas.getContext('2d', { willReadFrequently: true });
        const stickerLayer = document.getElementById('stickerLayer');
        
        let isDrawing = false;
        let drawColor = '#000000';
        let drawSize = 8;
        let activeTool = 'pen'; // 'pen' 或 'eraser'
        let undoStack = [];

        window.openDrawingBoard = function() {
            fabMenu.style.display = 'none';
            btnToggleFab.style.transform = 'rotate(0deg)';
            
            drawModal.style.display = 'flex';
            
            // 初始化畫布尺寸
            const container = document.getElementById('canvasContainer');
            drawCanvas.width = container.offsetWidth;
            drawCanvas.height = container.offsetHeight;
            
            // 預設填滿白色背景 (以符合照片儲存)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
            
            stickerLayer.innerHTML = ''; // 清空舊貼圖
            undoStack = []; 
            saveCanvasState(); // 記錄初始空白狀態
        };

        window.closeDrawingBoard = function() {
            if(confirm("確定要取消塗鴉嗎？未儲存的內容將會遺失。")) {
                drawModal.style.display = 'none';
            }
        };

        window.setColor = function(color, btnElem) {
            drawColor = color;
            activeTool = 'pen';
            updateToolUI();
            
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btnElem.classList.add('active');
        };

        window.setSize = function(size, btnElem) {
            drawSize = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btnElem.classList.add('active');
        };

        window.setTool = function(tool) {
            activeTool = tool;
            updateToolUI();
        };

        function updateToolUI() {
            document.getElementById('toolPen').classList.toggle('active', activeTool === 'pen');
            document.getElementById('toolEraser').classList.toggle('active', activeTool === 'eraser');
        }

        // 畫布事件
        function getPointerPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            let clientX = e.clientX, clientY = e.clientY;
            if(e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPointerPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPointerPos(e);
            
            ctx.lineTo(pos.x, pos.y);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = drawSize;
            
            if (activeTool === 'eraser') {
                ctx.strokeStyle = '#ffffff'; // 橡皮擦實作為畫白線
            } else {
                ctx.strokeStyle = drawColor;
            }
            
            ctx.stroke();
            e.preventDefault();
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
                saveCanvasState(); // 記錄至 Undo Stack
            }
        }

        drawCanvas.addEventListener('mousedown', startDrawing);
        drawCanvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        
        drawCanvas.addEventListener('touchstart', startDrawing, {passive: false});
        drawCanvas.addEventListener('touchmove', draw, {passive: false});
        window.addEventListener('touchend', stopDrawing);

        // 還原與清除
        function saveCanvasState() {
            if (undoStack.length >= 20) undoStack.shift(); // 最多存20步
            undoStack.push(drawCanvas.toDataURL());
        }

        window.undoDraw = function() {
            if (undoStack.length > 1) {
                undoStack.pop(); // 移除當前狀態
                const prevDataUrl = undoStack[undoStack.length - 1];
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = prevDataUrl;
            } else if (undoStack.length === 1) {
                window.clearDraw(); // 到底了就全清空
            }
        };

        window.clearDraw = function() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
            stickerLayer.innerHTML = '';
            undoStack = [];
            saveCanvasState();
        };

        // 貼圖功能 (可拖曳 DOM 元素)
        window.addSticker = function(emoji) {
            const wrapper = document.createElement('div');
            wrapper.className = 'sticker-item';
            wrapper.style.left = '50%';
            wrapper.style.top = '50%';
            wrapper.style.transform = 'translate(-50%, -50%)';

            const textSpan = document.createElement('span');
            textSpan.innerText = emoji;
            
            const delBtn = document.createElement('div');
            delBtn.className = 'sticker-del';
            delBtn.innerText = '✕';
            delBtn.onclick = (e) => { e.stopPropagation(); wrapper.remove(); };

            wrapper.appendChild(textSpan);
            wrapper.appendChild(delBtn);
            stickerLayer.appendChild(wrapper);

            // 拖曳邏輯
            let isDraggingSticker = false, startX, startY, initialLeft, initialTop;
            
            function onDragStart(e) {
                isDraggingSticker = true;
                startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                initialLeft = wrapper.offsetLeft;
                initialTop = wrapper.offsetTop;
                wrapper.style.zIndex = 1000;
                if(e.cancelable) e.preventDefault();
            }
            
            function onDragMove(e) {
                if(!isDraggingSticker) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                wrapper.style.left = `${initialLeft + (clientX - startX)}px`;
                wrapper.style.top = `${initialTop + (clientY - startY)}px`;
                if(e.cancelable) e.preventDefault();
            }
            
            function onDragEnd() {
                isDraggingSticker = false;
                wrapper.style.zIndex = '';
            }

            wrapper.addEventListener('touchstart', onDragStart, {passive: false});
            window.addEventListener('touchmove', onDragMove, {passive: false});
            window.addEventListener('touchend', onDragEnd);
            
            wrapper.addEventListener('mousedown', onDragStart);
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
        };

        // 儲存塗鴉 (合併畫布與貼圖並轉交給 Upload Modal)
        window.saveDraw = function() {
            // 建立一個隱藏的暫時畫布來合併
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = drawCanvas.width;
            tempCanvas.height = drawCanvas.height;
            const tCtx = tempCanvas.getContext('2d');

            // 1. 畫上背景與筆跡
            tCtx.drawImage(drawCanvas, 0, 0);

            // 2. 將所有的貼圖依照當前座標畫上去
            const layerRect = stickerLayer.getBoundingClientRect();
            const stickers = stickerLayer.querySelectorAll('.sticker-item');
            
            stickers.forEach(st => {
                const span = st.querySelector('span');
                const stRect = span.getBoundingClientRect();
                // 計算貼圖中心點相對於畫布的座標
                const cx = stRect.left - layerRect.left + (stRect.width / 2);
                const cy = stRect.top - layerRect.top + (stRect.height / 2);
                
                tCtx.font = '45px sans-serif';
                tCtx.textAlign = 'center';
                tCtx.textBaseline = 'middle';
                tCtx.fillText(span.innerText, cx, cy);
            });

            // 轉存並開啟預覽上傳視窗
            pendingUploadBase64 = tempCanvas.toDataURL('image/jpeg', 0.9);
            document.getElementById('uploadPreviewImg').src = pendingUploadBase64;
            document.getElementById('uploadCaption').value = '';
            
            drawModal.style.display = 'none';
            document.getElementById('uploadModal').style.display = 'flex';
        };

        // ================= 全螢幕圖片檢視器 =================
        const photoViewerModal = document.getElementById('photoViewerModal');
        const viewerImage = document.getElementById('viewerImage');
        const viewerCounter = document.getElementById('viewerCounter');

        window.openPhotoViewer = function(index) {
            currentViewerIndex = index;
            isZoomed = false;
            viewerImage.style.transform = 'scale(1)';
            updateViewerContent();
            photoViewerModal.style.display = 'flex';
        };

        window.closePhotoViewer = function() {
            photoViewerModal.style.display = 'none';
            viewerImage.src = '';
            isZoomed = false;
            viewerImage.style.transform = 'scale(1)';
        };

        function updateViewerContent() {
            if (allPhotosData.length === 0) return;
            if (currentViewerIndex < 0) currentViewerIndex = allPhotosData.length - 1;
            if (currentViewerIndex >= allPhotosData.length) currentViewerIndex = 0;

            viewerImage.src = allPhotosData[currentViewerIndex].imageUrl;
            viewerCounter.innerText = `${currentViewerIndex + 1} / ${allPhotosData.length}`;
        }

        window.prevPhoto = function(e) {
            e.stopPropagation();
            isZoomed = false;
            viewerImage.style.transform = 'scale(1)';
            currentViewerIndex--;
            updateViewerContent();
        };

        window.nextPhoto = function(e) {
            e.stopPropagation();
            isZoomed = false;
            viewerImage.style.transform = 'scale(1)';
            currentViewerIndex++;
            updateViewerContent();
        };

        let lastTapTime = 0;
        viewerImage.addEventListener('click', (e) => {
            e.stopPropagation();
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            if (tapLength < 300 && tapLength > 0) {
                isZoomed = !isZoomed;
                viewerImage.style.transform = isZoomed ? 'scale(2.5)' : 'scale(1)';
            }
            lastTapTime = currentTime;
        });

        let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;

        photoViewerModal.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, {passive: true});

        photoViewerModal.addEventListener('touchend', (e) => {
            if (isZoomed) return;
            touchEndX = e.changedTouches[0].clientX;
            touchEndY = e.changedTouches[0].clientY;
            handleGesture();
        }, {passive: true});

        function handleGesture() {
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 50) { currentViewerIndex--; updateViewerContent(); } 
                else if (diffX < -50) { currentViewerIndex++; updateViewerContent(); }
            } else {
                if (diffY > 100) closePhotoViewer();
            }
        }

        listenToGallery();
    </script>
</body>
</html>
