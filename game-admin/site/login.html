<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理員登入 · Nexus Game Admin</title><link rel="stylesheet" href="styles.css"></head><body class="login-body"><main class="login-card"><div class="brand-mark">N</div><p class="eyebrow">NEXUS GAME ADMIN</p><h1>咕咕村落營運管理中心</h1><p class="muted">使用專案管理員帳號登入</p><form id="loginForm"><label>電子郵件<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登入管理中心</button></form><form id="mfaForm" hidden><label>驗證器六位數代碼<input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="primary">驗證並登入</button></form><section id="enrollment" hidden><h2>設定管理員 MFA（選用）</h2><p>請將下方金鑰加入您的驗證器。金鑰僅在本次設定顯示，請勿分享。</p><button id="beginEnrollment" type="button">產生驗證器設定</button><output id="enrollmentSecret"></output><form id="enrollForm" hidden><label>驗證器代碼<input id="enrollCode" inputmode="numeric" pattern="[0-9]{6}" required></label><button class="primary">完成設定並重新登入</button></form><p><a id="backToAdmin" href="index.html">返回管理中心</a></p></section><p id="status" role="status" aria-live="polite"></p><button id="cancelLogin" type="button" class="subtle" hidden>登出並返回登入</button><footer>僅供授權管理員使用 · 不開放自行註冊</footer></main><script type="module" src="login.js"></script></body></html>
