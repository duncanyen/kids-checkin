<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>咕咕村落｜iPhone 隔離驗收</title><style>body{font:17px system-ui;margin:auto;max-width:700px;padding:20px;background:#fff3d7;color:#4d301c}button,select{font:inherit;min-height:48px;padding:8px;margin:5px;border-radius:9px}button{background:#587c2d;color:#fff;border:1px solid #8d6232}section{padding:12px;background:#fff9eb;border:2px solid #b58a50;border-radius:15px;margin:15px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}label{display:block}a{color:#315f1b}.error{color:#a32323}</style></head><body><h1>iPhone／Safari 隔離驗收站</h1><p><strong>假帳號、假資產、記憶體後端。請勿輸入正式密碼。</strong></p><p id="transport"></p><section><h2>1. 選擇測試身分</h2><select id="tester" aria-label="測試帳號"><option value="alice-a">小咕 A／村落 A</option><option value="bob-a">小咕 B／村落 A</option><option value="alice-b">小咕 A／村落 B</option><option value="low-a">資源不足／50 金幣、0 石頭</option></select><button id="select">使用此假帳號</button><p id="identity">尚未選擇</p><button id="enter">進入遊戲</button><button id="newtab">同帳號開第二分頁</button></section><section><h2>2. 受控失敗測試</h2><p>只作用在本次假帳號的下一筆指定操作，不會碰到正式資料。</p><label>操作<select id="action"><option value="buyWeapon">購買武器</option><option value="refineWeapon">精煉</option><option value="resetRefinement">解除精煉</option><option value="openChests">批次開箱</option><option value="openChest">單箱開啟</option><option value="homeEncounter">進入自家村落</option><option value="visitEncounter">拜訪其他村落</option></select></label><label>情境<select id="fault"><option value="lost">後端成功、回應遺失</option><option value="before">後端尚未執行即失敗</option><option value="delay">回應延遲2秒</option><option value="protocol">要求更新版本</option></select></label><button id="arm">套用下一筆操作</button><p>真的斷線請您在手機切換飛航模式；上述情境是受控注入，報告會標示，不混入正常網路數據。</p></section><section><h2>3. 怪物／戰鬥</h2><select id="monster"><option value="none">先停用遇怪，測基本操作</option><option value="wolf">大野狼</option><option value="tiger">老虎</option><option value="eagle">巨飛鷹</option><option value="dragon">烈火龍</option><option value="hornet">虎頭蜂</option><option value="gorilla">大金剛</option><option value="mole">地鼠</option><option value="cobra">毒牙眼鏡蛇王</option><option value="giant">遠古巨人</option></select><button id="encounter">設定下次進場</button><p>改動僅限假資料的遇怪條件，HP、武器及獎勵由既有服務處理。請重新進入村落觸發，不在戰鬥中切換。</p></section><section><h2>4. 保存結果</h2><button id="state">查看本次狀態</button><button id="download">下載驗收紀錄 JSON</button><pre id="status"></pre></section><p id="message" role="status"></p><script type="module" src="/lab/panel.js"></script></body></html>
