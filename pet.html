<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeBase - 電子寵物</title>
    <link rel="icon" href="homebase_icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="homebase_icon.jpg">

    <style>
        :root {
            --primary-color: #2e7d32;
            --bg-color: #f4f9f4;
            /* 復古電子雞的 LCD 螢幕顏色 */
            --lcd-bg: #9ea786;
            --lcd-text: #2c3321;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei"; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; text-align: center; }
       
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; max-width: 500px; margin: 0 auto 15px auto; }
        .btn-back { background: #f0f0f0; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: #555; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .current-user-badge { background: white; padding: 6px 14px; border-radius: 30px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--primary-color); }
        .mini-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid var(--primary-color); }
       
        .system-title { color: var(--primary-color); font-size: 20px; margin-bottom: 15px; margin-top: 0; }

        /* 電子雞主機外殼 */
        .device-shell {
            background: #ff7043; /* 橘色外殼 */
            max-width: 320px;
            margin: 0 auto;
            border-radius: 40px 40px 60px 60px;
            padding: 30px 20px 40px 20px;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.2);
            border: 2px solid #e64a19;
        }

        /* 復古 LCD 螢幕 */
        .lcd-screen {
            background-color: var(--lcd-bg);
            border: 4px solid #555;
            border-radius: 10px;
            padding: 15px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
            position: relative;
        }

        /* 狀態列 */
        .status-bar { display: flex; justify-content: space-between; font-size: 14px; font-family: monospace; font-weight: bold; color: var(--lcd-text); }
       
        /* 寵物本體 */
        .pet-character {
            font-size: 45px;
            font-family: monospace;
            font-weight: bold;
            color: var(--lcd-text);
            margin: 20px 0;
            transition: 0.2s;
        }

        /* 動畫：呼吸浮動 */
        .breathing { animation: float 2s infinite ease-in-out; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* 提示文字 */
        .lcd-message { font-size: 13px; font-family: monospace; font-weight: bold; color: var(--lcd-text); min-height: 18px;}

        /* 操作按鈕區 */
        .buttons-container {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }
        .btn-action {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #ccc;
            box-shadow: 0 4px 0 #999, inset 0 -3px 5px rgba(0,0,0,0.1);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.1s;
        }
        .btn-action:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #999, inset 0 -3px 5px rgba(0,0,0,0.1);
        }
        .btn-label {
            font-size: 12px;
            font-weight: bold;
            color: white;
            margin-top: 8px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <button class="btn-back" onclick="goBack()">❮ 返回</button>
        <div class="current-user-badge">
            <img id="petUserAvatar" class="mini-avatar" src="" alt="">
            <span id="petUserName"></span>
        </div>
    </div>

    <h2 class="system-title">👾 專屬電子寵物</h2>

    <div class="device-shell">
        <div class="lcd-screen">
            <div class="status-bar">
                <span id="hungerDisplay">飽足: 100%</span>
                <span id="happyDisplay">心情: 100%</span>
            </div>
           
            <div class="pet-character breathing" id="petFace">( ‧ ω ‧ )</div>
           
            <div class="lcd-message" id="messageDisplay">你的寵物很健康！</div>
        </div>

        <div class="buttons-container">
            <div>
                <button class="btn-action" onclick="feedPet()">🍙</button>
                <span class="btn-label">餵食</span>
            </div>
            <div>
                <button class="btn-action" onclick="playPet()">⚽</button>
                <span class="btn-label">玩耍</span>
            </div>
            <div>
                <button class="btn-action" onclick="cleanPet()">🧹</button>
                <span class="btn-label">打掃</span>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let petData = {
            hunger: 100,
            happy: 100,
            lastUpdate: Date.now(),
            poop: false
        };

        const FACES = {
            normal: "( ‧ ω ‧ )",
            happy: "( ≧ ▽ ≦ )",
            sad: "( ； ω ； )",
            eating: "( ˘ ▽ ˘ )",
            dead: "( x _ x )",
            poopNormal: "( ‧ ω ‧ ) 💩",
            poopSad: "( ； ω ； ) 💩"
        };

        window.onload = function() {
            const savedUser = localStorage.getItem('familyCheckInUser');
            if (!savedUser) { window.location.href = 'index.html'; return; }
           
            currentUser = JSON.parse(savedUser);
            document.getElementById('petUserAvatar').src = currentUser.avatar;
            document.getElementById('petUserName').innerText = currentUser.name;
           
            loadPetData();
            calculateTimeDecay(); // 計算離線期間流失的狀態
            updateScreen();
           
            // 每秒自動扣一點點狀態 (為了展示，這裡設為每 1 分鐘扣 1%)
            setInterval(autoDecay, 60000);
        };

        // 讀取存檔
        function loadPetData() {
            const saved = localStorage.getItem(`petDB_${currentUser.name}`);
            if (saved) {
                petData = JSON.parse(saved);
            }
        }

        // 存檔
        function savePetData() {
            petData.lastUpdate = Date.now();
            localStorage.setItem(`petDB_${currentUser.name}`, JSON.stringify(petData));
        }

        // 計算離線流失 (每 30 分鐘扣 5%)
        function calculateTimeDecay() {
            const now = Date.now();
            const diffMinutes = Math.floor((now - petData.lastUpdate) / 60000);
           
            if (diffMinutes > 30) {
                const decay = Math.floor(diffMinutes / 30) * 5;
                petData.hunger = Math.max(0, petData.hunger - decay);
                petData.happy = Math.max(0, petData.happy - decay);
               
                // 如果離線太久，可能會大便
                if (diffMinutes > 120 && Math.random() > 0.5) {
                    petData.poop = true;
                }
                savePetData();
            }
        }

        // 在線上時持續流失
        function autoDecay() {
            petData.hunger = Math.max(0, petData.hunger - 1);
            petData.happy = Math.max(0, petData.happy - 1);
            savePetData();
            updateScreen();
        }

        // 更新 LCD 螢幕顯示
        function updateScreen() {
            document.getElementById('hungerDisplay').innerText = `飽足: ${petData.hunger}%`;
            document.getElementById('happyDisplay').innerText = `心情: ${petData.happy}%`;
           
            const petFace = document.getElementById('petFace');
            const msg = document.getElementById('messageDisplay');

            if (petData.hunger === 0 && petData.happy === 0) {
                petFace.innerText = FACES.dead;
                msg.innerText = "寵物已經沒有力氣了...";
                petFace.classList.remove('breathing');
            } else if (petData.hunger < 30) {
                petFace.innerText = petData.poop ? FACES.poopSad : FACES.sad;
                msg.innerText = "肚子好餓喔...";
            } else if (petData.happy < 30) {
                petFace.innerText = petData.poop ? FACES.poopSad : FACES.sad;
                msg.innerText = "好無聊，陪我玩！";
            } else if (petData.poop) {
                petFace.innerText = FACES.poopNormal;
                msg.innerText = "環境好髒...";
            } else {
                petFace.innerText = FACES.normal;
                msg.innerText = "寵物很健康！";
                if (!petFace.classList.contains('breathing')) petFace.classList.add('breathing');
            }
        }

        // 動作：餵食
        function feedPet() {
            if(petData.hunger >= 100) {
                document.getElementById('messageDisplay').innerText = "吃不下了！";
                return;
            }
            petData.hunger = Math.min(100, petData.hunger + 20);
            animateAction(FACES.eating, "냠냠...好吃！");
        }

        // 動作：玩耍
        function playPet() {
            if(petData.hunger < 20) {
                document.getElementById('messageDisplay').innerText = "太餓了不想玩...";
                return;
            }
            if(petData.happy >= 100) {
                document.getElementById('messageDisplay').innerText = "已經很開心了！";
                return;
            }
            petData.happy = Math.min(100, petData.happy + 20);
            petData.hunger = Math.max(0, petData.hunger - 5); // 玩耍會變餓
            animateAction(FACES.happy, "好耶！太好玩了！");
        }

        // 動作：打掃
        function cleanPet() {
            if (petData.poop) {
                petData.poop = false;
                petData.happy = Math.min(100, petData.happy + 10);
                animateAction(FACES.happy, "環境變乾淨了！");
            } else {
                document.getElementById('messageDisplay').innerText = "現在很乾淨喔。";
            }
        }

        // 暫時顯示表情動畫，然後恢復正常
        function animateAction(face, message) {
            const petFace = document.getElementById('petFace');
            petFace.innerText = face;
            document.getElementById('messageDisplay').innerText = message;
            savePetData();
           
            setTimeout(() => {
                updateScreen();
            }, 2000); // 2秒後恢復原狀
        }

        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
