<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeBase - 我們家的小柴犬</title>
    <link rel="icon" href="homebase_icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="homebase_icon.jpg">

    <style>
        :root {
            --primary-color: #2e7d32;
            --bg-color: #f4f9f4;
            /* 將螢幕調亮一點的復古遊戲機綠色，讓彩色像素更明顯 */
            --lcd-bg: #dbe2b8; 
            --lcd-text: #2c3321;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei"; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; text-align: center; }
        
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; max-width: 500px; margin: 0 auto 15px auto; }
        .btn-back { background: #f0f0f0; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: #555; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .current-user-badge { background: white; padding: 6px 14px; border-radius: 30px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--primary-color); }
        .mini-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid var(--primary-color); }
        
        .system-title { color: #d84315; font-size: 22px; margin-bottom: 15px; margin-top: 0; font-weight: bold; }

        .device-shell {
            background: #f5a623; 
            max-width: 320px; margin: 0 auto;
            border-radius: 40px 40px 60px 60px;
            padding: 30px 20px 40px 20px;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.15), 0 10px 20px rgba(0,0,0,0.2);
            border: 2px solid #e67e22;
        }

        .lcd-screen {
            background-color: var(--lcd-bg);
            border: 4px solid #555; border-radius: 10px;
            padding: 15px; height: 180px;
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
            position: relative; overflow: hidden; transition: background-color 0.3s;
        }

        .status-bar { display: flex; justify-content: space-between; font-size: 14px; font-family: monospace; font-weight: bold; color: var(--lcd-text); z-index: 10; }
        
        /* === 像素圖畫布設定 === */
        .pet-area {
            position: relative;
            width: 100%; height: 100px;
            display: flex; justify-content: center; align-items: center;
        }
        .canvas-wrapper {
            position: relative;
            width: 100px; height: 75px; 
            margin-top: 15px;
        }
        
        /* 用來畫圖的 div 本體(設為單一像素大小) */
        .pixel-art { position: absolute; top: 0; left: 0; background: transparent; }
        
        #poopCanvas { left: 80px; top: 45px; } /* 大便位置 */

        /* 動畫 */
        .breathing { animation: float 2s infinite ease-in-out; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
        .sleeping-anim { animation: snooze 3s infinite; }
        @keyframes snooze { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .lcd-message { font-size: 13px; font-family: monospace; font-weight: bold; color: var(--lcd-text); min-height: 18px; z-index: 10; }

        .buttons-container { display: flex; justify-content: space-around; margin-top: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-wrapper { text-align: center; width: 30%; }
        .btn-action {
            width: 55px; height: 55px; border-radius: 50%; background: #fff; border: 3px solid #ccc;
            box-shadow: 0 4px 0 #999, inset 0 -3px 5px rgba(0,0,0,0.1); font-size: 20px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; transition: 0.1s; margin: 0 auto;
        }
        .btn-action:active { transform: translateY(4px); box-shadow: 0 0 0 #999, inset 0 -3px 5px rgba(0,0,0,0.1); }
        .btn-label { font-size: 11px; font-weight: bold; color: white; margin-top: 5px; display: block; }
    </style>
</head>
<body>
    <div class="top-nav">
        <button class="btn-back" onclick="goBack()">❮ 返回</button>
        <div class="current-user-badge">
            <img id="petUserAvatar" class="mini-avatar" src="" alt="">
            <span id="petUserName"></span>
        </div>
    </div>

    <h2 class="system-title">🐕 我們家的小柴犬</h2>

    <div class="device-shell">
        <div class="lcd-screen" id="screenBg">
            <div class="status-bar">
                <span id="hungerDisplay">飽足: 100%</span>
                <span id="happyDisplay">心情: 100%</span>
            </div>
            
            <!-- 柴犬的畫布 -->
            <div class="pet-area breathing" id="petAnimationArea">
                <div class="canvas-wrapper">
                    <div id="petCanvas" class="pixel-art"></div>
                    <div id="poopCanvas" class="pixel-art"></div>
                </div>
            </div>

            <div class="lcd-message" id="messageDisplay">小柴今天很健康喔！汪！</div>
        </div>

        <div class="buttons-container">
            <div class="btn-wrapper">
                <button class="btn-action" onclick="feedPet()">🍖</button>
                <span class="btn-label">餵肉肉</span>
            </div>
            <div class="btn-wrapper">
                <button class="btn-action" onclick="playPet()">🎾</button>
                <span class="btn-label">丟球</span>
            </div>
            <div class="btn-wrapper">
                <button class="btn-action" onclick="cleanPet()">🧹</button>
                <span class="btn-label">撿便便</span>
            </div>
            <div class="btn-wrapper">
                <button class="btn-action" onclick="touchPet()">✋</button>
                <span class="btn-label">摸摸頭</span>
            </div>
            <div class="btn-wrapper">
                <button class="btn-action" onclick="toggleSleep()">🌙</button>
                <span class="btn-label">睡覺</span>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let isSleeping = false;
        let petData = { hunger: 100, happy: 100, lastUpdate: Date.now(), poop: false };

        // === 像素地圖定義 (1單位 = 5px) ===
        // K=黑框, O=柴犬橘, W=白毛, P=粉紅舌頭/耳, B=大便棕
        const PIXEL_SIZE = 5;
        const MAPS = {
            normal: [
                "....KKK......KKK....",
                "...KOOOK....KOOOK...",
                "...KOPPK....KOPPK...",
                "..KOOOOKKKKKKOOOOK..",
                ".KOOOOOOOOOOOOOOOKK.",
                ".KOOOOOOOOOOOOOOOOKK",
                ".KOOKWKWOWKWKOOOOOKK",
                "..KOWWWKKKWWWKOOOOK.",
                "..KOWWWWWWWWWKKOOK..",
                "...KKWWWWWWWK.KK....",
                "...KOOOOOOOOOOK.....",
                "..KOOOOOOOOOOOOK....",
                "..KOWWKOOOOKWWKK....",
                "..KOWWK....KWWK.....",
                "...KKK......KKK....."
            ],
            happy: [
                "....KKK......KKK....",
                "...KOOOK....KOOOK...",
                "...KOPPK....KOPPK...",
                "..KOOOOKKKKKKOOOOK..",
                ".KOOOOOOOOOOOOOOOKK.",
                ".KOOOOOOOOOOOOOOOOKK",
                ".KOOKWKWOWKWKOOOOOKK",
                "..KOWWWKKKWWWKOOOOK.",
                "..KOWWWKPKWWWKKOOK..",
                "...KKWWKWWWWK.KK....",
                "...KOOOOOOOOOOK.....",
                "..KOOOOOOOOOOOOK....",
                "..KOWWKOOOOKWWKK....",
                "..KOWWK....KWWK.....",
                "...KKK......KKK....."
            ],
            sad: [
                "....KKK......KKK....",
                "...KOOOK....KOOOK...",
                "...KOPPK....KOPPK...",
                "..KOOOOKKKKKKOOOOK..",
                ".KOOOOOOOOOOOOOOOKK.",
                ".KOOOOOOOOOOOOOOOOKK",
                ".KOOWWWWOWWWWWOOOOKK",
                "..KOWKWWKKWKWWKOOOK.",
                "..KOWWWWWWWWWWKKOOK.",
                "...KKWWWWWWWK.KK....",
                "...KOOOOOOOOOOK.....",
                "..KOOOOOOOOOOOOK....",
                "..KOWWKOOOOKWWKK....",
                "..KOWWK....KWWK.....",
                "...KKK......KKK....."
            ],
            sleep: [
                "....................",
                "....................",
                "....................",
                ".......KKK....KKK...",
                "......KOOOK..KOOOK..",
                ".....KKOOOOKKOOOOK..",
                "....KOOOOOOOOOOOOK..",
                "...KOOOOOOOOOOOOOOKK",
                "...KOWWKKOWWKOOOOOOK",
                "...KOWWWWWWWWWWWKKK.",
                "....KKKWWWWWWWKK....",
                ".......KKKKKKK......",
                "....................",
                "....................",
                "...................."
            ],
            play: [
                "....................",
                "...............KKK..",
                "..............KOOOK.",
                "..............KOOOK.",
                ".....KKK.....KKOOOK.",
                "....KOOOK...KOOOOK..",
                "....KOPPK...KOOOOK..",
                "...KOOOOKKKKOOOOK...",
                "...KOOOOOOOOOOOOK...",
                "..KKOOOOOOOOOOOK....",
                "..KOWWKKOWWKKK......",
                "..KOWWWWWWWK........",
                "...KKKWWWKK.........",
                "......KKK...........",
                "...................."
            ],
            poop: [
                "......K.......",
                ".....KBK......",
                "....KBBBK.....",
                "...KBBBBBK....",
                "...KBBBBBK....",
                "....KKKKK....."
            ]
        };

        // 像素繪圖引擎
        function drawPixelArt(elementId, mapArray) {
            const el = document.getElementById(elementId);
            if (!mapArray) { el.style.boxShadow = 'none'; return; }
            
            const colors = { 'K': '#1a1a1a', 'O': '#e58d2e', 'W': '#fdf5e6', 'P': '#f07c7c', 'B': '#8b5a2b' };
            let boxShadows = [];
            
            for (let y = 0; y < mapArray.length; y++) {
                const row = mapArray[y];
                for (let x = 0; x < row.length; x++) {
                    const char = row[x];
                    if (colors[char]) {
                        boxShadows.push(`${x * PIXEL_SIZE}px ${y * PIXEL_SIZE}px 0 ${colors[char]}`);
                    }
                }
            }
            el.style.width = `${PIXEL_SIZE}px`;
            el.style.height = `${PIXEL_SIZE}px`;
            el.style.boxShadow = boxShadows.join(', ');
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('familyCheckInUser');
            if (!savedUser) { window.location.href = 'index.html'; return; }
            currentUser = JSON.parse(savedUser);
            document.getElementById('petUserAvatar').src = currentUser.avatar;
            document.getElementById('petUserName').innerText = currentUser.name;
            
            loadPetData();
            calculateTimeDecay();
            updateScreen();
            setInterval(autoDecay, 60000); 
        };

        function loadPetData() {
            const saved = localStorage.getItem(`shared_FamilyPetDB`);
            if (saved) petData = JSON.parse(saved);
        }

        function savePetData() {
            if (!isSleeping) petData.lastUpdate = Date.now();
            localStorage.setItem(`shared_FamilyPetDB`, JSON.stringify(petData));
        }

        function calculateTimeDecay() {
            if (isSleeping) return;
            const now = Date.now();
            const diffMinutes = Math.floor((now - petData.lastUpdate) / 60000);
            
            if (diffMinutes > 30) {
                const decay = Math.floor(diffMinutes / 30) * 5; 
                petData.hunger = Math.max(0, petData.hunger - decay);
                petData.happy = Math.max(0, petData.happy - decay);
                if (diffMinutes > 120 && Math.random() > 0.5) petData.poop = true;
                savePetData();
            }
        }

        function autoDecay() {
            if (isSleeping) return;
            petData.hunger = Math.max(0, petData.hunger - 1);
            petData.happy = Math.max(0, petData.happy - 1);
            savePetData();
            updateScreen();
        }

        function updateScreen() {
            if (isSleeping) return;
            document.getElementById('hungerDisplay').innerText = `飽足: ${petData.hunger}%`;
            document.getElementById('happyDisplay').innerText = `心情: ${petData.happy}%`;
            
            const msg = document.getElementById('messageDisplay');
            const animArea = document.getElementById('petAnimationArea');

            // 畫大便
            if (petData.poop) drawPixelArt('poopCanvas', MAPS.poop);
            else drawPixelArt('poopCanvas', null);

            // 畫柴犬
            if (petData.hunger === 0 && petData.happy === 0) {
                drawPixelArt('petCanvas', MAPS.sad);
                msg.innerText = "小柴餓到沒力氣了...";
                animArea.classList.remove('breathing');
            } else if (petData.hunger < 30) {
                drawPixelArt('petCanvas', MAPS.sad);
                msg.innerText = "小柴肚子好餓喔...";
            } else if (petData.happy < 30) {
                drawPixelArt('petCanvas', MAPS.sad);
                msg.innerText = "小柴好無聊，陪我玩！";
            } else if (petData.poop) {
                drawPixelArt('petCanvas', MAPS.sad);
                msg.innerText = "小柴覺得環境好髒...";
            } else {
                drawPixelArt('petCanvas', MAPS.normal);
                msg.innerText = "小柴今天很健康喔！汪！";
                if (!animArea.classList.contains('breathing')) animArea.classList.add('breathing');
            }
        }

        function checkWakeUp() {
            if (isSleeping) {
                document.getElementById('messageDisplay').innerText = "噓...小柴還在睡覺。";
                return false;
            }
            return true;
        }

        function feedPet() {
            if (!checkWakeUp()) return;
            if(petData.hunger >= 100) { document.getElementById('messageDisplay').innerText = "小柴吃不下了！汪！"; return; }
            petData.hunger = Math.min(100, petData.hunger + 20);
            animateAction('happy', "냠냠...肉肉好吃！汪！");
        }

        function playPet() {
            if (!checkWakeUp()) return;
            if(petData.hunger < 20) { document.getElementById('messageDisplay').innerText = "太餓了不想撿球..."; return; }
            if(petData.happy >= 100) { document.getElementById('messageDisplay').innerText = "小柴已經很開心了！"; return; }
            petData.happy = Math.min(100, petData.happy + 20);
            petData.hunger = Math.max(0, petData.hunger - 5);
            animateAction('play', "好耶！接住球了！汪！");
        }

        function cleanPet() {
            if (!checkWakeUp()) return;
            if (petData.poop) {
                petData.poop = false; petData.happy = Math.min(100, petData.happy + 10);
                drawPixelArt('poopCanvas', null); // 立即清除大便
                animateAction('happy', "環境變乾淨了！汪！");
            } else {
                document.getElementById('messageDisplay').innerText = "現在地板很乾淨喔。";
            }
        }

        function touchPet() {
            if (!checkWakeUp()) return;
            petData.happy = Math.min(100, petData.happy + 5);
            animateAction('happy', `小柴最喜歡 ${currentUser.name} 了！汪！`);
        }

        function toggleSleep() {
            const screenBg = document.getElementById('screenBg');
            const animArea = document.getElementById('petAnimationArea');
            
            isSleeping = !isSleeping;
            if (isSleeping) {
                drawPixelArt('petCanvas', MAPS.sleep);
                document.getElementById('messageDisplay').innerText = "小柴打呼中... zZ";
                animArea.classList.remove('breathing');
                animArea.classList.add('sleeping-anim');
                screenBg.style.backgroundColor = "#828c62"; // 螢幕關燈變暗
            } else {
                petData.lastUpdate = Date.now(); 
                animArea.classList.remove('sleeping-anim');
                screenBg.style.backgroundColor = "var(--lcd-bg)"; // 開燈
                updateScreen();
            }
        }

        function animateAction(mapName, message) {
            drawPixelArt('petCanvas', MAPS[mapName]);
            document.getElementById('messageDisplay').innerText = message;
            savePetData();
            setTimeout(() => { if(!isSleeping) updateScreen(); }, 2000); 
        }

        function goBack() { window.location.href = 'index.html'; }
    </script>
</body>
</html>
