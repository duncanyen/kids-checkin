<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeBase - 家庭聊天室</title>
    <link rel="icon" href="homebase_icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="homebase_icon.jpg">
    <meta name="apple-mobile-web-app-title" content="HomeBase">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-light: #e8f5e9;
            --accent-color: #4caf50;
            --bg-color: #f4f9f4;
            --chat-bg: #e5ddd5;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei"; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; text-align: center; }
        
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; max-width: 650px; margin-left: auto; margin-right: auto; }
        .btn-back { background: #f0f0f0; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: #555; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .current-user-badge { background: white; padding: 6px 14px; border-radius: 30px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--primary-color); }
        .mini-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid var(--primary-color); }
        
        /* 聊天頻道切換列 */
        .channel-bar { max-width: 650px; margin: 0 auto 12px auto; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .btn-channel { flex: 1; min-width: 90px; background: white; border: 2px solid var(--primary-color); color: var(--primary-color); padding: 8px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-channel.active { background: var(--primary-color); color: white; }

        /* 聊天室主體 */
        .chat-wrapper { max-width: 650px; margin: 0 auto; background: white; border-radius: 16px; display: flex; flex-direction: column; height: 72vh; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .chat-header-info { background: var(--primary-light); padding: 10px; font-weight: bold; color: var(--primary-color); font-size: 14px; border-bottom: 1px solid #c8e6c9; display: flex; justify-content: space-between; align-items: center; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: var(--chat-bg); display: flex; flex-direction: column; gap: 12px; }
        .chat-msg { max-width: 75%; padding: 10px 14px; border-radius: 15px; font-size: 15px; position: relative; line-height: 1.4; word-wrap: break-word; text-align: left; }
        .msg-mine { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg-other { align-self: flex-start; background: white; border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 12px; color: #555; margin-bottom: 4px; font-weight: bold; }
        .msg-time { font-size: 11px; color: #999; text-align: right; margin-top: 5px; }
        
        .chat-input-area { padding: 12px; background: #f0f0f0; display: flex; gap: 8px; align-items: center; }
        .chat-input-area input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 15px; }
        .chat-input-area button { margin: 0; padding: 10px 20px; background: var(--accent-color); color: white; border: none; font-weight: bold; font-size: 15px; border-radius: 25px; cursor: pointer; }
        
        /* 成員選擇 Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 16px; width: 85%; max-width: 360px; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-title { font-size: 18px; font-weight: bold; color: var(--primary-color); margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; text-align: center; }
        .member-checkbox-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 200px; overflow-y: auto; }
        .member-item { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-modal-cancel { background: #888; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-modal-confirm { background: var(--accent-color); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-nav">
        <button class="btn-back" id="btnBack">❮ 返回主選單</button>
        <div class="current-user-badge">
            <img id="chatUserAvatar" class="mini-avatar" src="" alt="">
            <span id="chatUserName">載入中...</span>
        </div>
    </div>

    <!-- 頻道切換選擇區 -->
    <div class="channel-bar">
        <button class="btn-channel active" id="btnChannelAll">🌐 所有人(大群組)</button>
        <button class="btn-channel" id="btnChannelDirect">👤 私訊/指定對象</button>
    </div>

    <!-- 聊天主介面 -->
    <div class="chat-wrapper">
        <div class="chat-header-info">
            <span id="chatTargetTitle">💬 聊天室：所有人 (全體)</span>
            <button id="btnChangeTarget" style="display:none; font-size:12px; padding:4px 10px; background:var(--primary-color); color:white; border:none; border-radius:12px; cursor:pointer;">更換對象</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div style="text-align:center; color:#888; font-size:14px; margin-top:20px;">載入訊息中...</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="輸入訊息...">
            <button id="btnSend">傳送</button>
        </div>
    </div>

    <!-- 選擇成員彈窗 -->
    <div class="modal" id="memberModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">選擇對談家人</div>
            <div class="member-checkbox-list" id="memberListContainer"></div>
            <div class="modal-btns">
                <button class="btn-modal-cancel" id="btnCancelModal">取消</button>
                <button class="btn-modal-confirm" id="btnConfirmModal">確定進入聊天</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            getDocs, 
            query, 
            where, 
            orderBy, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        // 1. Firebase 初始化
        const firebaseConfig = {
            apiKey: "AIzaSyCj3XrBxi1c3RokMzCIhEB3hjJB-BPuO9Y",
            authDomain: "homebasedb.firebaseapp.com",
            projectId: "homebasedb",
            storageBucket: "homebasedb.firebasestorage.app",
            messagingSenderId: "476832900272",
            appId: "1:476832900272:web:443bacb7cbc3113e9f8775",
            measurementId: "G-K7FSPG5B9R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. 登入檢查
        const savedUserStr = sessionStorage.getItem('familyCheckInUser') || localStorage.getItem('familyCheckInUser');
        let currentUser = savedUserStr ? JSON.parse(savedUserStr) : null;

        if (!currentUser) {
            alert('請先選擇使用者登入！');
            window.location.href = 'index.html';
        } else {
            document.getElementById('chatUserAvatar').src = currentUser.avatar || 'homebase_icon.jpg';
            document.getElementById('chatUserName').innerText = currentUser.name || '成員';
        }

        // 當前對話狀態變數
        let currentMode = 'all'; // 'all' 或 'target'
        let selectedTargets = []; // 被選中的成員名稱陣列 (不含自己)
        let activeUnsubscribe = null; // 取消即時監聽函式
        let allUsers = [];

        const msgContainer = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');

        // 更新此聊天情境的閱讀時間紀錄
        function updateLastReadTime() {
            if (currentUser && currentUser.name) {
                localStorage.setItem(`lastChatReadTime_${currentUser.name}`, String(Date.now()));
            }
        }

        // 3. 載入家庭所有成員名單
        async function fetchFamilyUsers() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                allUsers = [];
                querySnapshot.forEach(docSnap => {
                    const uData = docSnap.data();
                    if (uData.name !== currentUser.name) {
                        allUsers.push(uData);
                    }
                });
            } catch (error) {
                console.error("載入成員名單失敗：", error);
            }
        }

        // 4. 監聽聊天訊息 (依模式切換查詢條件)
        function listenToMessages() {
            if (activeUnsubscribe) activeUnsubscribe(); // 清除舊的監聽

            const messagesRef = collection(db, "messages");
            let q;

            if (currentMode === 'all') {
                // 大群組模式
                q = query(messagesRef, where("type", "==", "all"), orderBy("timestamp", "asc"));
                document.getElementById('chatTargetTitle').innerText = "💬 聊天室：所有人 (全體)";
                document.getElementById('btnChangeTarget').style.display = "none";
            } else {
                // 指定對象模式 (含自己與對方的對話組合)
                const fullParticipants = [currentUser.name, ...selectedTargets].sort();
                const conversationId = fullParticipants.join('_');

                q = query(
                    messagesRef, 
                    where("conversationId", "==", conversationId), 
                    orderBy("timestamp", "asc")
                );

                const targetTitleStr = selectedTargets.join('、');
                document.getElementById('chatTargetTitle').innerText = `💬 聊天室：${targetTitleStr}`;
                document.getElementById('btnChangeTarget').style.display = "inline-block";
            }

            activeUnsubscribe = onSnapshot(q, (snapshot) => {
                msgContainer.innerHTML = '';

                if (snapshot.empty) {
                    msgContainer.innerHTML = '<div style="text-align:center; color:#888; font-size:13px; margin-top:20px;">尚無對話內容，發個訊息打個招呼吧！</div>';
                } else {
                    snapshot.forEach((doc) => {
                        const msg = doc.data();
                        appendMessageUI(msg.sender, msg.text, msg.timestamp);
                    });
                }
                updateLastReadTime();
                msgContainer.scrollTop = msgContainer.scrollHeight;
            }, (error) => {
                console.error("即時監聽訊息失敗：", error);
                msgContainer.innerHTML = '<div style="text-align:center; color:#e53935; font-size:13px; margin-top:20px;">載入訊息失敗</div>';
            });
        }

        // 5. 發送訊息至 Firebase
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            btnSend.disabled = true;

            try {
                let msgData = {
                    sender: currentUser.name,
                    text: text,
                    timestamp: serverTimestamp()
                };

                if (currentMode === 'all') {
                    msgData.type = 'all';
                    msgData.participants = ['all'];
                } else {
                    const fullParticipants = [currentUser.name, ...selectedTargets].sort();
                    msgData.type = selectedTargets.length === 1 ? 'direct' : 'group';
                    msgData.participants = fullParticipants;
                    msgData.conversationId = fullParticipants.join('_');
                }

                await addDoc(collection(db, "messages"), msgData);
                updateLastReadTime();
            } catch (error) {
                console.error("發送訊息失敗：", error);
                alert("訊息發送失敗，請再試一次。");
            } finally {
                btnSend.disabled = false;
                chatInput.focus();
            }
        }

        // 6. 渲染單筆訊息 UI
        function appendMessageUI(sender, text, timestamp) {
            const isMine = (sender === currentUser.name);

            const div = document.createElement('div');
            div.className = `chat-msg ${isMine ? 'msg-mine' : 'msg-other'}`;

            let timeStr = "剛才";
            if (timestamp && timestamp.toDate) {
                const dateObj = timestamp.toDate();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const date = String(dateObj.getDate()).padStart(2, '0');
                const hours = String(dateObj.getHours()).padStart(2, '0');
                const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                timeStr = `${month}/${date} ${hours}:${minutes}`;
            }

            let html = '';
            if (!isMine) html += `<div class="msg-sender">${sender}</div>`;
            html += `<div>${text}</div><div class="msg-time">${timeStr}</div>`;
            
            div.innerHTML = html;
            msgContainer.appendChild(div);
        }

        // 7. 開啟成員選擇 Modal
        function openMemberModal() {
            const container = document.getElementById('memberListContainer');
            container.innerHTML = '';

            if (allUsers.length === 0) {
                container.innerHTML = '<div style="color:#888;">無其他成員</div>';
            } else {
                allUsers.forEach(u => {
                    const isChecked = selectedTargets.includes(u.name);
                    const label = document.createElement('label');
                    label.className = 'member-item';
                    label.innerHTML = `
                        <input type="checkbox" value="${u.name}" ${isChecked ? 'checked' : ''}>
                        <span>${u.name}</span>
                    `;
                    container.appendChild(label);
                });
            }

            document.getElementById('memberModal').style.display = 'flex';
        }

        // 事件控制與切換邏輯
        document.getElementById('btnChannelAll').addEventListener('click', () => {
            currentMode = 'all';
            document.getElementById('btnChannelAll').classList.add('active');
            document.getElementById('btnChannelDirect').classList.remove('active');
            listenToMessages();
        });

        document.getElementById('btnChannelDirect').addEventListener('click', () => {
            openMemberModal();
        });

        document.getElementById('btnChangeTarget').addEventListener('click', () => {
            openMemberModal();
        });

        document.getElementById('btnCancelModal').addEventListener('click', () => {
            document.getElementById('memberModal').style.display = 'none';
        });

        document.getElementById('btnConfirmModal').addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('#memberListContainer input[type="checkbox"]:checked');
            const selected = Array.from(checkboxes).map(cb => cb.value);

            if (selected.length === 0) {
                alert('請至少選擇一位家人進行對話！');
                return;
            }

            selectedTargets = selected;
            currentMode = 'target';

            document.getElementById('btnChannelDirect').classList.add('active');
            document.getElementById('btnChannelAll').classList.remove('active');
            document.getElementById('memberModal').style.display = 'none';

            listenToMessages();
        });

        btnSend.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        document.getElementById('btnBack').addEventListener('click', () => {
            updateLastReadTime();
            window.location.href = 'index.html';
        });

        // 初始化
        fetchFamilyUsers();
        listenToMessages();
    </script>
</body>
</html>
