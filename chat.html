<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeBase - 家庭聊天室</title>
    <link rel="icon" href="homebase_icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="homebase_icon.jpg">
    <meta name="apple-mobile-web-app-title" content="HomeBase">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-light: #e8f5e9;
            --accent-color: #4caf50;
            --bg-color: #f4f9f4;
            --chat-bg: #e5ddd5;
            --border-color: #e0e0e0;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; color: #333; }
        
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; max-width: 650px; margin-left: auto; margin-right: auto; }
        .btn-back { background: #f0f0f0; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: #555; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        /* 介面容器切換 */
        .view-container { max-width: 650px; margin: 0 auto; background: white; border-radius: 16px; height: 80vh; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; position: relative; }
        
        /* --- 第一層：群組清單 (Room List) --- */
        .list-header { background: var(--primary-color); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; }
        .btn-new-chat { background: white; color: var(--primary-color); border: none; padding: 6px 12px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .room-list-content { flex: 1; overflow-y: auto; background: white; }
        
        .room-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .room-item:active { background-color: #f5f5f5; }
        .room-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; flex-shrink: 0; margin-right: 15px; background: var(--primary-light); }
        .room-info { flex: 1; overflow: hidden; }
        .room-title-row { display: flex; justify-content: space-between; margin-bottom: 5px; align-items: center; }
        .room-name { font-weight: bold; font-size: 16px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .room-time { font-size: 11px; color: #999; flex-shrink: 0; }
        .room-last-msg { font-size: 13px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- 第二層：聊天室內 (Chat Room) --- */
        .chat-header { background: var(--primary-color); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .chat-header-left { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .chat-header-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid white; }
        .chat-header-name { font-weight: bold; font-size: 16px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-room-settings { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: var(--chat-bg); display: flex; flex-direction: column; gap: 12px; }
        
        /* 訊息氣泡外層包裹 (為了已讀狀態排版) */
        .chat-msg-wrapper { display: flex; flex-direction: column; max-width: 75%; position: relative; }
        .msg-mine-wrapper { align-self: flex-end; align-items: flex-end; }
        .msg-other-wrapper { align-self: flex-start; align-items: flex-start; }

        .chat-msg { padding: 10px 14px; border-radius: 15px; font-size: 15px; position: relative; line-height: 1.4; word-wrap: break-word; cursor: pointer; }
        .msg-mine { background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg-other { background: white; border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 11px; color: #555; margin-bottom: 4px; font-weight: bold; }
        
        /* 狀態列 (時間與已讀) */
        .msg-status-row { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
        .msg-time { font-size: 10px; color: #888; }
        .msg-read { font-size: 10px; color: #0277bd; font-weight: bold; }

        /* 回覆與標記樣式 */
        .reply-quote { background: rgba(0,0,0,0.05); border-left: 4px solid var(--primary-color); padding: 5px 8px; border-radius: 4px; font-size: 13px; color: #555; margin-bottom: 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .mention-text { color: #1565c0; font-weight: bold; }
        .msg-retracted { background: transparent; border: 1px solid #ccc; color: #888; font-style: italic; padding: 6px 12px; cursor: default; }
        
        .chat-photo { max-width: 100%; max-height: 220px; border-radius: 10px; cursor: pointer; display: block; border: 1px solid #ddd; margin-top: 4px; }
        
        /* --- 輸入區與功能擴充 --- */
        .input-container-wrapper { background: #f0f0f0; border-top: 1px solid #ddd; display: flex; flex-direction: column; }
        
        .reply-preview-area { display: none; padding: 8px 15px; background: #e0e0e0; border-left: 4px solid var(--primary-color); font-size: 13px; color: #555; justify-content: space-between; align-items: center; }
        .btn-cancel-reply { background: none; border: none; font-size: 18px; color: #888; cursor: pointer; }

        .mention-menu { display: none; position: absolute; bottom: 100%; left: 0; width: 100%; max-height: 150px; overflow-y: auto; background: white; border-top: 1px solid #ddd; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); z-index: 20; }
        .mention-item { padding: 10px 15px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; font-weight: bold; }
        .mention-item:active { background: #f5f5f5; }

        .chat-input-area { padding: 10px; display: flex; gap: 8px; align-items: center; position: relative; }
        .btn-upload-photo { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0 5px; color: #555; }
        .chat-input-area input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 15px; }
        .chat-input-area button.btn-send { padding: 10px 18px; background: var(--accent-color); color: white; border: none; font-weight: bold; border-radius: 20px; cursor: pointer; }

        /* --- 訊息選項選單 (BottomSheet) --- */
        .msg-action-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); z-index: 5000; justify-content: center; align-items: flex-end; }
        .msg-action-content { background: white; width: 100%; max-width: 650px; border-radius: 16px 16px 0 0; padding: 20px; box-sizing: border-box; animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .action-btn { width: 100%; padding: 15px; background: none; border: none; font-size: 16px; border-bottom: 1px solid #eee; cursor: pointer; text-align: left; }
        .action-btn.danger { color: #e53935; font-weight: bold; border-bottom: none; }

        /* --- 照片放大全螢幕檢視器 --- */
        .photo-viewer { display: none; position: fixed; z-index: 6000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; }
        .viewer-content { max-width: 95%; max-height: 85vh; object-fit: contain; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .close-viewer { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 30px; font-weight: bold; cursor: pointer; background: rgba(0,0,0,0.5); width: 40px; height: 40px; text-align: center; line-height: 38px; border-radius: 50%; }

        /* --- 建立/編輯群組 Modal --- */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 16px; width: 90%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-title { font-size: 18px; font-weight: bold; color: var(--primary-color); margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; text-align: center; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .form-group input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        
        .avatar-upload-area { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; }
        .preview-group-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-color); margin-bottom: 8px; background: #eee; }
        .btn-upload { font-size: 12px; background: #f0f0f0; border: 1px solid #ccc; padding: 5px 10px; border-radius: 12px; cursor: pointer; }

        .member-checkbox-list { display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; background: #fafafa; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
        .member-item { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-modal-cancel { background: #888; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-modal-confirm { background: var(--accent-color); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-nav">
        <button class="btn-back" id="btnBackToDashboard">❮ 返回主選單</button>
    </div>

    <!-- 視圖 1：群組清單 -->
    <div class="view-container" id="viewRoomList">
        <div class="list-header">
            <span>💬 聊天群組</span>
            <button class="btn-new-chat" id="btnOpenCreateModal">➕ 建立群組</button>
        </div>
        <div class="room-list-content" id="roomListContainer">
            <div style="text-align:center; padding:30px; color:#888;">讀取群組中...</div>
        </div>
    </div>

    <!-- 視圖 2：聊天室內部 -->
    <div class="view-container" id="viewChatRoom" style="display: none;">
        <div class="chat-header">
            <div class="chat-header-left" id="btnBackToList">
                <span style="font-size: 20px; margin-right: 5px;">❮</span>
                <img id="activeRoomAvatar" class="chat-header-avatar" src="" alt="">
                <span id="activeRoomName" class="chat-header-name">載入中...</span>
            </div>
            <button class="btn-room-settings" id="btnOpenEditModal">⚙️</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        
        <!-- 輸入區與擴充功能區 -->
        <div class="input-container-wrapper">
            <!-- 回覆預覽區 -->
            <div class="reply-preview-area" id="replyPreviewArea">
                <div style="overflow:hidden;">
                    <strong id="replyPreviewSender" style="color:var(--primary-color);"></strong><br>
                    <span id="replyPreviewText" style="white-space:nowrap;"></span>
                </div>
                <button class="btn-cancel-reply" onclick="cancelReply()">✕</button>
            </div>
            
            <!-- @ 標記名單選單 -->
            <div class="mention-menu" id="mentionMenu"></div>

            <div class="chat-input-area">
                <button class="btn-upload-photo" id="btnTriggerPhoto" title="傳送圖片">📷</button>
                <input type="file" id="chatPhotoInput" accept="image/*" style="display: none;">
                
                <input type="text" id="chatInput" placeholder="輸入訊息... (輸入 @ 可標記成員)">
                <button class="btn-send" id="btnSend">傳送</button>
            </div>
        </div>
    </div>

    <!-- 點擊訊息的操作選單 -->
    <div class="msg-action-modal" id="msgActionModal" onclick="closeMsgActionModal(event)">
        <div class="msg-action-content">
            <button class="action-btn" id="btnActionReply" onclick="triggerReply()">回覆此訊息</button>
            <button class="action-btn danger" id="btnActionRetract" onclick="triggerRetract()" style="display:none;">收回訊息 (24小時內)</button>
            <button class="action-btn" style="text-align:center; color:#888;">取消</button>
        </div>
    </div>

    <!-- 共用 Modal：建立/編輯群組 -->
    <div class="modal" id="groupModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">建立新群組</div>
            
            <div class="avatar-upload-area">
                <img id="modalAvatarPreview" class="preview-group-avatar" src="https://ui-avatars.com/api/?name=G&background=4caf50&color=fff" alt="">
                <button class="btn-upload" onclick="document.getElementById('groupAvatarInput').click()">📷 上傳群組頭像</button>
                <input type="file" id="groupAvatarInput" accept="image/*" style="display: none;">
            </div>

            <div class="form-group">
                <label>群組名稱</label>
                <input type="text" id="modalGroupName" placeholder="例如：爸爸與俊俊的秘密基地">
            </div>

            <div class="form-group">
                <label>選擇參與家人 (自己已預設加入)</label>
                <div class="member-checkbox-list" id="memberListContainer"></div>
            </div>

            <div class="modal-btns">
                <button class="btn-modal-cancel" id="btnCancelModal">取消</button>
                <button class="btn-modal-confirm" id="btnConfirmModal">儲存並進入</button>
            </div>
        </div>
    </div>

    <!-- 照片放大檢視器 -->
    <div id="photoViewerModal" class="photo-viewer" onclick="window.closePhotoViewer()">
        <span class="close-viewer">&times;</span>
        <img class="viewer-content" id="viewerImage">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, getDocs, query, where, orderBy, 
            onSnapshot, serverTimestamp, doc, updateDoc 
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCj3XrBxi1c3RokMzCIhEB3hjJB-BPuO9Y",
            authDomain: "homebasedb.firebaseapp.com",
            projectId: "homebasedb",
            storageBucket: "homebasedb.firebasestorage.app",
            messagingSenderId: "476832900272",
            appId: "1:476832900272:web:443bacb7cbc3113e9f8775"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const savedUserStr = sessionStorage.getItem('familyCheckInUser') || localStorage.getItem('familyCheckInUser');
        let currentUser = savedUserStr ? JSON.parse(savedUserStr) : null;
        if (!currentUser) { alert('請先登入！'); window.location.href = 'index.html'; }

        let allUsers = [];
        let activeRoomId = null;
        let activeRoomData = null;
        let roomsUnsubscribe = null;
        let messagesUnsubscribe = null;
        let uploadedAvatarBase64 = null; 
        let modalMode = 'create'; 

        let pendingReplyMsgId = null;
        let pendingReplyData = null;
        let selectedMsgForAction = null; 

        fetchFamilyUsers();
        listenToRooms();

        async function fetchFamilyUsers() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                allUsers = [];
                querySnapshot.forEach(docSnap => {
                    const uData = docSnap.data();
                    if (uData.name !== currentUser.name) allUsers.push(uData);
                });
            } catch (error) { console.error("載入成員名單失敗：", error); }
        }

        function listenToRooms() {
            const roomsRef = collection(db, "rooms");
            const q = query(
                roomsRef, 
                where("participants", "array-contains", currentUser.name),
                orderBy("lastMessageTime", "desc")
            );

            roomsUnsubscribe = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('roomListContainer');
                container.innerHTML = '';
                
                if (snapshot.empty) {
                    container.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">還沒有任何群組，點擊上方按鈕建立一個吧！</div>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const room = docSnap.data();
                    const roomId = docSnap.id;
                    
                    if (roomId === activeRoomId) activeRoomData = room;

                    let timeStr = "";
                    if (room.lastMessageTime && room.lastMessageTime.toDate) {
                        const dateObj = room.lastMessageTime.toDate();
                        timeStr = `${String(dateObj.getMonth()+1).padStart(2,'0')}/${String(dateObj.getDate()).padStart(2,'0')} ${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`;
                    }

                    const displayAvatar = room.avatar || `https://ui-avatars.com/api/?name=${room.name}&background=e3f2fd&color=1565c0`;
                    const displayLastMsg = room.lastMessage || "尚未有訊息";

                    const div = document.createElement('div');
                    div.className = 'room-item';
                    div.onclick = () => enterRoom(roomId, room);
                    div.innerHTML = `
                        <img src="${displayAvatar}" class="room-avatar">
                        <div class="room-info">
                            <div class="room-title-row">
                                <span class="room-name">${room.name}</span>
                                <span class="room-time">${timeStr}</span>
                            </div>
                            <div class="room-last-msg">${displayLastMsg}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }, (error) => {
                console.error("載入群組失敗：", error);
            });
        }

        async function enterRoom(roomId, roomData) {
            activeRoomId = roomId;
            activeRoomData = roomData;
            
            document.getElementById('viewRoomList').style.display = 'none';
            document.getElementById('viewChatRoom').style.display = 'flex';
            
            document.getElementById('activeRoomName').innerText = roomData.name;
            document.getElementById('activeRoomAvatar').src = roomData.avatar || `https://ui-avatars.com/api/?name=${roomData.name}&background=e3f2fd&color=1565c0`;
            
            updateMyReadTimestamp(roomId);
            listenToMessages(roomId);
        }

        async function updateMyReadTimestamp(roomId) {
            if (!roomId) return;
            try {
                const roomRef = doc(db, "rooms", roomId);
                const updateData = {};
                updateData[`readTimestamps.${currentUser.name}`] = Date.now();
                await updateDoc(roomRef, updateData);
            } catch (e) { console.error("更新已讀時間失敗", e); }
        }

        document.getElementById('btnBackToList').addEventListener('click', () => {
            updateMyReadTimestamp(activeRoomId);
            if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
            activeRoomId = null;
            activeRoomData = null;
            document.getElementById('viewChatRoom').style.display = 'none';
            document.getElementById('viewRoomList').style.display = 'flex';
            localStorage.setItem(`lastChatReadTime_${currentUser.name}`, String(Date.now()));
        });

        function listenToMessages(roomId) {
            const msgContainer = document.getElementById('chatMessages');
            msgContainer.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">載入中...</div>';
            
            const q = query(
                collection(db, "messages"), 
                where("roomId", "==", roomId), 
                orderBy("timestamp", "asc")
            );

            messagesUnsubscribe = onSnapshot(q, (snapshot) => {
                const isAtBottom = msgContainer.scrollHeight - msgContainer.scrollTop <= msgContainer.clientHeight + 100;
                msgContainer.innerHTML = '';
                
                if (snapshot.empty) {
                    msgContainer.innerHTML = '<div style="text-align:center; color:#888; font-size:13px; margin-top:20px;">發個訊息打招呼吧！</div>';
                } else {
                    snapshot.forEach((docSnap) => {
                        const msg = docSnap.data();
                        appendMessageUI(docSnap.id, msg);
                    });
                }
                
                if (isAtBottom) msgContainer.scrollTop = msgContainer.scrollHeight;
                updateMyReadTimestamp(roomId);
                localStorage.setItem(`lastChatReadTime_${currentUser.name}`, String(Date.now()));
            });
        }

        // ================= 新版訊息渲染 (含已讀、收回、標記、回覆) =================
        function appendMessageUI(msgId, msg) {
            const isMine = (msg.sender === currentUser.name);
            const wrapper = document.createElement('div');
            wrapper.className = `chat-msg-wrapper ${isMine ? 'msg-mine-wrapper' : 'msg-other-wrapper'}`;
            
            let timeStr = "剛才";
            let msgTimestampMs = Date.now();
            if (msg.timestamp && msg.timestamp.toDate) {
                msgTimestampMs = msg.timestamp.toDate().getTime();
                const d = msg.timestamp.toDate();
                timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            }

            // 判斷已讀
            let readCount = 0;
            if (isMine && activeRoomData && activeRoomData.readTimestamps) {
                Object.keys(activeRoomData.readTimestamps).forEach(pName => {
                    if (pName !== currentUser.name && activeRoomData.readTimestamps[pName] >= msgTimestampMs) {
                        readCount++;
                    }
                });
            }
            let readHtml = readCount > 0 ? `<span class="msg-read">已讀${readCount > 1 ? ' '+readCount : ''}</span>` : '';

            // 判斷是否收回
            if (msg.isRetracted) {
                wrapper.innerHTML = `<div class="chat-msg msg-retracted">您收回了一則訊息</div>`;
                document.getElementById('chatMessages').appendChild(wrapper);
                return;
            }

            // @ 標記藍字處理
            let displayText = msg.text || '';
            if (activeRoomData && activeRoomData.participants) {
                activeRoomData.participants.forEach(p => {
                    if (p !== currentUser.name) {
                        const regex = new RegExp(`@${p}`, 'g');
                        displayText = displayText.replace(regex, `<span class="mention-text">@${p}</span>`);
                    }
                });
            }

            let contentHtml = '';
            if (msg.imageUrl) {
                contentHtml = `<img src="${msg.imageUrl}" class="chat-photo" onclick="window.openPhotoViewer(this.src)" title="點擊放大觀看">`;
            } else {
                contentHtml = `<div>${displayText}</div>`;
            }

            // 回覆引用
            let replyHtml = '';
            if (msg.replyTo) {
                const replyText = msg.replyTo.text ? msg.replyTo.text : (msg.replyTo.imageUrl ? '傳送了圖片' : '訊息');
                replyHtml = `<div class="reply-quote"><strong>${msg.replyTo.sender}</strong>: ${replyText}</div>`;
            }

            // 將純文字轉義避免引號錯誤
            const safeText = (msg.text || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

            wrapper.innerHTML = `
                ${!isMine ? `<div class="msg-sender">${msg.sender}</div>` : ''}
                <div class="chat-msg ${isMine ? 'msg-mine' : 'msg-other'}" onclick="openMsgAction('${msgId}', ${isMine}, ${msgTimestampMs}, '${msg.sender}', '${msg.imageUrl ? '[圖片]' : safeText}')">
                    ${replyHtml}
                    ${contentHtml}
                </div>
                <div class="msg-status-row">
                    ${isMine ? readHtml : ''}
                    <span class="msg-time">${timeStr}</span>
                </div>
            `;
            document.getElementById('chatMessages').appendChild(wrapper);
        }

        // --- 照片全螢幕預覽控制 ---
        window.openPhotoViewer = function(src) {
            document.getElementById('viewerImage').src = src;
            document.getElementById('photoViewerModal').style.display = 'flex';
        };
        window.closePhotoViewer = function() {
            document.getElementById('photoViewerModal').style.display = 'none';
            document.getElementById('viewerImage').src = '';
        };

        // ================= 輸入區功能 (@標記 與 傳送) =================
        const chatInput = document.getElementById('chatInput');
        const mentionMenu = document.getElementById('mentionMenu');

        chatInput.addEventListener('input', (e) => {
            const val = e.target.value;
            const lastAt = val.lastIndexOf('@');
            if (lastAt !== -1 && (lastAt === 0 || val.charAt(lastAt - 1) === ' ')) {
                const participants = activeRoomData.participants.filter(p => p !== currentUser.name);
                if (participants.length > 0) {
                    mentionMenu.innerHTML = '';
                    participants.forEach(p => {
                        const item = document.createElement('div');
                        item.className = 'mention-item';
                        item.innerText = p;
                        item.onclick = () => insertMention(p, lastAt);
                        mentionMenu.appendChild(item);
                    });
                    mentionMenu.style.display = 'block';
                    return;
                }
            }
            mentionMenu.style.display = 'none';
        });

        function insertMention(name, atIndex) {
            const currentVal = chatInput.value;
            chatInput.value = currentVal.substring(0, atIndex) + `@${name} ` + currentVal.substring(atIndex + 1);
            mentionMenu.style.display = 'none';
            chatInput.focus();
        }

        // 傳送文字訊息
        document.getElementById('btnSend').addEventListener('click', async () => {
            const text = chatInput.value.trim();
            if (!text && !document.getElementById('chatPhotoInput').files[0]) return;

            chatInput.value = '';
            document.getElementById('btnSend').disabled = true;
            mentionMenu.style.display = 'none';

            try {
                const msgData = {
                    roomId: activeRoomId,
                    sender: currentUser.name,
                    text: text,
                    timestamp: serverTimestamp()
                };

                if (pendingReplyMsgId) {
                    msgData.replyTo = pendingReplyData;
                    cancelReply(); 
                }

                await addDoc(collection(db, "messages"), msgData);

                await updateDoc(doc(db, "rooms", activeRoomId), {
                    lastMessage: `${currentUser.name}: ${text}`,
                    lastMessageTime: serverTimestamp()
                });
            } catch (e) {
                console.error("發送文字失敗：", e);
            } finally {
                document.getElementById('btnSend').disabled = false;
                chatInput.focus();
            }
        });
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('btnSend').click(); });

        // 照片上傳處理
        const btnTriggerPhoto = document.getElementById('btnTriggerPhoto');
        const chatPhotoInput = document.getElementById('chatPhotoInput');

        btnTriggerPhoto.addEventListener('click', () => {
            chatPhotoInput.click();
        });

        chatPhotoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !activeRoomId) return;

            document.getElementById('btnSend').disabled = true;
            btnTriggerPhoto.disabled = true;
            btnTriggerPhoto.innerText = '⏳'; 

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const maxSize = 600; 
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } } 
                    else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                    
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const base64Img = canvas.toDataURL('image/jpeg', 0.7); 

                    try {
                        const msgData = {
                            roomId: activeRoomId,
                            sender: currentUser.name,
                            text: "傳送了圖片",
                            imageUrl: base64Img,
                            timestamp: serverTimestamp()
                        };

                        if (pendingReplyMsgId) {
                            msgData.replyTo = pendingReplyData;
                            cancelReply(); 
                        }

                        await addDoc(collection(db, "messages"), msgData);

                        await updateDoc(doc(db, "rooms", activeRoomId), {
                            lastMessage: `${currentUser.name}: 傳送了圖片 📷`,
                            lastMessageTime: serverTimestamp()
                        });
                    } catch (error) {
                        console.error("傳送圖片失敗：", error);
                        alert("傳送圖片失敗，可能照片過大，請檢查網路。");
                    } finally {
                        document.getElementById('btnSend').disabled = false;
                        btnTriggerPhoto.disabled = false;
                        btnTriggerPhoto.innerText = '📷';
                        chatPhotoInput.value = ''; 
                    }
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        // ================= 訊息點擊操作 (回覆/收回) =================
        window.openMsgAction = function(msgId, isMine, timestampMs, sender, text) {
            selectedMsgForAction = { id: msgId, sender, text, isMine, timestampMs };
            
            const btnRetract = document.getElementById('btnActionRetract');
            const hoursPassed = (Date.now() - timestampMs) / (1000 * 60 * 60);
            if (isMine && hoursPassed < 24) {
                btnRetract.style.display = 'block';
            } else {
                btnRetract.style.display = 'none';
            }

            document.getElementById('msgActionModal').style.display = 'flex';
        };

        window.closeMsgActionModal = function(e) {
            if (e.target.id === 'msgActionModal' || e.target.tagName === 'BUTTON') {
                document.getElementById('msgActionModal').style.display = 'none';
            }
        };

        window.triggerReply = function() {
            pendingReplyMsgId = selectedMsgForAction.id;
            pendingReplyData = { sender: selectedMsgForAction.sender, text: selectedMsgForAction.text };
            
            document.getElementById('replyPreviewSender').innerText = selectedMsgForAction.sender;
            document.getElementById('replyPreviewText').innerText = selectedMsgForAction.text;
            document.getElementById('replyPreviewArea').style.display = 'flex';
            
            document.getElementById('msgActionModal').style.display = 'none';
            chatInput.focus();
        };

        window.cancelReply = function() {
            pendingReplyMsgId = null;
            pendingReplyData = null;
            document.getElementById('replyPreviewArea').style.display = 'none';
        };

        window.triggerRetract = async function() {
            if (!confirm("確定要收回此訊息嗎？")) return;
            try {
                await updateDoc(doc(db, "messages", selectedMsgForAction.id), {
                    isRetracted: true,
                    text: "", 
                    imageUrl: null
                });
            } catch(e) { alert("收回失敗，請檢查網路"); }
            document.getElementById('msgActionModal').style.display = 'none';
        };


        // ================= Modal 群組設定邏輯 =================
        document.getElementById('groupAvatarInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxSize = 200;
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } } 
                    else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    uploadedAvatarBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('modalAvatarPreview').src = uploadedAvatarBase64;
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        function populateMemberCheckboxes(selectedNames = []) {
            const container = document.getElementById('memberListContainer');
            container.innerHTML = '';
            allUsers.forEach(u => {
                const isChecked = selectedNames.includes(u.name);
                const label = document.createElement('label');
                label.className = 'member-item';
                label.innerHTML = `<input type="checkbox" value="${u.name}" ${isChecked ? 'checked' : ''}> <span>${u.name}</span>`;
                container.appendChild(label);
            });
        }

        document.getElementById('btnOpenCreateModal').addEventListener('click', () => {
            modalMode = 'create';
            document.getElementById('modalTitle').innerText = '建立新群組';
            document.getElementById('modalGroupName').value = '';
            uploadedAvatarBase64 = null;
            document.getElementById('modalAvatarPreview').src = 'https://ui-avatars.com/api/?name=G&background=4caf50&color=fff';
            populateMemberCheckboxes([]);
            document.getElementById('groupModal').style.display = 'flex';
        });

        document.getElementById('btnOpenEditModal').addEventListener('click', () => {
            modalMode = 'edit';
            document.getElementById('modalTitle').innerText = '編輯群組設定';
            document.getElementById('modalGroupName').value = activeRoomData.name;
            uploadedAvatarBase64 = activeRoomData.avatar || null;
            document.getElementById('modalAvatarPreview').src = activeRoomData.avatar || `https://ui-avatars.com/api/?name=${activeRoomData.name}&background=e3f2fd&color=1565c0`;
            populateMemberCheckboxes(activeRoomData.participants || []);
            document.getElementById('groupModal').style.display = 'flex';
        });

        document.getElementById('btnCancelModal').addEventListener('click', () => {
            document.getElementById('groupModal').style.display = 'none';
        });

        document.getElementById('btnConfirmModal').addEventListener('click', async () => {
            const nameInput = document.getElementById('modalGroupName').value.trim();
            if (!nameInput) { alert('請輸入群組名稱！'); return; }

            const checkboxes = document.querySelectorAll('#memberListContainer input[type="checkbox"]:checked');
            const participants = [currentUser.name, ...Array.from(checkboxes).map(cb => cb.value)];

            try {
                if (modalMode === 'create') {
                    await addDoc(collection(db, "rooms"), {
                        name: nameInput,
                        avatar: uploadedAvatarBase64 || '',
                        participants: participants,
                        creator: currentUser.name,
                        lastMessage: '群組已建立',
                        lastMessageTime: serverTimestamp()
                    });
                } else if (modalMode === 'edit' && activeRoomId) {
                    await updateDoc(doc(db, "rooms", activeRoomId), {
                        name: nameInput,
                        avatar: uploadedAvatarBase64 || '',
                        participants: participants
                    });
                    activeRoomData.name = nameInput;
                    if(uploadedAvatarBase64) activeRoomData.avatar = uploadedAvatarBase64;
                    document.getElementById('activeRoomName').innerText = nameInput;
                    document.getElementById('activeRoomAvatar').src = uploadedAvatarBase64 || `https://ui-avatars.com/api/?name=${nameInput}&background=e3f2fd&color=1565c0`;
                }
                document.getElementById('groupModal').style.display = 'none';
            } catch (e) {
                console.error("儲存群組失敗：", e);
                alert("儲存失敗，請檢查網路！");
            }
        });

        document.getElementById('btnBackToDashboard').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
