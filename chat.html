<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus - 聊天室</title>
    <link rel="icon" href="homebase_icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="homebase_icon.jpg">
    <meta name="apple-mobile-web-app-title" content="HomeBase">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- 引入抽離的 CSS -->
    <link rel="stylesheet" href="css/chat.css"> 
</head>
<body>
    <div class="top-nav" id="mainTopNav">
        <button class="btn-back" id="btnBackToDashboard">❮ 返回主選單</button>
        <div style="width: 80px;"></div>
    </div>

    <!-- 視圖 1：群組清單 -->
    <div class="view-container" id="viewRoomList">
        <div class="list-header">
            <span class="list-title">💬 聊天群組</span>
            <button class="btn-new-chat" id="btnOpenCreateModal">➕ 建立群組</button>
        </div>
        <div class="room-list-content" id="roomListContainer">
            <div style="text-align:center; padding:30px; font-weight: 600; color: var(--text-sub);">讀取群組中...</div>
        </div>
    </div>

    <!-- 視圖 2：聊天室內部 -->
    <div class="view-container" id="viewChatRoom" style="display: none;">
        <div class="chat-header">
            <div class="chat-header-left" id="btnBackToList">
                <span style="font-size: 20px; margin-right: 4px;">❮</span>
                <img id="activeRoomAvatar" class="chat-header-avatar" src="" alt="">
                <span id="activeRoomName" class="chat-header-name">載入中...</span>
            </div>
            <!-- 開啟設定選單 -->
            <button class="btn-room-settings" id="btnOpenSettingsMenu">⚙️</button>
        </div>
        
        <div class="chat-messages" id="chatMessages"></div>
        
        <div class="input-container-wrapper">
            <div class="reply-preview-area" id="replyPreviewArea">
                <div class="reply-preview-text-box">
                    <strong id="replyPreviewSender" style="color:var(--primary-dark);"></strong><br>
                    <span id="replyPreviewText"></span>
                </div>
                <button class="btn-cancel-reply" onclick="window.chatCore.cancelReply()">✕</button>
            </div>
            
            <!-- @ 標註清單 -->
            <div class="mention-dropdown" id="mentionDropdown"></div>

            <div class="chat-input-area">
                <button class="btn-upload-photo" id="btnTriggerPhoto" title="傳送圖片">📷</button>
                <input type="file" id="chatPhotoInput" accept="image/*" style="display: none;">
                <input type="text" id="chatInput" placeholder="輸入訊息... (輸入 @ 可標註家人)" autocomplete="off">
                <button class="btn-send" id="btnSend">傳送</button>
            </div>
        </div>
    </div>

    <!-- 動作選單 (長按訊息使用) -->
    <div class="msg-action-modal" id="msgActionModal" onclick="window.chatCore.closeMsgActionModal(event)">
        <div class="msg-action-content">
            <button class="action-btn" id="btnActionReply" onclick="window.chatCore.triggerReply()">回覆此訊息</button>
            <button class="action-btn danger" id="btnActionRetract" onclick="window.chatCore.triggerRetract()" style="display:none;">收回訊息 (24小時內)</button>
            <button class="action-btn" style="background:#e5e7eb; margin-bottom:0;">取消</button>
        </div>
    </div>

    <!-- ================= 核心：全新 LINE 風格設定與各項 Modal ================= -->
    
    <!-- 1. 新增群組 Modal -->
    <div class="modal" id="createGroupModal">
        <div class="modal-content">
            <div class="modal-header" style="padding:0 0 16px 0; border:none;">
                <h3>建立新群組</h3>
            </div>
            <div class="avatar-upload-area" style="padding:0 0 16px 0;">
                <img id="createAvatarPreview" class="preview-group-avatar" src="https://ui-avatars.com/api/?name=G&background=10b981&color=fff">
                <button class="btn-upload" onclick="document.getElementById('createAvatarInput').click()">📷 上傳頭像</button>
                <input type="file" id="createAvatarInput" accept="image/*" style="display: none;">
            </div>
            <div class="form-group" style="padding:0;">
                <label>群組名稱</label>
                <input type="text" id="createGroupName" placeholder="例如：爸爸與俊俊的秘密基地">
            </div>
            <div class="form-group" style="padding:0;">
                <label>選擇參與家人</label>
                <div class="member-checkbox-list" id="createMemberList"></div>
            </div>
            <div class="modal-btns">
                <button class="btn-modal-cancel" onclick="window.chatRooms.closeModal('createGroupModal')">取消</button>
                <button class="btn-modal-confirm" id="btnConfirmCreate">建立</button>
            </div>
        </div>
    </div>

    <!-- 2. LINE 風格群組設定主選單 (全螢幕上滑) -->
    <div class="full-modal" id="roomSettingsMenu">
        <div class="full-modal-content">
            <div class="modal-header">
                <button class="btn-close" onclick="window.chatRooms.closeModal('roomSettingsMenu')">❮</button>
                <h3>聊天室設定</h3>
                <span style="width: 24px;"></span>
            </div>
            <!-- 上方三大圖示 -->
            <div class="settings-top-bar">
                <div class="settings-icon-btn" onclick="window.chatRooms.openViewMembers()">
                    <div class="icon">👥</div>
                    <span>成員</span>
                </div>
                <div class="settings-icon-btn" onclick="window.chatRooms.openInviteMembers()">
                    <div class="icon">➕</div>
                    <span>邀請</span>
                </div>
                <div class="settings-icon-btn" onclick="window.chatRooms.leaveGroup()">
                    <div class="icon" style="color:var(--danger); background:#fee2e2;">🚪</div>
                    <span style="color:var(--danger);">退出</span>
                </div>
            </div>
            <!-- 下方列表 -->
            <div class="settings-menu-list">
                <div class="settings-menu-item" onclick="window.chatRooms.openPhotoGallery()">
                    <span>群組照片</span>
                    <span class="arrow">❯</span>
                </div>
                <div class="settings-menu-item" onclick="window.chatRooms.openSubModal('editGroupModal')">
                    <span>設定 (變更群組名稱與頭像)</span>
                    <span class="arrow">❯</span>
                </div>
                <div class="settings-menu-item" onclick="window.chatRooms.exportChatHistory()">
                    <span>傳送聊天記錄 (匯出txt)</span>
                    <span class="arrow">❯</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 2-1. 相片集 (子畫面) -->
    <div class="full-modal" id="photoGalleryModal">
        <div class="full-modal-content">
            <div class="modal-header">
                <button class="btn-close" onclick="window.chatRooms.backToSettings('photoGalleryModal')">❮</button>
                <h3>群組照片</h3>
                <span style="width: 24px;"></span>
            </div>
            <div class="gallery-grid" id="galleryGrid">
                <!-- 照片會填入這裡 -->
            </div>
        </div>
    </div>

    <!-- 2-2. 變更群組名稱與頭像 (子畫面) -->
    <div class="full-modal" id="editGroupModal">
        <div class="full-modal-content">
            <div class="modal-header">
                <button class="btn-close" onclick="window.chatRooms.backToSettings('editGroupModal')">❮</button>
                <h3>群組設定</h3>
                <span style="width: 24px;"></span>
            </div>
            <div style="flex:1; overflow-y:auto;">
                <div class="avatar-upload-area">
                    <img id="editAvatarPreview" class="preview-group-avatar" src="">
                    <button class="btn-upload" onclick="document.getElementById('editAvatarInput').click()">📷 變更頭像</button>
                    <input type="file" id="editAvatarInput" accept="image/*" style="display: none;">
                </div>
                <div class="form-group">
                    <label>群組名稱</label>
                    <input type="text" id="editGroupName">
                </div>
                <button class="btn-save-bottom" id="btnSaveGroupEdit">儲存變更</button>
            </div>
        </div>
    </div>

    <!-- 2-3. 純檢視成員 (子畫面) -->
    <div class="full-modal" id="viewMembersModal">
        <div class="full-modal-content">
            <div class="modal-header">
                <button class="btn-close" onclick="window.chatRooms.backToSettings('viewMembersModal')">❮</button>
                <h3>群組成員</h3>
                <span style="width: 24px;"></span>
            </div>
            <div style="flex:1; padding: 20px; overflow-y:auto;">
                <div class="member-checkbox-list" id="viewMemberList"></div>
            </div>
        </div>
    </div>

    <!-- 2-4. 邀請成員 (子畫面) -->
    <div class="full-modal" id="inviteMembersModal">
        <div class="full-modal-content">
            <div class="modal-header">
                <button class="btn-close" onclick="window.chatRooms.backToSettings('inviteMembersModal')">❮</button>
                <h3>邀請成員</h3>
                <span style="width: 24px;"></span>
            </div>
            <div style="flex:1; padding: 20px; overflow-y:auto;">
                <label style="font-size:14px; font-weight:700; color:var(--text-sub);">勾選以邀請家人加入群組</label>
                <div class="member-checkbox-list" id="inviteMemberList" style="margin-top:10px;"></div>
                <button class="btn-save-bottom" id="btnSaveInvite" style="margin: 20px 0 0 0; width:100%;">新增成員</button>
            </div>
        </div>
    </div>

    <!-- 圖片全螢幕檢視器 -->
    <div id="photoViewerModal" class="photo-viewer" onclick="window.chatCore.closePhotoViewer()">
        <span class="close-viewer">✕</span>
        <!-- 點擊圖片本身不關閉預覽，阻止事件冒泡 -->
        <img class="viewer-content" id="viewerImage" onclick="event.stopPropagation()">
    </div>

    <!-- 引入拆分的 JS 模組 -->
    <script type="module" src="js/chat-core.js"></script>
    <script type="module" src="js/chat-rooms.js"></script>
</body>
</html>
