<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script src="js/theme-bootstrap.js"></script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./Nexus.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nexus">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#10b981">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus - 待辦</title>
    <link rel="icon" href="Nexus.png" type="image/jpeg">
    <style>
        /* === 核心變數設計系統 (與 Nexus 保持一致) === */
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            
            --accent: #f59e0b;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            
            --bg-body: #fbfbfc;        
            --bg-card: #ffffff;
            --text-main: #111827;     
            --text-sub: #6b7280;
            --border-color: #cbd5e1;  
            
            --shadow-soft: 0 6px 16px rgba(0, 0, 0, 0.08); 
            --shadow-hover: 0 10px 24px rgba(0, 0, 0, 0.12);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        /* === 基礎重置與 RWD 排版 === */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-body); 
            margin: 0; 
            padding: 16px 16px 100px 16px; 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden; 
        }

        .todo-container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            background: var(--n-surface, #fff);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .back-btn:active { transform: scale(0.96); background: var(--bg-body); }

        /* === 卡片與標題 === */
        .nexus-card { 
            background: var(--bg-card); 
            border-radius: var(--radius-lg); 
            padding: 20px; 
            box-shadow: var(--shadow-soft); 
            border: 1px solid var(--border-color); 
            margin-bottom: 20px; 
        }

        .todo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .todo-header h2 { margin: 0; font-size: 1.25rem; font-weight: 900; color: var(--text-main); }
        
        .category-bar { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .category-bar::-webkit-scrollbar { display: none; }
        
        .cat-btn { background: var(--bg-body); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: 700; color: var(--text-sub); transition: all 0.2s; position: relative; white-space: nowrap; flex-shrink: 0; }
        .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .cat-btn .del-cat { margin-left: 6px; font-size: 0.8rem; color: #9ca3af; border-radius: 50%; padding: 0 4px; }
        .cat-btn .del-cat:hover { background: rgba(0,0,0,0.1); color: var(--danger); }

        .section-sub-title { font-size: 0.95rem; font-weight: 800; color: var(--text-main); margin: 16px 0 10px 4px; display: flex; align-items: center; gap: 6px; }

        .todo-list { display: flex; flex-direction: column; gap: 10px; }
        .todo-item { background: var(--n-surface, #fff); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px 16px; display: flex; align-items: flex-start; justify-content: space-between; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .todo-item.completed { background: var(--n-soft, #f3f4f6); opacity: 0.65; text-decoration: line-through; }
        .todo-item-content { display: flex; gap: 12px; align-items: flex-start; flex: 1; }
        .todo-details { font-size: 0.8rem; color: var(--text-sub); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
        .badge { background: var(--bg-body); border: 1px solid var(--border-color); padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; color: var(--text-main); font-weight: 600; }
        .empty-state { text-align: center; color: var(--text-sub); padding: 20px; font-size: 0.9rem; font-weight: 600; background: var(--bg-body); border-radius: var(--radius-md); border: 1px dashed var(--border-color); }

        /* 列表操作按鈕 (編輯/刪除) */
        .todo-actions { display: flex; gap: 4px; align-items: center; }
        .action-btn { background: none; border: none; cursor: pointer; transition: 0.2s; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .action-btn:hover { background: var(--bg-body); }
        .action-btn.edit { font-size: 1.1rem; }
        .action-btn.delete { font-size: 1.4rem; color: var(--text-sub); line-height: 1; }
        .action-btn.delete:hover { color: var(--danger); }

        .fixed-bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: center; align-items: center; z-index: 1000; box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05); }
        .fab-btn-container { width: 100%; max-width: 500px; display: flex; justify-content: flex-end; }
        .fab-btn { width: 54px; height: 54px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); cursor: pointer; border: none; transition: 0.2s; }
        .fab-btn:active { transform: scale(0.92); background: var(--primary-dark); }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(5px); z-index: 5000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--n-surface, #fff); padding: 24px; border-radius: var(--radius-lg); width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; animation: slideUp 0.3s ease-out; border: 1px solid var(--border-color); max-height: 90vh; overflow-y: auto; }
        
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 14px; border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 15px; font-family: inherit; transition: 0.2s; background: var(--n-surface, #fff); }
        .form-control:focus { outline: none; border-color: var(--primary); }
        textarea.form-control { resize: vertical; min-height: 84px; line-height: 1.5; }

        .category-options { display: flex; flex-wrap: wrap; gap: 8px; }
        .category-btn { background: var(--n-surface, #fff); border: 2px solid var(--border-color); padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; color: var(--text-sub); cursor: pointer; text-align: center; transition: 0.2s; white-space: nowrap; }
        .category-btn.active { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary); }
        .category-btn-add { background: var(--n-soft, #f3f4f6); color: var(--primary); border: 2px dashed var(--border-color); }
        .category-btn-add:active { transform: scale(0.96); }

        .deadline-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .deadline-btn { background: var(--n-surface, #fff); border: 2px solid var(--border-color); padding: 10px 4px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; color: var(--text-sub); cursor: pointer; text-align: center; transition: 0.2s; }
        .deadline-btn.active { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary); }

        .assignee-avatar-grid { display: flex; flex-wrap: wrap; gap: 8px; max-height: 140px; overflow-y: auto; padding: 4px; }
        .assignee-chip { display: flex; align-items: center; gap: 6px; background: var(--bg-body); border: 2px solid var(--border-color); padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: 0.2s; user-select: none; }
        .assignee-chip.selected { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); font-weight: 700; }
        .assignee-chip img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

        .modal-btns { display: flex; gap: 12px; margin-top: 20px; }
        .modal-btns button { flex: 1; padding: 12px; border-radius: var(--radius-md); font-size: 15px; font-weight: 800; cursor: pointer; border: none; transition: 0.2s; }
        .modal-btns button:first-child { background: var(--n-soft, #f3f4f6); color: var(--n-text, #292c30); }
        .modal-btns button:last-child { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .modal-btns button:active { transform: scale(0.96); }

        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); justify-content: center; align-items: center; font-size: 18px; font-weight: 800; color: var(--primary); z-index: 6000; flex-direction: column; gap: 16px; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <link rel="stylesheet" href="css/todo-enhancements.css">
    <link rel="stylesheet" href="css/nexus-theme.css">
    <script type="module" src="js/ui-icons.js"></script>
    <link rel="stylesheet" href="css/app-navigation.css">
    <script type="module" src="js/app-navigation.js"></script>
</head>
<body data-app-page="todo">

    <div class="loading-overlay" id="loadingView"><span>處理中，請稍候...</span></div>

    <div class="todo-container">
        <!-- 頂端導覽 -->
        <div class="top-nav">
            <button class="back-btn" data-main-menu-back onclick="window.location.href='index.html'">返回主選單</button>
            <span id="todo-loading-status" style="font-size:0.8rem; color:var(--text-sub);"></span>
        </div>

        <!-- 待辦事項主卡片 -->
        <div class="nexus-card" id="nexus-todo-container" data-group-id="">
            <div class="todo-header">
                <h2>待辦</h2>
                <button type="button" class="recurring-trigger" data-action="open-recurring" data-write disabled>↻ 循環待辦</button>
            </div>

            <div class="category-bar" id="category-container">
                <button class="cat-btn active" data-category="all" onclick="NexusTodoApp.filterCategory('all')">全部</button>
            </div>

            <!-- 未完成待辦事項區塊 -->
            <div class="section-sub-title"><span data-ui-icon="todo"></span>待辦事項</div>
            <div class="todo-list" id="todo-list-container">
                <div class="empty-state">目前尚無未完成待辦</div>
            </div>

            <details class="completed-section" id="completed-section">
                <summary>已完成事項 <span id="completed-total">0</span></summary>
                <div class="completed-tabs" role="tablist" aria-label="完成紀錄">
                    <button type="button" id="completed-tab-today" role="tab" aria-selected="true" aria-controls="completed-list-container" data-action="completed-tab" data-value="today">今日完成</button>
                    <button type="button" id="completed-tab-history" role="tab" aria-selected="false" aria-controls="completed-list-container" data-action="completed-tab" data-value="history">過往完成</button>
                </div>
                <div class="todo-list" id="completed-list-container" role="tabpanel"></div>
                <div class="completed-pagination" id="completed-pagination"></div>
            </details>
        </div>
    </div>

    <!-- 底部固定懸浮導覽列 -->
    <div class="fixed-bottom-bar">
        <div class="fab-btn-container">
            <button class="fab-btn" data-write disabled onclick="NexusTodoApp.openAddModal()" title="新增待辦">＋</button>
        </div>
    </div>

    <!-- 新增/編輯 待辦彈跳視窗 Modal -->
    <div class="modal" id="addTodoModal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0; font-size:20px; font-weight:900; margin-bottom:16px;">新增待辦事項</h3>
            
            <div class="form-group">
                <label class="form-label">待辦名稱</label>
                <textarea id="new-todo-title" class="form-control" placeholder="輸入待辦內容..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">選擇類型</label>
                <div class="category-options" id="new-todo-category-container">
                    <!-- 動態載入分類按鈕與 + 新增自訂類別按鈕 -->
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">選擇期限</label>
                <div class="deadline-options">
                    <button type="button" class="deadline-btn active" id="dl-today" onclick="NexusTodoApp.selectDeadline('today', '今天')">今天</button>
                    <button type="button" class="deadline-btn" id="dl-tomorrow" onclick="NexusTodoApp.selectDeadline('tomorrow', '明天')">明天</button>
                    <button type="button" class="deadline-btn" id="dl-weekend" onclick="NexusTodoApp.selectDeadline('weekend', '週末')">週末</button>
                    <button type="button" class="deadline-btn" id="dl-custom" onclick="NexusTodoApp.triggerCustomDate()">日期</button>
                </div>
                <input type="date" id="hidden-date-picker" style="display:none;" onchange="NexusTodoApp.handleCustomDateChange(this.value)">
            </div>

            <div class="form-group">
                <label class="form-label">指派人員 (可多選)</label>
                <div class="assignee-avatar-grid" id="assigneeAvatarContainer">
                    <!-- 動態載入：第一個固定為所有人員，後面為群組成員頭像 -->
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">備註說明 (選填)</label>
                <textarea id="new-todo-note" class="form-control" placeholder="補充說明..." rows="2" style="min-height:50px;"></textarea>
            </div>

            <div class="modal-btns">
                <button onclick="NexusTodoApp.closeAddModal()">取消</button>
                <button id="modal-submit-btn" data-write onclick="NexusTodoApp.saveTodo()">確認新增</button>
            </div>
        </div>
    </div>

    <div class="modal" id="recurringTodoModal" role="dialog" aria-modal="true" aria-labelledby="recurring-modal-title">
        <div class="modal-content">
            <h3 id="recurring-modal-title" style="margin-top:0">建立循環待辦</h3>
            <div class="form-group">
                <label class="form-label" for="recurring-title">待辦名稱</label>
                <input class="form-control" id="recurring-title" placeholder="例如：倒垃圾">
            </div>
            <div class="form-group">
                <label class="form-label" for="recurring-note">備註（選填）</label>
                <textarea class="form-control" id="recurring-note" placeholder="補充說明"></textarea>
            </div>
            <div class="form-group">
                <span class="form-label">負責人（可多選）</span>
                <div class="assignee-avatar-grid" id="recurringAssigneeContainer"></div>
            </div>
            <div class="form-group">
                <span class="form-label">循環設定</span>
                <div class="frequency-options">
                    <button type="button" data-action="frequency" data-value="daily" aria-pressed="true">每天</button>
                    <button type="button" data-action="frequency" data-value="weekly" aria-pressed="false">每週</button>
                    <button type="button" data-action="frequency" data-value="monthly" aria-pressed="false">每月</button>
                    <button type="button" data-action="frequency" data-value="yearly" aria-pressed="false">每年</button>
                </div>
                <p class="form-hint" id="recurring-frequency-hint"></p>
            </div>
            <div class="form-group">
                <label class="form-label" for="recurring-interval">每日循環間隔天數（1–30 天）</label>
                <input class="form-control" id="recurring-interval" type="number" min="1" max="30" step="1" value="1">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="recurring-start-date">開始日期</label>
                    <input class="form-control" id="recurring-start-date" type="date">
                </div>
                <div class="form-group">
                    <label class="form-label" for="recurring-start-time">開始時間（台北時間）</label>
                    <input class="form-control" id="recurring-start-time" type="time" value="09:00">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="recurring-end-date">結束日期（選填，含當日）</label>
                <input class="form-control" id="recurring-end-date" type="date">
                <p class="form-hint">未填寫則持續循環，可在此停止。到期項目會在開啟待辦頁面時補齊；編輯單筆不影響後續循環。</p>
            </div>
            <div class="form-group">
                <span class="form-label">分類</span>
                <div class="category-options" id="recurring-category-container"></div>
            </div>
            <div class="modal-btns">
                <button type="button" data-action="close-recurring">取消</button>
                <button type="button" data-action="save-recurring" data-write>建立循環</button>
            </div>
            <div class="recurring-existing" id="recurring-existing"></div>
        </div>
    </div>

    <script type="module" src="js/todo.js"></script>
</body>
</html>
