<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus - 待辦</title>
    <link rel="icon" href="Nexus.png" type="image/jpeg">
    <link rel="apple-touch-icon" href="Nexus.png">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        /* === 核心變數設計系統 (與 Nexus 保持一致) === */
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            
            --accent: #f59e0b;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            
            --bg-body: #fbfbfc;        
            --bg-card: #ffffff;
            --text-main: #111827;     
            --text-sub: #6b7280;
            --border-color: #cbd5e1;  
            
            --shadow-soft: 0 6px 16px rgba(0, 0, 0, 0.08); 
            --shadow-hover: 0 10px 24px rgba(0, 0, 0, 0.12);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        /* === 基礎重置與 RWD 排版 === */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-body); 
            margin: 0; 
            padding: 16px 16px 90px 16px; 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden; 
        }

        .todo-container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .back-btn:active { transform: scale(0.96); background: var(--bg-body); }

        /* === 卡片與標題 === */
        .nexus-card { 
            background: var(--bg-card); 
            border-radius: var(--radius-lg); 
            padding: 20px; 
            box-shadow: var(--shadow-soft); 
            border: 1px solid var(--border-color); 
            margin-bottom: 20px; 
        }

        .todo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .todo-header h2 { margin: 0; font-size: 1.25rem; font-weight: 900; color: var(--text-main); }
        
        /* 分類按鈕列 (純篩選用，RWD 橫向捲動) */
        .category-bar { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .category-bar::-webkit-scrollbar { display: none; }
        
        .cat-btn { background: var(--bg-body); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: 700; color: var(--text-sub); transition: all 0.2s; position: relative; white-space: nowrap; flex-shrink: 0; }
        .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .cat-btn .del-cat { margin-left: 6px; font-size: 0.8rem; color: #9ca3af; border-radius: 50%; padding: 0 4px; }
        .cat-btn .del-cat:hover { background: rgba(0,0,0,0.1); color: var(--danger); }

        /* 區塊標題 */
        .section-sub-title { font-size: 0.95rem; font-weight: 800; color: var(--text-main); margin: 16px 0 10px 4px; display: flex; align-items: center; gap: 6px; }

        /* 待辦列表與已完成列表 */
        .todo-list { display: flex; flex-direction: column; gap: 10px; }
        .todo-item { background: white; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px 16px; display: flex; align-items: flex-start; justify-content: space-between; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .todo-item.completed { background: #f8fafc; opacity: 0.65; text-decoration: line-through; }
        .todo-item-content { display: flex; gap: 12px; align-items: flex-start; flex: 1; }
        .todo-details { font-size: 0.8rem; color: var(--text-sub); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
        .badge { background: var(--bg-body); border: 1px solid var(--border-color); padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; color: var(--text-main); font-weight: 600; }
        .empty-state { text-align: center; color: var(--text-sub); padding: 20px; font-size: 0.9rem; font-weight: 600; background: var(--bg-body); border-radius: var(--radius-md); border: 1px dashed var(--border-color); }

        /* 右下角懸浮新增按鈕 (FAB) */
        .fab-btn { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); cursor: pointer; border: none; z-index: 1000; transition: 0.2s; }
        .fab-btn:active { transform: scale(0.92); background: var(--primary-dark); }

        /* Modal 彈跳視窗 (新增待辦用) */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(5px); z-index: 5000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; padding: 24px; border-radius: var(--radius-lg); width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; animation: slideUp 0.3s ease-out; border: 1px solid var(--border-color); max-height: 90vh; overflow-y: auto; }
        
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 14px; border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 15px; font-family: inherit; transition: 0.2s; background: white; }
        .form-control:focus { outline: none; border-color: var(--primary); }
        
        textarea.form-control { resize: vertical; min-height: 84px; line-height: 1.5; } /* 至少 3 行中文高度 */

        /* 期限按鈕群組 */
        .deadline-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .deadline-btn { background: white; border: 2px solid var(--border-color); padding: 10px 4px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; color: var(--text-sub); cursor: pointer; text-align: center; transition: 0.2s; }
        .deadline-btn.active { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary); }

        /* 成員頭像多選清單 */
        .assignee-avatar-grid { display: flex; flex-wrap: wrap; gap: 8px; max-height: 140px; overflow-y: auto; padding: 4px; }
        .assignee-chip { display: flex; align-items: center; gap: 6px; background: var(--bg-body); border: 2px solid var(--border-color); padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: 0.2s; user-select: none; }
        .assignee-chip.selected { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); font-weight: 700; }
        .assignee-chip img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

        .modal-btns { display: flex; gap: 12px; margin-top: 20px; }
        .modal-btns button { flex: 1; padding: 12px; border-radius: var(--radius-md); font-size: 15px; font-weight: 800; cursor: pointer; border: none; transition: 0.2s; }
        .modal-btns button:first-child { background: #e2e8f0; color: #334155; }
        .modal-btns button:last-child { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .modal-btns button:active { transform: scale(0.96); }

        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); justify-content: center; align-items: center; font-size: 18px; font-weight: 800; color: var(--primary); z-index: 6000; flex-direction: column; gap: 16px; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingView"><span>處理中，請稍候...</span></div>

    <div class="todo-container">
        <!-- 頂端導覽 -->
        <div class="top-nav">
            <button class="back-btn" onclick="window.location.href='index.html'">← 返回主頁</button>
            <span id="todo-loading-status" style="font-size:0.8rem; color:var(--text-sub);"></span>
        </div>

        <!-- 待辦事項主卡片 -->
        <div class="nexus-card" id="nexus-todo-container" data-group-id="">
            <div class="todo-header">
                <h2>待辦</h2>
            </div>

            <!-- 分類選擇列 (純篩選用，無新增按鈕) -->
            <div class="category-bar" id="category-container">
                <button class="cat-btn active" data-category="all" onclick="NexusTodoApp.filterCategory('all')">全部</button>
                <!-- 動態載入類別篩選按鈕 -->
            </div>

            <!-- 未完成待辦事項區塊 -->
            <div class="section-sub-title">📋 待辦事項</div>
            <div class="todo-list" id="todo-list-container">
                <div class="empty-state">目前尚無未完成待辦</div>
            </div>

            <!-- 已完成區塊 -->
            <div class="section-sub-title" style="margin-top: 28px;">✨ 已完成</div>
            <div class="todo-list" id="completed-list-container">
                <div class="empty-state">目前尚無已完成項目</div>
            </div>
        </div>
    </div>

    <!-- 右下角懸浮新增按鈕 (FAB) -->
    <button class="fab-btn" onclick="NexusTodoApp.openAddModal()" title="新增待辦">＋</button>

    <!-- 新增待辦彈跳視窗 Modal -->
    <div class="modal" id="addTodoModal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-size:20px; font-weight:900; margin-bottom:16px;">新增待辦事項</h3>
            
            <div class="form-group">
                <label class="form-label">待辦內容 (至少三行高度)</label>
                <textarea id="new-todo-title" class="form-control" placeholder="輸入待辦內容..."></textarea>
            </div>

            <!-- 新增時挑選類別 (支援自訂類別) -->
            <div class="form-group">
                <label class="form-label">選擇類型</label>
                <select id="new-todo-category-select" class="form-control" onchange="NexusTodoApp.handleCategorySelectChange(this.value)">
                    <!-- 動態載入分類選項與 + 新增自訂類別 -->
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">選擇期限</label>
                <div class="deadline-options">
                    <button type="button" class="deadline-btn active" id="dl-today" onclick="NexusTodoApp.selectDeadline('today', '今天')">今天</button>
                    <button type="button" class="deadline-btn" id="dl-tomorrow" onclick="NexusTodoApp.selectDeadline('tomorrow', '明天')">明天</button>
                    <button type="button" class="deadline-btn" id="dl-weekend" onclick="NexusTodoApp.selectDeadline('weekend', '週末')">週末</button>
                    <button type="button" class="deadline-btn" id="dl-custom" onclick="NexusTodoApp.triggerCustomDate()">日期</button>
                </div>
                <input type="date" id="hidden-date-picker" style="display:none;" onchange="NexusTodoApp.handleCustomDateChange(this.value)">
            </div>

            <div class="form-group">
                <label class="form-label">指派人員 (可多選)</label>
                <div class="assignee-avatar-grid" id="assigneeAvatarContainer">
                    <!-- 動態載入：第一個固定為所有人員，後面為群組成員頭像 -->
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">備註說明 (選填)</label>
                <textarea id="new-todo-note" class="form-control" placeholder="補充說明..." rows="2" style="min-height:50px;"></textarea>
            </div>

            <div class="modal-btns">
                <button onclick="NexusTodoApp.closeAddModal()">取消</button>
                <button onclick="NexusTodoApp.createTodo()">確認新增</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCj3XrBxi1c3RokMzCIhEB3hjJB-BPuO9Y",
            authDomain: "homebasedb.firebaseapp.com",
            projectId: "homebasedb",
            storageBucket: "homebasedb.firebasestorage.app",
            messagingSenderId: "476832900272",
            appId: "1:476832900272:web:443bacb7cbc3113e9f8775"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const NexusTodoApp = {
            currentGroupId: null,
            groupMembers: [],
            selectedAssignees: ["所有人員"],
            state: {
                categories: ["工作", "生活", "採買"],
                todos: [],
                currentFilter: "all",
                selectedDeadline: "今天"
            },

            async init(groupId) {
                if (!groupId) groupId = localStorage.getItem('lastGroupId') || "default_group";
                this.currentGroupId = groupId;
                document.getElementById('nexus-todo-container').setAttribute('data-group-id', groupId);
                
                await this.fetchGroupMembersAndDataOnce(groupId);
            },

            // 關鍵效能優化：單次批次載入 (Single Fetch) 群組資料與成員清單，避免重複讀取
            async fetchGroupMembersAndDataOnce(groupId) {
                const statusEl = document.getElementById('todo-loading-status');
                statusEl.textContent = "同步中...";
                
                try {
                    // 1. 取得群組成員
                    const groupDocRef = doc(db, "groups", groupId);
                    const groupSnap = await getDoc(groupDocRef);
                    if (groupSnap.exists()) {
                        const gData = groupSnap.data();
                        const memberNames = gData.members || [];
                        this.groupMembers = [];
                        
                        for (let i = 0; i < memberNames.length; i += 10) {
                            const chunk = memberNames.slice(i, i + 10);
                            const userQ = query(collection(db, "users"), where("name", "in", chunk));
                            const userSnap = await getDocs(userQ);
                            userSnap.forEach(uDoc => {
                                this.groupMembers.push(uDoc.data());
                            });
                        }
                    }

                    if (this.groupMembers.length === 0) {
                        this.groupMembers = [{ name: "小明", avatar: "" }, { name: "小華", avatar: "" }];
                    }

                    // 2. 載入待辦資料
                    const cachedData = localStorage.getItem(`nexus_todo_${groupId}`);
                    if (cachedData) {
                        const parsed = JSON.parse(cachedData);
                        this.state.categories = parsed.categories || ["工作", "生活", "採買"];
                        this.state.todos = parsed.todos || [];
                    } else {
                        this.state.todos = [
                            { id: 1, title: "採買週末露營食材", category: "採買", deadline: "今天", assignees: ["小明", "小華"], note: "記得買無糖豆漿與肉片", completed: false },
                            { id: 2, title: "整理客廳雜物", category: "生活", deadline: "明天", assignees: ["所有人員"], note: "", completed: true }
                        ];
                    }

                    statusEl.textContent = "已同步";
                    setTimeout(() => statusEl.textContent = "", 1500);
                    
                    this.render();
                } catch (error) {
                    console.error("讀取失敗", error);
                    statusEl.textContent = "同步異常";
                    this.render();
                }
            },

            saveState() {
                localStorage.setItem(`nexus_todo_${this.currentGroupId}`, JSON.stringify({
                    categories: this.state.categories,
                    todos: this.state.todos
                }));
            },

            render() {
                this.renderCategories();
                this.renderCategorySelectOptions();
                this.renderTodoList();
                this.renderAssigneeChips();
            },

            // 渲染頂端分類篩選列 (一開始只看到「全部」與各類型按鈕，具備刪除功能)
            renderCategories() {
                const container = document.getElementById('category-container');
                let html = `<button class="cat-btn ${this.state.currentFilter === 'all' ? 'active' : ''}" onclick="NexusTodoApp.filterCategory('all')">全部</button>`;
                
                this.state.categories.forEach(cat => {
                    const isActive = this.state.currentFilter === cat ? 'active' : '';
                    html += `
                        <button class="cat-btn ${isActive}" onclick="NexusTodoApp.filterCategory('${cat}')">
                            ${cat}
                            <span class="del-cat" onclick="event.stopPropagation(); NexusTodoApp.deleteCategory('${cat}')" title="刪除分類">×</span>
                        </button>
                    `;
                });
                container.innerHTML = html;
            },

            // 渲染新增彈窗中的類型下拉選單（支援 + 新增自訂類別選項）
            renderCategorySelectOptions(selectedCat = '') {
                const selectEl = document.getElementById('new-todo-category-select');
                let html = '';
                this.state.categories.forEach(cat => {
                    const isSel = (selectedCat === cat || (!selectedCat && cat === this.state.categories[0])) ? 'selected' : '';
                    html += `<option value="${cat}" ${isSel}>${cat}</option>`;
                });
                html += `<option value="__add_new_cat__" style="color:var(--primary); font-weight:700;">+ 新增自訂類別...</option>`;
                selectEl.innerHTML = html;
            },

            // 監聽新增視窗中類別下拉選單的選擇
            handleCategorySelectChange(val) {
                if (val === '__add_new_cat__') {
                    const newCat = prompt("請輸入新的類別名稱：");
                    if (newCat && newCat.trim() !== "") {
                        const trimmed = newCat.trim();
                        if (!this.state.categories.includes(trimmed)) {
                            this.state.categories.push(trimmed);
                            this.saveState();
                            this.render();
                            // 自動選中剛新增的類別
                            document.getElementById('new-todo-category-select').value = trimmed;
                        } else {
                            alert("此類別已存在！");
                            document.getElementById('new-todo-category-select').value = this.state.categories[0];
                        }
                    } else {
                        document.getElementById('new-todo-category-select').value = this.state.categories[0];
                    }
                }
            },

            // 渲染指派人員頭像選擇區塊
            renderAssigneeChips() {
                const container = document.getElementById('assigneeAvatarContainer');
                let html = `
                    <div class="assignee-chip ${this.selectedAssignees.includes('所有人員') ? 'selected' : ''}" onclick="NexusTodoApp.toggleAssignee('所有人員')">
                        <span>👤 所有人員</span>
                    </div>
                `;
                
                this.groupMembers.forEach(m => {
                    const isSelected = this.selectedAssignees.includes(m.name);
                    const avatarUrl = m.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&background=10b981&color=fff`;
                    html += `
                        <div class="assignee-chip ${isSelected ? 'selected' : ''}" onclick="NexusTodoApp.toggleAssignee('${m.name}')">
                            <img src="${avatarUrl}" alt="${m.name}">
                            <span>${m.name}</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            },

            toggleAssignee(name) {
                if (name === '所有人員') {
                    this.selectedAssignees = ['所有人員'];
                } else {
                    if (this.selectedAssignees.includes('所有人員')) {
                        this.selectedAssignees = [];
                    }
                    if (this.selectedAssignees.includes(name)) {
                        this.selectedAssignees = this.selectedAssignees.filter(n => n !== name);
                        if (this.selectedAssignees.length === 0) {
                            this.selectedAssignees = ['所有人員'];
                        }
                    } else {
                        this.selectedAssignees.push(name);
                    }
                }
                this.renderAssigneeChips();
            },

            // 分別渲染未完成清單與已完成清單
            renderTodoList() {
                const filtered = this.state.currentFilter === 'all' 
                    ? this.state.todos 
                    : this.state.todos.filter(t => t.category === this.state.currentFilter);

                const activeTodos = filtered.filter(t => !t.completed);
                const completedTodos = filtered.filter(t => t.completed);

                // 未完成區塊
                const activeContainer = document.getElementById('todo-list-container');
                if (activeTodos.length === 0) {
                    activeContainer.innerHTML = `<div class="empty-state">目前尚無未完成待辦</div>`;
                } else {
                    activeContainer.innerHTML = activeTodos.map(item => this.renderTodoItemHTML(item)).join('');
                }

                // 已完成區塊
                const completedContainer = document.getElementById('completed-list-container');
                if (completedTodos.length === 0) {
                    completedContainer.innerHTML = `<div class="empty-state">目前尚無已完成項目</div>`;
                } else {
                    completedContainer.innerHTML = completedTodos.map(item => this.renderTodoItemHTML(item)).join('');
                }
            },

            renderTodoItemHTML(item) {
                return `
                    <div class="todo-item ${item.completed ? 'completed' : ''}">
                        <div class="todo-item-content">
                            <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="NexusTodoApp.toggleTodo(${item.id})" style="margin-top: 4px; width:18px; height:18px; accent-color:var(--primary); cursor: pointer;" />
                            <div>
                                <div style="font-weight: 700; font-size: 0.95rem; white-space: pre-wrap; word-break: break-all;">${item.title}</div>
                                <div class="todo-details">
                                    <span class="badge">📁 ${item.category}</span>
                                    <span class="badge">⏰ ${item.deadline}</span>
                                    <span class="badge">👤 ${item.assignees.join(', ')}</span>
                                    ${item.note ? `<span>📝 ${item.note}</span>` : ''}
                                </div>
                                ${item.completedAt ? `<div style="font-size: 0.75rem; color: var(--primary); margin-top: 4px; font-weight:600;">✓ 於 ${item.completedAt} 完成</div>` : ''}
                            </div>
                        </div>
                        <button onclick="NexusTodoApp.deleteTodo(${item.id})" style="background:none; border:none; color:var(--text-sub); cursor:pointer; font-size:1.2rem; padding: 0 4px;" title="刪除">×</button>
                    </div>
                `;
            },

            filterCategory(category) {
                this.state.currentFilter = category;
                this.renderCategories();
                this.renderTodoList();
            },

            deleteCategory(catName) {
                if (confirm(`確定要刪除分類「${catName}」嗎？`)) {
                    this.state.categories = this.state.categories.filter(c => c !== catName);
                    if (this.state.currentFilter === catName) {
                        this.state.currentFilter = 'all';
                    }
                    this.saveState();
                    this.render();
                }
            },

            openAddModal() {
                this.renderCategorySelectOptions();
                document.getElementById('addTodoModal').style.display = 'flex';
                document.getElementById('new-todo-title').focus();
            },

            closeAddModal() {
                document.getElementById('addTodoModal').style.display = 'none';
                document.getElementById('new-todo-title').value = '';
                document.getElementById('new-todo-note').value = '';
                this.selectedAssignees = ['所有人員'];
                this.renderAssigneeChips();
            },

            selectDeadline(type, label) {
                this.state.selectedDeadline = label;
                document.querySelectorAll('.deadline-btn').forEach(btn => btn.classList.remove('active'));
                if (type === 'today') document.getElementById('dl-today').classList.add('active');
                if (type === 'tomorrow') document.getElementById('dl-tomorrow').classList.add('active');
                if (type === 'weekend') document.getElementById('dl-weekend').classList.add('active');
            },

            triggerCustomDate() {
                document.getElementById('hidden-date-picker').style.display = 'block';
                document.getElementById('hidden-date-picker').showPicker?.();
                document.getElementById('hidden-date-picker').focus();
            },

            handleCustomDateChange(dateVal) {
                if (dateVal) {
                    this.state.selectedDeadline = dateVal;
                    const customBtn = document.getElementById('dl-custom');
                    customBtn.innerText = dateVal;
                    document.querySelectorAll('.deadline-btn').forEach(btn => btn.classList.remove('active'));
                    customBtn.classList.add('active');
                }
                document.getElementById('hidden-date-picker').style.display = 'none';
            },

            createTodo() {
                const titleInput = document.getElementById('new-todo-title');
                const categorySelect = document.getElementById('new-todo-category-select');
                const noteInput = document.getElementById('new-todo-note');
                const title = titleInput.value.trim();

                if (!title) {
                    alert("請輸入待辦內容！");
                    titleInput.focus();
                    return;
                }

                const targetCategory = categorySelect.value || this.state.categories[0] || '一般';

                const newTodo = {
                    id: Date.now(),
                    title: title,
                    category: targetCategory,
                    deadline: this.state.selectedDeadline,
                    assignees: this.selectedAssignees,
                    note: noteInput.value.trim(),
                    completed: false,
                    completedAt: null
                };

                this.state.todos.unshift(newTodo);
                this.saveState();
                this.render();
                this.closeAddModal();
            },

            toggleTodo(id) {
                const todo = this.state.todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    const now = new Date();
                    todo.completedAt = todo.completed ? `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` : null;
                    this.saveState();
                    this.renderTodoList();
                }
            },

            deleteTodo(id) {
                if (confirm("確定要刪除這項待辦嗎？")) {
                    this.state.todos = this.state.todos.filter(t => t.id !== id);
                    this.saveState();
                    this.renderTodoList();
                }
            }
        };

        window.NexusTodoApp = NexusTodoApp;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const groupId = urlParams.get('groupId') || localStorage.getItem('lastGroupId');
            NexusTodoApp.init(groupId);
        });
    </script>
</body>
</html>
